# Exemples concrets pour les commandes GAM les plus courantes, ajoutés au build aux entrées générées depuis le wiki.
# Clé = identifiant de l'entrée dans public/data/reference/gam.json (le build échoue si elle n'existe plus).
# `desc` remplace la description anglaise ; `ex` passe avant la syntaxe du wiki. Adresses fictives (example.com) : à adapter.
# Chaque syntaxe a été reprise de la ligne « syn » de l'entrée ; vérifiez toujours la page du wiki avant un traitement en masse.

# --- Utilisateurs ---
gam-create-user:
  desc: Créer un compte utilisateur, avec mot de passe temporaire à changer à la première connexion.
  ex:
    - gam create user alice.martin@example.com firstname Alice lastname Martin password "Temporaire-2026!" changepassword on org "/Comptabilite"
gam-update-user:
  desc: Modifier un compte existant (mot de passe, nom, unité d'organisation…).
  ex:
    - gam update user alice.martin@example.com password "Nouveau-2026!" changepassword on
    - gam update user alice.martin@example.com org "/Direction"
gam-update-user-3:
  desc: Changer l'adresse principale d'un compte (mariage, faute de frappe, changement de nom de domaine).
  ex:
    - gam update user alice.dupont@example.com primaryemail alice.martin@example.com
gam-info-user:
  desc: Afficher la fiche complète d'un utilisateur (alias, groupes, licences, dernière connexion).
  ex:
    - gam info user alice.martin@example.com
gam-print-users:
  desc: Exporter la liste des utilisateurs en CSV, avec les colonnes utiles à un inventaire.
  ex:
    - gam redirect csv ./utilisateurs.csv print users fields primaryemail,name,orgunitpath,suspended,lastlogintime
    - gam print users query "orgUnitPath='/Comptabilite'"
gam-suspend-user:
  desc: Suspendre un compte (départ, compte compromis) sans supprimer ses données.
  ex:
    - gam suspend user alice.martin@example.com
gam-unsuspend-user:
  desc: Réactiver un compte suspendu.
  ex:
    - gam unsuspend user alice.martin@example.com
gam-delete-user:
  desc: "Supprimer un compte. Transférez d'abord ses fichiers Drive (voir « transfer drive ») : ils partent avec le compte."
  ex:
    - gam delete user ancien.salarie@example.com
gam-undelete-user:
  desc: Restaurer un compte supprimé récemment (Google laisse environ 20 jours), dans l'unité d'organisation choisie.
  ex:
    - gam undelete user ancien.salarie@example.com org "/Anciens"
gam-whatis:
  desc: Savoir si une adresse est un utilisateur, un groupe ou un alias (et de quoi).
  ex:
    - gam whatis contact@example.com
gam-usertypeentity-update-photo-2:
  desc: Mettre à jour la photo de profil d'un utilisateur à partir d'un fichier image.
  ex:
    - gam user alice.martin@example.com update photo alice.jpg

# --- Sécurité et départs ---
gam-usertypeentity-signout:
  desc: Déconnecter un utilisateur de toutes ses sessions (compte compromis, téléphone perdu).
  ex:
    - gam user alice.martin@example.com signout
gam-usertypeentity-turnoff2sv:
  desc: Désactiver la validation en deux étapes d'un utilisateur qui a perdu son téléphone ; il devra la réactiver.
  ex:
    - gam user alice.martin@example.com turnoff2sv
gam-usertypeentity-deprovision-deprov:
  desc: "Départ d'un salarié : révoque mots de passe d'application, jetons et codes de secours ; les options coupent aussi POP/IMAP, les sessions et la 2SV."
  ex:
    - gam user ancien.salarie@example.com deprovision popimap signout turnoff2sv
gam-usertypeentity-transfer-drive:
  desc: Transférer tous les fichiers Drive d'un compte vers un autre (à faire avant la suppression).
  ex:
    - gam user ancien.salarie@example.com transfer drive responsable@example.com

# --- Gmail : délégation, transfert, absence, signature ---
gam-usertypeentity-delegate-delegates-to:
  desc: "Déléguer une boîte Gmail : l'utilisateur délégué peut lire, envoyer et supprimer des messages au nom du titulaire."
  ex:
    - gam user direction@example.com delegate to assistante@example.com
    - gam user direction@example.com show delegates
gam-usertypeentity-add-delegate-delegates:
  desc: Ajouter un délégué à une boîte Gmail (même effet que « delegate to »).
  ex:
    - gam user direction@example.com add delegate assistante@example.com
gam-usertypeentity-delete-del-delegate-delegates:
  desc: Retirer un délégué d'une boîte Gmail.
  ex:
    - gam user direction@example.com delete delegate assistante@example.com
gam-usertypeentity-show-delegates-delegate:
  desc: Afficher les délégués d'une boîte Gmail.
  ex:
    - gam user direction@example.com show delegates shownames
gam-usertypeentity-print-delegates-delegate:
  desc: Exporter toutes les délégations Gmail du domaine en CSV (audit).
  ex:
    - gam redirect csv ./delegations.csv all users print delegates shownames
gam-usertypeentity-add-forwardingaddress-forwardingaddresses:
  desc: Déclarer une adresse de transfert (étape préalable à « forward on » ; le destinataire peut devoir la confirmer).
  ex:
    - gam user alice.martin@example.com add forwardingaddress accueil@example.com
gam-usertypeentity-forward-2:
  desc: Activer le transfert automatique des messages vers une adresse déjà déclarée, en gardant une copie.
  ex:
    - gam user alice.martin@example.com forward on keep accueil@example.com
gam-usertypeentity-forward:
  desc: Désactiver le transfert automatique.
  ex:
    - gam user alice.martin@example.com forward off
gam-usertypeentity-show-forward-forwards:
  desc: Vérifier si une boîte transfère ses messages, et vers où.
  ex:
    - gam user alice.martin@example.com show forward
gam-usertypeentity-vacation:
  desc: Activer ou couper la réponse automatique d'absence.
  ex:
    - gam user alice.martin@example.com vacation on subject "Absente" message "Je suis absente jusqu'au 5 janvier. Pour toute urgence: accueil@example.com"
    - gam user alice.martin@example.com vacation off
gam-usertypeentity-signature-file-sigtemplate-txt-html:
  desc: Appliquer une signature HTML à partir d'un fichier.
  ex:
    - gam user alice.martin@example.com signature file signature.html html
gam-usertypeentity-create-update-sendas:
  desc: 'Ajouter une adresse « Envoyer en tant que » (alias ou boîte partagée).'
  ex:
    - gam user alice.martin@example.com create sendas contact@example.com name "Contact Example"
gam-usertypeentity-print-messages:
  desc: Lister des messages d'une boîte avec une recherche Gmail (expéditeur, date…).
  ex:
    - gam user alice.martin@example.com print messages query "from:factures@fournisseur.example newer_than:7d"
gam-usertypeentity-delete-messages-threads:
  desc: "Supprimer des messages (ex. campagne d'hameçonnage). Sans « doit », GAM affiche seulement ce qu'il supprimerait."
  ex:
    - gam user alice.martin@example.com delete messages query "from:expediteur@malveillant.example" doit
gam-usertypeentity-imap-imap4:
  desc: Activer ou désactiver l'accès IMAP d'une boîte.
  ex:
    - gam user alice.martin@example.com imap off

# --- Groupes et alias ---
gam-create-group:
  desc: Créer un groupe (liste de diffusion ou groupe de sécurité).
  ex:
    - gam create group compta@example.com name "Comptabilité" description "Équipe comptable"
gam-usertypeentity-add-group-groups:
  desc: Ajouter un utilisateur à un groupe, avec son rôle (member, manager ou owner).
  ex:
    - gam user alice.martin@example.com add groups member compta@example.com
gam-info-group-groups:
  desc: Afficher les réglages et les membres d'un groupe.
  ex:
    - gam info group compta@example.com
gam-print-group-members-2:
  desc: Exporter les membres d'un groupe.
  ex:
    - gam print group-members group compta@example.com
gam-usertypeentity-print-groups:
  desc: Lister les groupes dont un utilisateur fait partie.
  ex:
    - gam user alice.martin@example.com print groups
gam-delete-group-groups:
  desc: Supprimer un groupe.
  ex:
    - gam delete group ancien-groupe@example.com
gam-create-alias-aliases:
  desc: Créer un alias (adresse secondaire) pour un utilisateur ou un groupe.
  ex:
    - gam create alias contact@example.com user alice.martin@example.com
gam-print-aliases:
  desc: Exporter tous les alias du domaine.
  ex:
    - gam redirect csv ./alias.csv print aliases

# --- Agendas ---
gam-calendar:
  desc: Partager l'agenda d'un utilisateur avec un autre (freebusy, reader, writer ou owner).
  ex:
    - gam calendar alice.martin@example.com add writer user assistante@example.com
gam-usertypeentity-add-calendars:
  desc: Ajouter un agenda partagé à la liste d'agendas d'un utilisateur.
  ex:
    - gam user assistante@example.com add calendars alice.martin@example.com
gam-usertypeentity-show-calendars:
  desc: Afficher les agendas d'un utilisateur.
  ex:
    - gam user alice.martin@example.com show calendars

# --- Unités d'organisation, licences, appareils, rapports ---
gam-create-org-ou:
  desc: Créer une unité d'organisation.
  ex:
    - gam create org "/Comptabilite" description "Service comptable"
gam-print-orgs-ous:
  desc: Lister les unités d'organisation.
  ex:
    - gam print orgs
gam-print-licenses:
  desc: Exporter les licences attribuées.
  ex:
    - gam redirect csv ./licences.csv print licenses
gam-usertypeentity-add-license:
  desc: 'Attribuer une licence par son identifiant de SKU (ex. 1010020028 : Business Standard ; vérifiez la liste des SKU de Google).'
  ex:
    - gam user alice.martin@example.com add license 1010020028
gam-print-mobile:
  desc: Inventaire des smartphones et tablettes qui synchronisent un compte du domaine.
  ex:
    - gam redirect csv ./mobiles.csv print mobile
gam-print-cros:
  desc: Inventaire des Chromebooks.
  ex:
    - gam redirect csv ./chromebooks.csv print cros
gam-report:
  desc: "Rapports d'activité : connexions, actions d'administration, Drive…"
  ex:
    - gam report login user alice.martin@example.com
    - gam report admin

# --- Traitement par lots, installation ---
gam-csv-newstudents-csv-gam-create-user:
  desc: "Traitement par lots : une commande par ligne d'un CSV ; « ~colonne » reprend la valeur de la colonne."
  ex:
    - gam csv nouveaux.csv gam create user "~email" firstname "~prenom" lastname "~nom" password "~motdepasse" org "/Nouveaux"
gam-info-domain:
  desc: Afficher les informations du domaine Google Workspace.
  ex:
    - gam info domain
gam-oauth-create:
  desc: "Première configuration : autoriser GAM à administrer le domaine (ouvre une page d'autorisation)."
  ex:
    - gam oauth create
gam-version:
  desc: Afficher la version de GAM installée.
  ex:
    - gam version
