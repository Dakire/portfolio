# PowerShell Microsoft 365 (English) : source éditable, traduction de ps-m365.yml. Après modification : `pnpm --filter @grichard/web reference:build`.
meta:
  id: powershell-microsoft-365
  order: 2
  title: 'PowerShell Microsoft 365: commands and cheatsheet'
  h1: PowerShell Microsoft 365
  description: 'PowerShell cheatsheet for Microsoft 365: Exchange Online, Graph, Entra ID, Teams, SharePoint, with module, permissions, example and common pitfall.'
  intro: 'Cmdlets of the current modules (Exchange Online, Microsoft Graph PowerShell, Teams, SharePoint Online). MSOnline and AzureAD are deprecated: use Microsoft Graph PowerShell.'
  card: 'Exchange Online, Microsoft Graph, Entra ID, Teams, SharePoint, Intune, Defender/Purview: cmdlet, module, permissions, example, pitfall.'
  notice: 'MSOnline and AzureAD (Msol* and *-AzureAD* cmdlets) are deprecated and no longer receive fixes: migrate to Microsoft Graph PowerShell (Mg*). Test with -WhatIf first when it exists.'
  docBase: https://learn.microsoft.com/powershell/module/
  docs:
    label: Microsoft 365 PowerShell documentation
    url: https://learn.microsoft.com/microsoft-365/enterprise/connect-to-microsoft-365-powershell
  fields:
    - key: module
      label: Required module
    - key: perms
      label: Permissions / roles
    - key: pitfall
      label: Common pitfall
  cats:
    - id: exchange
      label: Exchange Online
    - id: graph
      label: Graph and Entra ID
    - id: teams
      label: Teams
    - id: sharepoint
      label: SharePoint Online
    - id: intune
      label: Intune
    - id: security
      label: Defender and Purview
    - id: legacy
      label: MSOnline / AzureAD (deprecated)
  top:
    - title: Connecting
      note: Install the modules first (once) with Install-Module -Scope CurrentUser, then connect at each session.
      items:
        - code: Connect-ExchangeOnline -UserPrincipalName admin@contoso.com
          note: 'Exchange Online (ExchangeOnlineManagement module). Add -ShowBanner:$false for shorter output. Disconnect: Disconnect-ExchangeOnline -Confirm:$false.'
        - code: Connect-MgGraph -Scopes 'User.Read.All','Group.ReadWrite.All','Directory.Read.All'
          note: 'Microsoft Graph PowerShell: request only the scopes you need (least privilege). Check with Get-MgContext. Common scopes: User.ReadWrite.All, Group.ReadWrite.All, Directory.ReadWrite.All, Policy.Read.All, DeviceManagementManagedDevices.Read.All, AuditLog.Read.All.'
        - code: Connect-MicrosoftTeams
          note: Teams (MicrosoftTeams module). Teams Administrator role or higher.
        - code: Connect-SPOService -Url https://contoso-admin.sharepoint.com
          note: 'SharePoint Online (Microsoft.Online.SharePoint.PowerShell module), admin center URL. Alternative: PnP.PowerShell.'
        - code: Connect-IPPSSession -UserPrincipalName admin@contoso.com
          note: 'Security & Compliance (Defender, Purview): same module as Exchange Online.'
  lang: en
entries:
  - name: Get-Mailbox
    cat: exchange
    syn: Get-Mailbox [-Identity <id>] [-ResultSize Unlimited]
    desc: Lists mailboxes or shows a mailbox's properties.
    ex:
      - Get-Mailbox -Identity user@contoso.com | Format-List DisplayName,PrimarySmtpAddress,ArchiveStatus,LitigationHoldEnabled
      - Get-Mailbox -ResultSize Unlimited -RecipientTypeDetails SharedMailbox
    tags:
      - mailbox
      - shared
    module: ExchangeOnlineManagement
    perms: Exchange 'View-Only Recipients' role or Exchange Administrator
    pitfall: Without -ResultSize Unlimited, only 1,000 results are returned.
    doc: exchange/get-mailbox
  - name: Set-Mailbox
    cat: exchange
    syn: Set-Mailbox -Identity <id> [properties]
    desc: Changes a mailbox (quota, address, forwarding, archive, retention).
    ex:
      - Set-Mailbox -Identity user@contoso.com -ForwardingSmtpAddress ext@example.com -DeliverToMailboxAndForward $true
      - Set-Mailbox -Identity user@contoso.com -LitigationHoldEnabled $true
    module: ExchangeOnlineManagement
    perms: Exchange Administrator or 'Mail Recipients' role
    pitfall: External forwarding is often blocked by the tenant's outbound anti-spam policy.
    doc: exchange/set-mailbox
  - name: Set-MailboxAutoReplyConfiguration
    cat: exchange
    syn: Set-MailboxAutoReplyConfiguration -Identity <id> -AutoReplyState Enabled|Disabled|Scheduled
    desc: Enables, schedules or turns off a mailbox's out-of-office automatic reply (internal and external message).
    ex:
      - Set-MailboxAutoReplyConfiguration -Identity user@contoso.com -AutoReplyState Enabled -InternalMessage 'Absent jusqu''au 5 janvier.' -ExternalMessage 'Absent jusqu''au 5 janvier.'
      - Set-MailboxAutoReplyConfiguration -Identity user@contoso.com -AutoReplyState Scheduled -StartTime '2026-12-22 18:00' -EndTime '2027-01-05 08:00' -InternalMessage 'Congés'
      - Set-MailboxAutoReplyConfiguration -Identity user@contoso.com -AutoReplyState Disabled
    tags:
      - out of office
      - automatic reply
      - vacation
    module: ExchangeOnlineManagement
    perms: Exchange Administrator or 'Mail Recipients' role
    pitfall: Without -ExternalMessage, external senders get nothing; -ExternalAudience (Known or All) narrows or widens who receives the reply.
    doc: exchange/set-mailboxautoreplyconfiguration
  - name: New-Mailbox
    cat: exchange
    syn: New-Mailbox -Shared -Name <name> -DisplayName <name>
    desc: Creates a shared mailbox (or room/equipment with -Room, -Equipment).
    ex:
      - New-Mailbox -Shared -Name 'Support' -DisplayName 'Support' -PrimarySmtpAddress support@contoso.com
    module: ExchangeOnlineManagement
    perms: Exchange Administrator
    pitfall: A shared mailbox needs no licence as long as it stays under 50 GB with no archive.
    doc: exchange/new-mailbox
  - name: Add-MailboxPermission
    cat: exchange
    syn: Add-MailboxPermission -Identity <mailbox> -User <user> -AccessRights FullAccess
    desc: Gives full access to a mailbox (read/write delegation).
    ex:
      - Add-MailboxPermission -Identity shared@contoso.com -User user@contoso.com -AccessRights FullAccess -AutoMapping $true
    alias:
      - delegation
      - full access
    module: ExchangeOnlineManagement
    perms: Exchange Administrator
    pitfall: Allow 30 to 60 minutes for propagation; also add Add-RecipientPermission for 'Send as'.
    doc: exchange/add-mailboxpermission
  - name: Add-RecipientPermission
    cat: exchange
    syn: Add-RecipientPermission -Identity <mailbox> -Trustee <user> -AccessRights SendAs
    desc: Allows 'Send as' on a mailbox or group.
    ex:
      - Add-RecipientPermission -Identity shared@contoso.com -Trustee user@contoso.com -AccessRights SendAs -Confirm:$false
    module: ExchangeOnlineManagement
    perms: Exchange Administrator
    pitfall: "'Send on behalf' (SendOnBehalf) is another command: Set-Mailbox -GrantSendOnBehalfTo."
    doc: exchange/add-recipientpermission
  - name: Get-MailboxStatistics
    cat: exchange
    syn: Get-MailboxStatistics -Identity <id>
    desc: A mailbox's size, item count and last logon.
    ex:
      - Get-MailboxStatistics user@contoso.com | Select DisplayName,TotalItemSize,ItemCount,LastLogonTime
    module: ExchangeOnlineManagement
    perms: View-Only Recipients
    pitfall: LastLogonTime can be empty if the mailbox was never opened or not used recently.
    doc: exchange/get-mailboxstatistics
  - name: Get-MessageTraceV2
    cat: exchange
    syn: Get-MessageTraceV2 -SenderAddress <sender> -StartDate <date> -EndDate <date>
    desc: Traces a message (delivered, delayed, rejected) over the last 10 days. Replaces Get-MessageTrace.
    ex:
      - Get-MessageTraceV2 -RecipientAddress user@contoso.com -StartDate (Get-Date).AddDays(-2) -EndDate (Get-Date)
    alias:
      - Get-MessageTrace
      - trace de message
    module: ExchangeOnlineManagement (version récente)
    perms: View-Only Recipients or Message Tracking
    pitfall: Get-MessageTrace is being retired; beyond 10 days, use Start-HistoricalSearch.
    doc: exchange/get-messagetracev2
  - name: Start-HistoricalSearch
    cat: exchange
    syn: Start-HistoricalSearch -ReportTitle <title> -ReportType MessageTrace ...
    desc: Starts a message trace search beyond 10 days (up to 90 days), delivered by email.
    ex:
      - Start-HistoricalSearch -ReportTitle 'Trace' -ReportType MessageTrace -StartDate (Get-Date).AddDays(-30) -EndDate (Get-Date) -SenderAddress a@example.com -NotifyAddress admin@contoso.com
    module: ExchangeOnlineManagement
    perms: Exchange Administrator
    pitfall: 'The result does not show in the console: it is sent as a CSV to the notification address.'
    doc: exchange/start-historicalsearch
  - name: New-TransportRule
    cat: exchange
    syn: New-TransportRule -Name <name> -Conditions... -Actions...
    desc: Creates a mail flow rule (disclaimer, block, redirect).
    ex:
      - New-TransportRule -Name 'Étiquette externe' -FromScope NotInOrganization -PrependSubject '[EXTERNE] '
    module: ExchangeOnlineManagement
    perms: Exchange Administrator (Transport Rules role)
    pitfall: Create it in test mode (-Mode Audit) before enforcing; rule order (-Priority) matters.
    doc: exchange/new-transportrule
  - name: Get-DistributionGroupMember
    cat: exchange
    syn: Get-DistributionGroupMember -Identity <group>
    desc: Lists the members of a distribution list.
    ex:
      - Get-DistributionGroupMember -Identity team@contoso.com -ResultSize Unlimited | Select DisplayName,PrimarySmtpAddress
    module: ExchangeOnlineManagement
    perms: View-Only Recipients
    pitfall: For a Microsoft 365 group, use Get-UnifiedGroupLinks -LinkType Members.
    doc: exchange/get-distributiongroupmember
  - name: Add-DistributionGroupMember
    cat: exchange
    syn: Add-DistributionGroupMember -Identity <group> -Member <user>
    desc: Adds a member to a distribution list.
    ex:
      - Add-DistributionGroupMember -Identity team@contoso.com -Member user@contoso.com
    module: ExchangeOnlineManagement
    perms: Group owner or Exchange Administrator
    pitfall: 'A mail-enabled security group synced from AD cannot be changed here: change it on-premises.'
    doc: exchange/add-distributiongroupmember
  - name: Set-CalendarProcessing
    cat: exchange
    syn: Set-CalendarProcessing -Identity <room> -AutomateProcessing AutoAccept
    desc: Sets automatic meeting acceptance for a room or equipment.
    ex:
      - Set-CalendarProcessing -Identity salle1@contoso.com -AutomateProcessing AutoAccept -AllowConflicts $false
    module: ExchangeOnlineManagement
    perms: Exchange Administrator
    pitfall: '-AllowConflicts $false is not enough for recurring meetings: also set -ConflictPercentageAllowed.'
    doc: exchange/set-calendarprocessing
  - name: Add-MailboxFolderPermission
    cat: exchange
    syn: Add-MailboxFolderPermission -Identity <mailbox>:\Calendar -User <user> -AccessRights Reviewer
    desc: Shares a folder (calendar, inbox) with a user.
    ex:
      - Add-MailboxFolderPermission -Identity user@contoso.com:\Calendar -User collegue@contoso.com -AccessRights Editor
    module: ExchangeOnlineManagement
    perms: Exchange Administrator or mailbox owner
    pitfall: The folder name depends on the mailbox language (Calendrier in French); check with Get-MailboxFolderStatistics.
    doc: exchange/add-mailboxfolderpermission
  - name: Get-EXOMailbox
    cat: exchange
    syn: Get-EXOMailbox -Identity <id> -Properties <list>
    desc: Fast, lightweight version of Get-Mailbox for large volumes.
    ex:
      - Get-EXOMailbox -ResultSize Unlimited -Properties ProhibitSendQuota | Select DisplayName,ProhibitSendQuota
    module: ExchangeOnlineManagement (v3+)
    perms: View-Only Recipients
    pitfall: Only the properties requested with -Properties are returned.
    doc: exchange/get-exomailbox
  - name: Enable-Mailbox (archive)
    cat: exchange
    syn: Enable-Mailbox -Identity <id> -Archive
    desc: Enables a mailbox's online archive.
    ex:
      - Enable-Mailbox -Identity user@contoso.com -Archive
    module: ExchangeOnlineManagement
    perms: Exchange Administrator
    pitfall: Requires a licence that includes the archive (Exchange Online Plan 2 or equivalent).
    doc: exchange/enable-mailbox
  - name: Connect-MgGraph
    cat: graph
    syn: Connect-MgGraph -Scopes <scopes> [-TenantId <id>] [-NoWelcome]
    desc: Opens a Microsoft Graph PowerShell session with the requested scopes.
    ex:
      - Connect-MgGraph -Scopes 'User.ReadWrite.All' -NoWelcome
      - Get-MgContext | Select Account,TenantId,Scopes
    module: Microsoft.Graph.Authentication
    perms: Admin consent for sensitive scopes
    pitfall: "A missing scope gives 'Insufficient privileges': reconnect with the right scope."
    url: https://learn.microsoft.com/powershell/module/microsoft.graph.authentication/connect-mggraph
  - name: Get-MgUser
    cat: graph
    syn: Get-MgUser [-UserId <id>] [-Filter <odata>] [-Property <list>] [-All]
    desc: Reads a user or lists Entra ID accounts. Replaces Get-MsolUser / Get-AzureADUser.
    alias:
      - Get-MsolUser
      - Get-AzureADUser
    ex:
      - Get-MgUser -UserId user@contoso.com -Property DisplayName,AccountEnabled,SignInActivity
      - Get-MgUser -All -Filter "accountEnabled eq false" | Select DisplayName,UserPrincipalName
    module: Microsoft.Graph.Users
    perms: User.Read.All (AuditLog.Read.All for SignInActivity)
    pitfall: 'Few properties are returned by default: request them with -Property. Without -All, the list is truncated.'
    doc: microsoft.graph.users/get-mguser
  - name: New-MgUser
    cat: graph
    syn: New-MgUser -DisplayName <name> -UserPrincipalName <upn> -MailNickname <alias> -AccountEnabled -PasswordProfile <hash>
    desc: Creates an Entra ID user.
    ex:
      - New-MgUser -DisplayName 'Jean Dupont' -UserPrincipalName jean@contoso.com -MailNickname jean -AccountEnabled -PasswordProfile @{ Password = '<mot de passe>'; ForceChangePasswordNextSignIn = $true }
    module: Microsoft.Graph.Users
    perms: User.ReadWrite.All; User Administrator role
    pitfall: Set UsageLocation before assigning a licence.
    doc: microsoft.graph.users/new-mguser
  - name: Update-MgUser
    cat: graph
    syn: Update-MgUser -UserId <id> [-property value]
    desc: Changes a user (department, title, enablement, usage location).
    ex:
      - Update-MgUser -UserId user@contoso.com -AccountEnabled:$false
      - Update-MgUser -UserId user@contoso.com -UsageLocation FR
    module: Microsoft.Graph.Users
    perms: User.ReadWrite.All
    pitfall: 'Disabling an account does not invalidate current sessions: also use Revoke-MgUserSignInSession.'
    doc: microsoft.graph.users/update-mguser
  - name: Revoke-MgUserSignInSession
    cat: graph
    syn: Revoke-MgUserSignInSession -UserId <id>
    desc: Revokes a user's refresh tokens and sessions (compromised account).
    ex:
      - Revoke-MgUserSignInSession -UserId user@contoso.com
    module: Microsoft.Graph.Users.Actions
    perms: User.RevokeSessions.All
    pitfall: Access tokens already issued stay valid for up to about an hour.
    doc: microsoft.graph.users.actions/revoke-mgusersigninsession
  - name: Set-MgUserLicense
    cat: graph
    syn: Set-MgUserLicense -UserId <id> -AddLicenses @{SkuId=...} -RemoveLicenses @()
    desc: Assigns or removes Microsoft 365 licences.
    ex:
      - Get-MgSubscribedSku | Select SkuPartNumber,SkuId,ConsumedUnits
      - Set-MgUserLicense -UserId user@contoso.com -AddLicenses @{SkuId='<SkuId>'} -RemoveLicenses @()
    module: Microsoft.Graph.Users.Actions
    perms: LicenseAssignment.ReadWrite.All or User.ReadWrite.All
    pitfall: -RemoveLicenses is required even when empty; UsageLocation must be set.
    doc: microsoft.graph.users.actions/set-mguserlicense
  - name: Get-MgGroup
    cat: graph
    syn: Get-MgGroup [-GroupId <id>] [-Filter <odata>] [-All]
    desc: Lists Entra ID groups (Microsoft 365, security).
    ex:
      - Get-MgGroup -All -Filter "startsWith(displayName,'Ventes')"
    module: Microsoft.Graph.Groups
    perms: Group.Read.All
    pitfall: Advanced filters (endswith, not) need -ConsistencyLevel eventual -CountVariable n.
    doc: microsoft.graph.groups/get-mggroup
  - name: New-MgGroupMember
    cat: graph
    syn: New-MgGroupMember -GroupId <id> -DirectoryObjectId <id>
    desc: Adds a member to an Entra ID group.
    ex:
      - New-MgGroupMember -GroupId $groupId -DirectoryObjectId (Get-MgUser -UserId user@contoso.com).Id
    module: Microsoft.Graph.Groups
    perms: GroupMember.ReadWrite.All
    pitfall: Not possible on a dynamic-membership group or one synced from AD.
    doc: microsoft.graph.groups/new-mggroupmember
  - name: Get-MgUserAuthenticationMethod
    cat: graph
    syn: Get-MgUserAuthenticationMethod -UserId <id>
    desc: Lists a user's authentication methods (MFA).
    ex:
      - Get-MgUserAuthenticationMethod -UserId user@contoso.com | Select Id,AdditionalProperties
    module: Microsoft.Graph.Identity.SignIns
    perms: UserAuthenticationMethod.Read.All; Authentication Administrator role
    pitfall: The method type is in AdditionalProperties.@odata.type.
    doc: microsoft.graph.identity.signins/get-mguserauthenticationmethod
  - name: Get-MgAuditLogSignIn
    cat: graph
    syn: Get-MgAuditLogSignIn -Filter <odata> -Top <n>
    desc: Entra ID sign-in log (failures, location, conditional access).
    ex:
      - Get-MgAuditLogSignIn -Filter "userPrincipalName eq 'user@contoso.com'" -Top 20 | Select CreatedDateTime,AppDisplayName,IPAddress,Status
    module: Microsoft.Graph.Reports
    perms: AuditLog.Read.All; Entra ID P1 licence
    pitfall: Retention of only 30 days; the filter does not handle every combination.
    doc: microsoft.graph.reports/get-mgauditlogsignin
  - name: Get-MgDirectoryRole
    cat: graph
    syn: Get-MgDirectoryRole / Get-MgDirectoryRoleMember
    desc: Lists the activated administrator roles and their members.
    ex:
      - $r = Get-MgDirectoryRole -Filter "displayName eq 'Global Administrator'"; Get-MgDirectoryRoleMember -DirectoryRoleId $r.Id
    module: Microsoft.Graph.Identity.DirectoryManagement
    perms: RoleManagement.Read.Directory
    pitfall: A role never assigned does not show until it is activated; PIM membership is not listed here.
    doc: microsoft.graph.identity.directorymanagement/get-mgdirectoryrole
  - name: Get-MgSubscribedSku
    cat: graph
    syn: Get-MgSubscribedSku
    desc: The tenant's purchased, consumed and available licences.
    ex:
      - Get-MgSubscribedSku | Select SkuPartNumber,ConsumedUnits,@{n='Total';e={$_.PrepaidUnits.Enabled}}
    module: Microsoft.Graph.Identity.DirectoryManagement
    perms: Organization.Read.All
    pitfall: SkuPartNumber is a technical name (SPE_E3 for Microsoft 365 E3), not the commercial name.
    doc: microsoft.graph.identity.directorymanagement/get-mgsubscribedsku
  - name: Get-MgIdentityConditionalAccessPolicy
    cat: graph
    syn: Get-MgIdentityConditionalAccessPolicy
    desc: Lists conditional access policies.
    ex:
      - Get-MgIdentityConditionalAccessPolicy | Select DisplayName,State
    module: Microsoft.Graph.Identity.SignIns
    perms: Policy.Read.All
    pitfall: Always put a new policy in 'report-only' mode before enabling it, so you do not lock yourself out.
    doc: microsoft.graph.identity.signins/get-mgidentityconditionalaccesspolicy
  - name: Get-Team
    cat: teams
    syn: Get-Team [-DisplayName <name>] [-User <upn>]
    desc: Lists Teams teams.
    ex:
      - Get-Team -DisplayName 'Projet' | Select GroupId,DisplayName,Visibility,Archived
    module: MicrosoftTeams
    perms: Teams Administrator or global read
    pitfall: -DisplayName does a prefix search, not an exact name.
    doc: teams/get-team
  - name: New-Team
    cat: teams
    syn: New-Team -DisplayName <name> -Visibility Private
    desc: Creates a team (and its Microsoft 365 group).
    ex:
      - New-Team -DisplayName 'Projet Alpha' -Visibility Private -Owner admin@contoso.com
    module: MicrosoftTeams
    perms: Teams Administrator; creation may be limited by the group policy
    pitfall: 'Set -Owner: without an owner, the team can be orphaned.'
    doc: teams/new-team
  - name: Add-TeamUser
    cat: teams
    syn: Add-TeamUser -GroupId <id> -User <upn> -Role Member
    desc: Adds a member or owner to a team.
    ex:
      - Add-TeamUser -GroupId $groupId -User user@contoso.com -Role Member
    module: MicrosoftTeams
    perms: Team owner or Teams Administrator
    pitfall: For an owner, the user must already be a member.
    doc: teams/add-teamuser
  - name: Get-CsOnlineUser
    cat: teams
    syn: Get-CsOnlineUser -Identity <upn>
    desc: Shows a user's Teams configuration (telephony, policies).
    ex:
      - Get-CsOnlineUser -Identity user@contoso.com | Select DisplayName,TeamsMeetingPolicy,LineUri,InterpretedUserType
    module: MicrosoftTeams
    perms: Teams Administrator
    pitfall: An empty policy means 'global default', not 'none'.
    doc: teams/get-csonlineuser
  - name: Grant-CsTeamsMeetingPolicy
    cat: teams
    syn: Grant-CsTeamsMeetingPolicy -Identity <upn> -PolicyName <policy>
    desc: Assigns a Teams meeting policy to a user.
    ex:
      - Grant-CsTeamsMeetingPolicy -Identity user@contoso.com -PolicyName 'RestrictedAnonymous'
    module: MicrosoftTeams
    perms: Teams Administrator
    pitfall: Up to 24 hours to propagate; for many users, prefer a group assignment (New-CsGroupPolicyAssignment).
    doc: teams/grant-csteamsmeetingpolicy
  - name: Get-SPOSite
    cat: sharepoint
    syn: Get-SPOSite [-Identity <url>] [-Limit All]
    desc: Lists SharePoint site collections.
    ex:
      - Get-SPOSite -Limit All | Select Url,StorageUsageCurrent,SharingCapability
    module: Microsoft.Online.SharePoint.PowerShell
    perms: SharePoint Administrator
    pitfall: Without -Limit All, only 200 sites are returned.
    doc: sharepoint-online/get-sposite
  - name: Set-SPOSite
    cat: sharepoint
    syn: Set-SPOSite -Identity <url> [-SharingCapability ...] [-StorageQuota ...]
    desc: Changes a site (external sharing, quota, lock).
    ex:
      - Set-SPOSite -Identity https://contoso.sharepoint.com/sites/rh -SharingCapability Disabled
      - Set-SPOSite -Identity https://contoso.sharepoint.com/sites/rh -LockState ReadOnly
    module: Microsoft.Online.SharePoint.PowerShell
    perms: SharePoint Administrator
    pitfall: A site's sharing cannot be more open than the tenant's (Set-SPOTenant).
    doc: sharepoint-online/set-sposite
  - name: Get-SPOTenant
    cat: sharepoint
    syn: Get-SPOTenant
    desc: Global SharePoint and OneDrive tenant settings (sharing, sync).
    ex:
      - Get-SPOTenant | Select SharingCapability,DefaultSharingLinkType,OneDriveStorageQuota
    module: Microsoft.Online.SharePoint.PowerShell
    perms: SharePoint Administrator
    pitfall: A Set-SPOTenant change can take several minutes to apply.
    doc: sharepoint-online/get-spotenant
  - name: Get-SPOUser / Add-SPOUser
    cat: sharepoint
    syn: Get-SPOUser -Site <url> / Add-SPOUser -Site <url> -LoginName <upn> -Group <group>
    desc: Views or adds users in a site.
    ex:
      - Get-SPOUser -Site https://contoso.sharepoint.com/sites/rh -Limit All
      - Add-SPOUser -Site https://contoso.sharepoint.com/sites/rh -LoginName user@contoso.com -Group 'RH Members'
    module: Microsoft.Online.SharePoint.PowerShell
    perms: Site collection administrator
    pitfall: Add-SPOUser requires an existing site group; check the exact name with Get-SPOSiteGroup.
    doc: sharepoint-online/add-spouser
  - name: Restore-SPODeletedSite
    cat: sharepoint
    syn: Restore-SPODeletedSite -Identity <url>
    desc: Restores a deleted site (tenant recycle bin, 93 days).
    ex:
      - Get-SPODeletedSite | Select Url,DeletionTime
      - Restore-SPODeletedSite -Identity https://contoso.sharepoint.com/sites/rh
    module: Microsoft.Online.SharePoint.PowerShell
    perms: SharePoint Administrator
    pitfall: A site tied to a Microsoft 365 group is also restored through the deleted group (Entra ID).
    doc: sharepoint-online/restore-spodeletedsite
  - name: Get-MgDeviceManagementManagedDevice
    cat: intune
    syn: Get-MgDeviceManagementManagedDevice [-Filter <odata>] [-All]
    desc: Lists devices managed by Intune (compliance, OS, last contact).
    ex:
      - Get-MgDeviceManagementManagedDevice -All -Filter "operatingSystem eq 'Windows'" | Select DeviceName,UserPrincipalName,ComplianceState,LastSyncDateTime
    module: Microsoft.Graph.DeviceManagement
    perms: DeviceManagementManagedDevices.Read.All; Intune Administrator role
    pitfall: 'An old LastSyncDateTime is not a failure: the device may simply be off.'
    doc: microsoft.graph.devicemanagement/get-mgdevicemanagementmanageddevice
  - name: Sync-MgDeviceManagementManagedDevice
    cat: intune
    syn: Sync-MgDeviceManagementManagedDevice -ManagedDeviceId <id>
    desc: Requests an immediate sync of an Intune device.
    ex:
      - Sync-MgDeviceManagementManagedDevice -ManagedDeviceId $id
    module: Microsoft.Graph.DeviceManagement
    perms: DeviceManagementManagedDevices.PrivilegedOperations.All
    pitfall: 'The command is only a request: the device must be online to process it.'
    doc: microsoft.graph.devicemanagement/sync-mgdevicemanagementmanageddevice
  - name: Invoke-MgRetireDeviceManagementManagedDevice
    cat: intune
    syn: Invoke-MgRetireDeviceManagementManagedDevice -ManagedDeviceId <id>
    desc: Retires a device from management (removes company data, keeps personal data).
    ex:
      - Invoke-MgRetireDeviceManagementManagedDevice -ManagedDeviceId $id
    module: Microsoft.Graph.DeviceManagement
    perms: DeviceManagementManagedDevices.PrivilegedOperations.All
    pitfall: Do not confuse with Wipe (full reset, destructive).
    doc: microsoft.graph.devicemanagement/invoke-mgretiredevicemanagementmanageddevice
  - name: Get-QuarantineMessage
    cat: security
    syn: Get-QuarantineMessage -StartReceivedDate <date> -EndReceivedDate <date>
    desc: Lists messages in Defender for Office 365 quarantine.
    ex:
      - Get-QuarantineMessage -RecipientAddress user@contoso.com -StartReceivedDate (Get-Date).AddDays(-7) -EndReceivedDate (Get-Date) | Select ReceivedTime,SenderAddress,Subject,Type
    module: ExchangeOnlineManagement
    perms: Security Administrator or Quarantine Administrator
    pitfall: Release with Release-QuarantineMessage -Identity <id> -ReleaseToAll; the default maximum retention is 30 days.
    doc: exchange/get-quarantinemessage
  - name: Get-MalwareFilterPolicy
    cat: security
    syn: Get-MalwareFilterPolicy / Set-MalwareFilterPolicy
    desc: Views or sets the anti-malware policy.
    ex:
      - Get-MalwareFilterPolicy | Select Name,EnableFileFilter,FileTypes
    module: ExchangeOnlineManagement
    perms: Security Administrator
    pitfall: The default policy applies last; Preset policies can override it.
    doc: exchange/get-malwarefilterpolicy
  - name: Get-SafeLinksPolicy
    cat: security
    syn: Get-SafeLinksPolicy
    desc: Defender for Office 365 Safe Links policies.
    ex:
      - Get-SafeLinksPolicy | Select Name,EnableSafeLinksForEmail,ScanUrls,DoNotRewriteUrls
    module: ExchangeOnlineManagement
    perms: Security Administrator
    pitfall: Requires a Defender for Office 365 licence (Plan 1 or 2).
    doc: exchange/get-safelinkspolicy
  - name: Search-UnifiedAuditLog
    cat: security
    syn: Search-UnifiedAuditLog -StartDate <date> -EndDate <date> -UserIds <upn> -Operations <list>
    desc: Queries the unified audit log (sign-ins, file access, mailbox rules).
    ex:
      - Search-UnifiedAuditLog -StartDate (Get-Date).AddDays(-7) -EndDate (Get-Date) -UserIds user@contoso.com -Operations New-InboxRule,Set-InboxRule -ResultSize 500
    module: ExchangeOnlineManagement
    perms: "'View-Only Audit Logs' role; auditing enabled on the tenant"
    pitfall: 'Limited to 5,000 results per call: paginate with -SessionId and -SessionCommand ReturnLargeSet.'
    doc: exchange/search-unifiedauditlog
  - name: New-ComplianceSearch
    cat: security
    syn: New-ComplianceSearch -Name <name> -ExchangeLocation All -ContentMatchQuery <KQL>
    desc: Creates a Purview eDiscovery content search (then Start-ComplianceSearch).
    ex:
      - New-ComplianceSearch -Name 'Facture-X' -ExchangeLocation All -ContentMatchQuery 'subject:"Facture X"'
      - Start-ComplianceSearch -Identity 'Facture-X'
    module: ExchangeOnlineManagement (Connect-IPPSSession)
    perms: eDiscovery Manager
    pitfall: 'Only use New-ComplianceSearchAction -Purge after checking the results: deletion is permanent.'
    doc: exchange/new-compliancesearch
  - name: Get-DlpCompliancePolicy
    cat: security
    syn: Get-DlpCompliancePolicy
    desc: Lists data loss prevention (DLP) policies.
    ex:
      - Get-DlpCompliancePolicy | Select Name,Mode,Enabled
    module: ExchangeOnlineManagement (Connect-IPPSSession)
    perms: Compliance Administrator
    pitfall: A policy in TestWithNotifications mode blocks nothing.
    doc: exchange/get-dlpcompliancepolicy
  - name: Connect-MsolService
    cat: legacy
    syn: Connect-MsolService
    desc: Sign-in for the MSOnline module, deprecated. Replace with Connect-MgGraph.
    alias:
      - MSOnline
      - Get-MsolUser
      - Set-MsolUser
    ex:
      - '# Ancien : Connect-MsolService ; Get-MsolUser -UserPrincipalName user@contoso.com'
      - "# Nouveau : Connect-MgGraph -Scopes 'User.Read.All' ; Get-MgUser -UserId user@contoso.com"
    module: MSOnline (déprécié)
    perms: Global Reader role or higher
    pitfall: The module stops working when its APIs end; do not build scripts on it any more.
    url: https://learn.microsoft.com/powershell/azure/active-directory/overview
  - name: Connect-AzureAD
    cat: legacy
    syn: Connect-AzureAD
    desc: Sign-in for the AzureAD module, deprecated. Replace with Connect-MgGraph.
    alias:
      - AzureAD
      - Get-AzureADUser
      - Get-AzureADGroup
    ex:
      - '# Ancien : Get-AzureADGroupMember -ObjectId $id'
      - '# Nouveau : Get-MgGroupMember -GroupId $id'
    module: AzureAD (déprécié)
    perms: Global Reader role or higher
    pitfall: Object names change (ObjectId becomes Id) and scopes must be requested again.
    url: https://learn.microsoft.com/powershell/microsoftgraph/azuread-msoline-cmdlet-map
  - name: Set-MsolUserPassword
    cat: legacy
    syn: Set-MsolUserPassword -UserPrincipalName <upn> -NewPassword <password>
    desc: 'Resets a password (MSOnline, deprecated). Graph equivalent: Update-MgUser with -PasswordProfile.'
    ex:
      - Update-MgUser -UserId user@contoso.com -PasswordProfile @{ Password = '<mot de passe>'; ForceChangePasswordNextSignIn = $true }
    module: Microsoft.Graph.Users
    perms: User.ReadWrite.All; Password / User Administrator role
    pitfall: An account synced from on-premises AD is reset on the AD side, not in Entra ID.
    doc: microsoft.graph.users/update-mguser
