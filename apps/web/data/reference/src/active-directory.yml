# Active Directory (RSAT PowerShell) : source éditable. Après modification : `pnpm --filter @grichard/web reference:build`.
meta:
  id: active-directory
  order: 4
  title: 'Active Directory : cheatsheet PowerShell | Guillaume Richard'
  h1: Active Directory (RSAT PowerShell)
  description: 'Cheatsheet Active Directory : Get-ADUser, Search-ADAccount, réplication, GPO, dcdiag et FSMO, avec droits requis, exemples et pièges courants.'
  intro: 'Cmdlets du module ActiveDirectory (RSAT) et outils en ligne de commande pour administrer et dépanner un domaine : comptes, groupes, réplication, GPO, contrôleurs de domaine.'
  card: 'Get-ADUser, Search-ADAccount, groupes, réplication, GPO, dcdiag, FSMO : exemples prêts à copier et pièges courants.'
  notice: "Testez d'abord avec -WhatIf quand il existe. Les modifications d'AD sont répliquées à tous les contrôleurs de domaine : préférez une unité d'organisation de test."
  docBases:
    ad: https://learn.microsoft.com/powershell/module/activedirectory/
    cmd: https://learn.microsoft.com/windows-server/administration/windows-commands/
    gp: https://learn.microsoft.com/powershell/module/grouppolicy/
  docs:
    label: Module ActiveDirectory (Microsoft Learn)
    url: https://learn.microsoft.com/powershell/module/activedirectory/
  fields:
    - { key: module, label: Module / outil }
    - { key: perms, label: Droits requis }
    - { key: pitfall, label: Piège courant }
  cats:
    - { id: users, label: Utilisateurs }
    - { id: groups, label: Groupes }
    - { id: computers, label: Ordinateurs }
    - { id: replication, label: Réplication et DC }
    - { id: gpo, label: GPO }
    - { id: audit, label: Audit et dépannage }
  top:
    - title: Prérequis
      note: 'Installez les outils RSAT une fois (Windows 11), puis importez le module.'
      items:
        - code: 'Add-WindowsCapability -Online -Name Rsat.ActiveDirectory.DS-LDS.Tools~~~~0.0.1.0'
          note: 'Invite élevée. Pour les GPO : Rsat.GroupPolicy.Management.Tools~~~~0.0.1.0.'
        - code: 'Import-Module ActiveDirectory; Get-ADDomain | Select DNSRoot,PDCEmulator,DomainMode'
          note: 'Vérifie la connexion au domaine.'
entries:
  - name: Get-ADUser
    cat: users
    syn: Get-ADUser -Identity <sam> | -Filter <expression> [-Properties <liste>]
    desc: Lit un ou plusieurs comptes utilisateur.
    ex:
      - 'Get-ADUser jdupont -Properties * | Select Name,Enabled,LastLogonDate,PasswordLastSet,LockedOut'
      - "Get-ADUser -Filter {Enabled -eq $true -and Department -eq 'Compta'} -Properties Department,Mail | Select Name,Mail"
      - "Get-ADUser -Filter * -SearchBase 'OU=Employes,DC=contoso,DC=local' | Measure-Object"
    module: ActiveDirectory
    perms: Lecture du domaine (utilisateur standard)
    pitfall: 'Sans -Properties, seules les propriétés de base sont renvoyées ; LastLogonDate est répliquée de façon approximative (utilisez lastLogon sur chaque DC pour du précis).'
    doc: ad/get-aduser
  - name: New-ADUser
    cat: users
    syn: New-ADUser -Name <nom> -SamAccountName <sam> -AccountPassword <SecureString> -Enabled $true -Path <OU>
    desc: Crée un compte utilisateur.
    ex:
      - "New-ADUser -Name 'Jean Dupont' -GivenName Jean -Surname Dupont -SamAccountName jdupont -UserPrincipalName jdupont@contoso.local -Path 'OU=Employes,DC=contoso,DC=local' -AccountPassword (Read-Host -AsSecureString 'Mot de passe') -Enabled $true -ChangePasswordAtLogon $true"
    module: ActiveDirectory
    perms: Délégation « Créer des objets utilisateur » sur l'OU
    pitfall: 'Sans -Enabled $true le compte reste désactivé ; le mot de passe doit respecter la stratégie du domaine.'
    doc: ad/new-aduser
  - name: Set-ADUser
    cat: users
    syn: Set-ADUser -Identity <sam> [-Propriété valeur]
    desc: Modifie les attributs d'un utilisateur (service, titre, manager, expiration).
    ex:
      - "Set-ADUser jdupont -Department 'Compta' -Title 'Comptable' -Manager mmartin"
      - 'Set-ADUser jdupont -AccountExpirationDate (Get-Date).AddDays(30)'
      - "Set-ADUser jdupont -Replace @{ extensionAttribute1 = 'valeur' }"
    module: ActiveDirectory
    perms: Délégation d'écriture sur les attributs concernés
    pitfall: 'Pour un attribut non géré par un paramètre, utilisez -Replace / -Add / -Clear avec une table de hachage.'
    doc: ad/set-aduser
  - name: Unlock-ADAccount
    cat: users
    syn: Unlock-ADAccount -Identity <sam>
    desc: Déverrouille un compte verrouillé après trop de mots de passe erronés.
    ex:
      - 'Unlock-ADAccount jdupont'
      - 'Search-ADAccount -LockedOut | Unlock-ADAccount -WhatIf'
    module: ActiveDirectory
    perms: Droit « Déverrouiller le compte »
    pitfall: "Le verrouillage se répète si un appareil garde un ancien mot de passe : cherchez la source avec l'événement 4740."
    doc: ad/unlock-adaccount
  - name: Set-ADAccountPassword
    cat: users
    syn: Set-ADAccountPassword -Identity <sam> -Reset -NewPassword <SecureString>
    desc: Réinitialise le mot de passe d'un compte.
    ex:
      - "Set-ADAccountPassword jdupont -Reset -NewPassword (Read-Host -AsSecureString 'Nouveau mot de passe')"
      - 'Set-ADUser jdupont -ChangePasswordAtLogon $true'
    module: ActiveDirectory
    perms: Droit « Réinitialiser le mot de passe »
    pitfall: "Ne passez jamais le mot de passe en clair dans une commande : il resterait dans l'historique."
    doc: ad/set-adaccountpassword
  - name: Search-ADAccount
    cat: audit
    syn: Search-ADAccount [-LockedOut] [-AccountDisabled] [-AccountInactive -TimeSpan <j>] [-PasswordExpired] [-PasswordNeverExpires]
    desc: Retrouve les comptes verrouillés, désactivés, inactifs ou au mot de passe expiré.
    ex:
      - 'Search-ADAccount -AccountInactive -TimeSpan 90.00:00:00 -UsersOnly | Select Name,LastLogonDate'
      - 'Search-ADAccount -LockedOut | Select Name,LockoutTime'
      - 'Search-ADAccount -PasswordNeverExpires -UsersOnly | Select Name'
    module: ActiveDirectory
    perms: Lecture du domaine
    pitfall: 'Le format de -TimeSpan est jours.heures:minutes:secondes (90.00:00:00).'
    doc: ad/search-adaccount
  - name: Disable-ADAccount
    cat: users
    syn: Disable-ADAccount -Identity <sam>
    desc: Désactive un compte (départ d'un collaborateur) ; Enable-ADAccount le réactive.
    ex:
      - 'Disable-ADAccount jdupont'
      - "Move-ADObject (Get-ADUser jdupont) -TargetPath 'OU=Desactives,DC=contoso,DC=local'"
    module: ActiveDirectory
    perms: Délégation sur le compte
    pitfall: "Dans un environnement hybride, la désactivation n'atteint Entra ID qu'au prochain cycle de synchronisation."
    doc: ad/disable-adaccount
  - name: Get-ADGroupMember
    cat: groups
    syn: Get-ADGroupMember -Identity <groupe> [-Recursive]
    desc: Liste les membres d'un groupe, y compris dans les groupes imbriqués avec -Recursive.
    ex:
      - "Get-ADGroupMember 'Administrateurs du domaine' -Recursive | Select Name,SamAccountName"
      - "Get-ADGroupMember 'GRP_Compta' | Get-ADUser -Properties Mail | Select Name,Mail"
    module: ActiveDirectory
    perms: Lecture du domaine
    pitfall: 'Échoue au-delà de 5000 membres (limite de service web) : utilisez Get-ADUser -LDAPFilter avec memberOf.'
    doc: ad/get-adgroupmember
  - name: Add-ADGroupMember
    cat: groups
    syn: Add-ADGroupMember -Identity <groupe> -Members <comptes>
    desc: Ajoute des membres à un groupe ; Remove-ADGroupMember les retire.
    ex:
      - 'Add-ADGroupMember -Identity GRP_Compta -Members jdupont,mmartin'
      - 'Remove-ADGroupMember -Identity GRP_Compta -Members jdupont -Confirm:$false'
    module: ActiveDirectory
    perms: Droit d'écriture sur l'appartenance du groupe
    pitfall: "Le nouveau membre ne voit l'accès qu'à sa prochaine ouverture de session (jeton Kerberos)."
    doc: ad/add-adgroupmember
  - name: Get-ADPrincipalGroupMembership
    cat: groups
    syn: Get-ADPrincipalGroupMembership -Identity <sam>
    desc: Liste les groupes dont un utilisateur ou un ordinateur est membre.
    ex:
      - 'Get-ADPrincipalGroupMembership jdupont | Select Name,GroupCategory | Sort Name'
      - 'Get-ADUser jdupont -Properties MemberOf | Select -Expand MemberOf'
    module: ActiveDirectory
    perms: Lecture du domaine
    pitfall: "Ne donne que les groupes directs ; pour l'imbrication complète, utilisez whoami /groups sur la session de l'utilisateur."
    doc: ad/get-adprincipalgroupmembership
  - name: New-ADGroup
    cat: groups
    syn: New-ADGroup -Name <nom> -GroupScope Global|DomainLocal|Universal -GroupCategory Security -Path <OU>
    desc: Crée un groupe de sécurité ou de distribution.
    ex:
      - "New-ADGroup -Name GRP_Compta -GroupScope Global -GroupCategory Security -Path 'OU=Groupes,DC=contoso,DC=local' -Description 'Service comptabilité'"
    module: ActiveDirectory
    perms: Délégation de création de groupes sur l'OU
    pitfall: 'Règle AGDLP : utilisateurs dans des groupes globaux, groupes globaux dans des groupes de domaine local, permissions sur ces derniers.'
    doc: ad/new-adgroup
  - name: Get-ADComputer
    cat: computers
    syn: Get-ADComputer -Filter <expression> [-Properties <liste>]
    desc: Lit les comptes d'ordinateurs (système, dernière connexion).
    ex:
      - 'Get-ADComputer -Filter * -Properties OperatingSystem,LastLogonDate | Group OperatingSystem | Select Count,Name'
      - 'Get-ADComputer -Filter {LastLogonDate -lt $date} -Properties LastLogonDate | Select Name,LastLogonDate'
    module: ActiveDirectory
    perms: Lecture du domaine
    pitfall: "Définissez $date = (Get-Date).AddDays(-90) avant le filtre ; la variable n'existe pas par défaut."
  - name: Reset-ComputerMachinePassword
    cat: computers
    syn: Reset-ComputerMachinePassword -Server <DC> -Credential <compte>
    desc: Répare la relation d'approbation d'une machine membre du domaine (à lancer sur la machine).
    ex:
      - "Reset-ComputerMachinePassword -Server DC01 -Credential CONTOSO\\adminAD"
      - "Test-ComputerSecureChannel -Repair -Credential CONTOSO\\adminAD"
    module: Microsoft.PowerShell.Management
    perms: Invite élevée locale et compte du domaine
    pitfall: "Symptôme : « La relation d'approbation entre cette station de travail et le domaine principal a échoué »."
    url: https://learn.microsoft.com/powershell/module/microsoft.powershell.management/reset-computermachinepassword
  - name: Move-ADObject
    cat: computers
    syn: Move-ADObject -Identity <DN> -TargetPath <OU>
    desc: Déplace un utilisateur, un ordinateur ou un groupe vers une autre OU.
    ex:
      - "Get-ADComputer PC01 | Move-ADObject -TargetPath 'OU=Postes,DC=contoso,DC=local'"
    module: ActiveDirectory
    perms: Droits sur la source et la destination
    pitfall: "Si « Protéger contre la suppression accidentelle » est activé sur l'objet, retirez-le avant (Set-ADObject -ProtectedFromAccidentalDeletion $false)."
    doc: ad/move-adobject
  - name: repadmin /replsummary
    cat: replication
    syn: repadmin /replsummary | /showrepl | /syncall /AdeP
    desc: Résumé de la réplication AD et forçage de la synchronisation entre contrôleurs de domaine.
    ex:
      - 'repadmin /replsummary'
      - "repadmin /showrepl * /csv | ConvertFrom-Csv | Where 'Number of Failures' -gt 0"
      - 'repadmin /syncall /AdeP'
    module: repadmin (outil AD DS)
    perms: Administrateur du domaine pour forcer
    pitfall: 'Une erreur 8453 (accès refusé) ou 1722 (RPC) pointe vers les droits, le DNS ou le pare-feu entre les DC.'
    url: https://learn.microsoft.com/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc770963(v=ws.11)
  - name: dcdiag
    cat: replication
    syn: dcdiag [/s:<DC>] [/test:<test>] [/v]
    desc: Diagnostic complet d'un contrôleur de domaine (DNS, réplication, FSMO, services).
    ex:
      - 'dcdiag /v'
      - 'dcdiag /test:dns /v /e'
      - 'dcdiag /s:DC01 /test:replications'
    module: dcdiag (outil AD DS)
    perms: Administrateur du domaine
    pitfall: "Un échec DNS est la cause la plus fréquente : vérifiez d'abord que le DC pointe sur lui-même ou un autre DC comme DNS."
    doc: cmd/dcdiag
  - name: netdom query fsmo / Get-ADForest
    cat: replication
    syn: netdom query fsmo
    desc: Identifie les contrôleurs détenant les cinq rôles FSMO.
    ex:
      - 'netdom query fsmo'
      - 'Get-ADDomain | Select PDCEmulator,RIDMaster,InfrastructureMaster'
      - 'Get-ADForest | Select SchemaMaster,DomainNamingMaster'
    module: netdom, ActiveDirectory
    perms: Lecture du domaine
    pitfall: 'Si un DC détenteur est définitivement perdu, il faut saisir (seize) le rôle et ne jamais le remettre en service.'
    doc: cmd/netdom-query
  - name: Move-ADDirectoryServerOperationMasterRole
    cat: replication
    syn: Move-ADDirectoryServerOperationMasterRole -Identity <DC> -OperationMasterRole PDCEmulator
    desc: Transfère un rôle FSMO vers un autre contrôleur de domaine.
    ex:
      - 'Move-ADDirectoryServerOperationMasterRole -Identity DC02 -OperationMasterRole PDCEmulator,RIDMaster,InfrastructureMaster'
    module: ActiveDirectory
    perms: Administrateur de l'entreprise ou du schéma selon le rôle
    pitfall: "Transfert (les deux DC en ligne) et saisie (-Force, DC d'origine perdu) sont deux opérations différentes."
    doc: ad/move-addirectoryserveroperationmasterrole
  - name: Get-ADDomainController
    cat: replication
    syn: Get-ADDomainController -Filter * | Select Name,IPv4Address,Site,OperatingSystem
    desc: Liste les contrôleurs de domaine et leurs rôles.
    ex:
      - 'Get-ADDomainController -Filter * | Select Name,IPv4Address,Site,IsGlobalCatalog'
      - 'Get-ADDomainController -Discover -Service PrimaryDC'
    module: ActiveDirectory
    perms: Lecture du domaine
    pitfall: '-Discover utilise le DNS : si le résultat est faux, vérifiez les enregistrements SRV.'
    doc: ad/get-addomaincontroller
  - name: Get-ADReplicationFailure
    cat: replication
    syn: Get-ADReplicationFailure -Target <DC>
    desc: Échecs de réplication d'un contrôleur de domaine.
    ex:
      - 'Get-ADReplicationFailure -Target DC01 | Select Server,Partner,FirstFailureTime,FailureCount,LastError'
      - 'Get-ADReplicationPartnerMetadata -Target * -Scope Server | Select Server,Partner,LastReplicationSuccess'
    module: ActiveDirectory
    perms: Administrateur du domaine
    pitfall: 'Lancez-la sur une machine qui voit tous les DC (ports RPC, 9389 ADWS).'
    doc: ad/get-adreplicationfailure
  - name: Get-GPO
    cat: gpo
    syn: Get-GPO -All | -Name <nom>
    desc: Liste les objets de stratégie de groupe.
    ex:
      - 'Get-GPO -All | Select DisplayName,GpoStatus,ModificationTime | Sort ModificationTime -Descending'
    module: GroupPolicy
    perms: Lecture des GPO
    pitfall: "Les GPO créées mais non liées ne s'appliquent à rien : vérifiez le lien avec Get-GPInheritance."
    doc: gp/get-gpo
  - name: Get-GPOReport
    cat: gpo
    syn: Get-GPOReport -All -ReportType Html -Path <fichier>
    desc: Exporte le contenu d'une ou de toutes les GPO en rapport HTML ou XML.
    ex:
      - "Get-GPOReport -Name 'Postes - Sécurité' -ReportType Html -Path C:\\Temp\\gpo.html"
      - "Get-GPOReport -All -ReportType Xml -Path C:\\Temp\\toutes-gpo.xml"
    module: GroupPolicy
    perms: Lecture des GPO
    pitfall: 'Utile pour comparer ou archiver avant modification ; sauvegardez aussi avec Backup-GPO.'
    doc: gp/get-gporeport
  - name: New-GPLink
    cat: gpo
    syn: New-GPLink -Name <GPO> -Target <OU> [-LinkEnabled Yes] [-Enforced Yes]
    desc: Lie une GPO à une unité d'organisation, un site ou le domaine.
    ex:
      - "New-GPLink -Name 'Postes - Sécurité' -Target 'OU=Postes,DC=contoso,DC=local' -LinkEnabled Yes"
      - "Get-GPInheritance -Target 'OU=Postes,DC=contoso,DC=local'"
    module: GroupPolicy
    perms: Droit de lier les GPO sur la cible
    pitfall: "Une GPO appliquée à un domaine entier affecte aussi les contrôleurs : testez d'abord sur une OU pilote."
    doc: gp/new-gplink
  - name: Invoke-GPUpdate
    cat: gpo
    syn: Invoke-GPUpdate -Computer <nom> -Force
    desc: Force l'application des GPO sur une machine distante (équivalent de gpupdate /force).
    ex:
      - 'Invoke-GPUpdate -Computer PC01 -Force -RandomDelayInMinutes 0'
      - 'gpresult /s PC01 /r'
    module: GroupPolicy
    perms: Administrateur local de la cible, pare-feu qui autorise la gestion à distance
    pitfall: 'Par défaut, un délai aléatoire de 10 minutes est appliqué ; ajoutez -RandomDelayInMinutes 0.'
    doc: gp/invoke-gpupdate
  - name: Backup-GPO
    cat: gpo
    syn: Backup-GPO -All -Path <dossier>
    desc: Sauvegarde les GPO (et Restore-GPO pour les rétablir).
    ex:
      - "Backup-GPO -All -Path D:\\SauvegardeGPO"
      - "Restore-GPO -Name 'Postes - Sécurité' -Path D:\\SauvegardeGPO"
    module: GroupPolicy
    perms: Lecture des GPO ; écriture pour restaurer
    pitfall: 'La sauvegarde ne contient pas les liens aux OU : notez-les avec Get-GPInheritance.'
    doc: gp/backup-gpo
  - name: Get-ADObject (corbeille AD)
    cat: audit
    syn: Get-ADObject -Filter 'isDeleted -eq $true' -IncludeDeletedObjects
    desc: Retrouve et restaure un objet supprimé quand la corbeille AD est activée.
    ex:
      - 'Get-ADObject -Filter ''isDeleted -eq $true -and Name -like "Jean*"'' -IncludeDeletedObjects -Properties LastKnownParent'
      - 'Get-ADObject -Filter ''Name -like "Jean*"'' -IncludeDeletedObjects | Restore-ADObject'
    module: ActiveDirectory
    perms: Administrateur du domaine
    pitfall: "Sans corbeille AD activée (Enable-ADOptionalFeature 'Recycle Bin Feature'), la restauration d'attributs est limitée."
    doc: ad/get-adobject
  - name: Get-ADDefaultDomainPasswordPolicy
    cat: audit
    syn: Get-ADDefaultDomainPasswordPolicy ; Get-ADFineGrainedPasswordPolicy -Filter *
    desc: Stratégie de mot de passe du domaine et stratégies affinées.
    ex:
      - 'Get-ADDefaultDomainPasswordPolicy'
      - 'Get-ADUserResultantPasswordPolicy jdupont'
    module: ActiveDirectory
    perms: Lecture du domaine
    pitfall: 'Une stratégie affinée (PSO) prime sur la stratégie du domaine pour les utilisateurs ciblés.'
    doc: ad/get-addefaultdomainpasswordpolicy
  - name: 'Get-ADUser (audit : comptes jamais connectés, mots de passe anciens)'
    cat: audit
    syn: Get-ADUser -Filter {...} -Properties PasswordLastSet,LastLogonDate
    desc: Requêtes d'audit courantes sur les comptes.
    ex:
      - 'Get-ADUser -Filter {Enabled -eq $true} -Properties PasswordLastSet | Where PasswordLastSet -lt (Get-Date).AddDays(-365) | Select Name,PasswordLastSet'
      - 'Get-ADUser -Filter * -Properties LastLogonDate | Where {$_.LastLogonDate -eq $null -and $_.Enabled} | Select Name'
      - 'Get-ADUser -Filter {AdminCount -eq 1} -Properties AdminCount | Select Name'
    module: ActiveDirectory
    perms: Lecture du domaine
    pitfall: "AdminCount = 1 signale d'anciens ou d'actuels comptes privilégiés ; vérifiez leur appartenance avant de nettoyer."
    doc: ad/get-aduser
  - name: ldifde / csvde
    cat: audit
    syn: csvde -f <export.csv> -r "(objectClass=user)" -l <attributs>
    desc: Exporte ou importe des objets AD en CSV (csvde) ou LDIF (ldifde).
    ex:
      - "csvde -f C:\\Temp\\users.csv -r \"(&(objectCategory=person)(objectClass=user))\" -l sAMAccountName,mail,displayName"
      - "ldifde -f C:\\Temp\\group.ldf -d \"CN=GRP_Compta,OU=Groupes,DC=contoso,DC=local\""
    module: csvde, ldifde
    perms: Lecture ; écriture pour l'import
    pitfall: "L'import avec -i peut modifier massivement l'annuaire : faites-le toujours d'abord avec un petit fichier de test."
    url: https://learn.microsoft.com/windows-server/administration/windows-commands/windows-commands
