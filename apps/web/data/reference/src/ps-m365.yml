# PowerShell Microsoft 365 : source éditable. Après modification : `pnpm --filter @grichard/web reference:build`.
# Champs d'une entrée : name, cat, syn, desc, alias, ex (liste), tags, module, perms, pitfall, doc (suffixe Microsoft Learn) ou url.
meta:
  id: powershell-m365
  order: 2
  title: 'PowerShell Microsoft 365 : commandes et cheatsheet'
  h1: PowerShell Microsoft 365
  description: 'Cheatsheet PowerShell pour Microsoft 365 : Exchange Online, Graph, Entra ID, Teams, SharePoint, avec module, permissions, exemple et piège courant.'
  intro: 'Cmdlets des modules actuels (Exchange Online, Microsoft Graph PowerShell, Teams, SharePoint Online). MSOnline et AzureAD sont dépréciés : utilisez Microsoft Graph PowerShell.'
  card: 'Exchange Online, Microsoft Graph, Entra ID, Teams, SharePoint, Intune, Defender/Purview : cmdlet, module, permissions, exemple, piège, et scripts d’export prêts à l’emploi.'
  notice: "MSOnline et AzureAD (cmdlets Msol* et *-AzureAD*) sont dépréciés et ne reçoivent plus de correctifs : migrez vers Microsoft Graph PowerShell (Mg*). Testez d'abord avec -WhatIf quand il existe."
  docBase: https://learn.microsoft.com/powershell/module/
  docs:
    label: Documentation PowerShell Microsoft 365
    url: https://learn.microsoft.com/microsoft-365/enterprise/connect-to-microsoft-365-powershell
  fields:
    - { key: module, label: Module requis }
    - { key: perms, label: Permissions / rôles }
    - { key: pitfall, label: Piège courant }
  cats:
    - { id: exchange, label: Exchange Online }
    - { id: scripts, label: "Scripts prêts à l'emploi" }
    - { id: graph, label: Graph et Entra ID }
    - { id: teams, label: Teams }
    - { id: sharepoint, label: SharePoint Online }
    - { id: intune, label: Intune }
    - { id: security, label: Defender et Purview }
    - { id: legacy, label: MSOnline / AzureAD (déprécié) }
  top:
    - title: Connexion
      note: "Installez d'abord les modules (une fois) avec Install-Module -Scope CurrentUser, puis connectez-vous à chaque session."
      items:
        - code: 'Connect-ExchangeOnline -UserPrincipalName admin@contoso.com'
          note: 'Exchange Online (module ExchangeOnlineManagement). Ajoutez -ShowBanner:$false pour un affichage plus court. Déconnexion : Disconnect-ExchangeOnline -Confirm:$false.'
        - code: "Connect-MgGraph -Scopes 'User.Read.All','Group.ReadWrite.All','Directory.Read.All'"
          note: 'Microsoft Graph PowerShell : demandez uniquement les scopes nécessaires (moindre privilège). Vérifiez avec Get-MgContext. Scopes courants : User.ReadWrite.All, Group.ReadWrite.All, Directory.ReadWrite.All, Policy.Read.All, DeviceManagementManagedDevices.Read.All, AuditLog.Read.All.'
        - code: 'Connect-MicrosoftTeams'
          note: 'Teams (module MicrosoftTeams). Rôle Teams Administrator ou supérieur.'
        - code: 'Connect-SPOService -Url https://contoso-admin.sharepoint.com'
          note: "SharePoint Online (module Microsoft.Online.SharePoint.PowerShell), URL du centre d'administration. Alternative : PnP.PowerShell."
        - code: 'Connect-IPPSSession -UserPrincipalName admin@contoso.com'
          note: 'Security & Compliance (Defender, Purview) : même module que Exchange Online.'
entries:
  # ---------------------------------------------------------------- Exchange Online
  - name: Get-Mailbox
    cat: exchange
    syn: Get-Mailbox [-Identity <id>] [-ResultSize Unlimited]
    desc: Liste les boîtes aux lettres ou affiche les propriétés d'une boîte.
    ex:
      - 'Get-Mailbox -Identity user@contoso.com | Format-List DisplayName,PrimarySmtpAddress,ArchiveStatus,LitigationHoldEnabled'
      - 'Get-Mailbox -ResultSize Unlimited -RecipientTypeDetails SharedMailbox'
    tags: [boîte aux lettres, partagée, shared]
    module: ExchangeOnlineManagement
    perms: 'Rôle Exchange « View-Only Recipients » ou Exchange Administrator'
    pitfall: 'Sans -ResultSize Unlimited, seuls 1000 résultats sont renvoyés.'
    doc: exchange/get-mailbox
  - name: Set-Mailbox
    cat: exchange
    syn: Set-Mailbox -Identity <id> [propriétés]
    desc: Modifie une boîte aux lettres (quota, adresse, transfert, archive, conservation).
    ex:
      - 'Set-Mailbox -Identity user@contoso.com -ForwardingSmtpAddress ext@example.com -DeliverToMailboxAndForward $true'
      - 'Set-Mailbox -Identity user@contoso.com -LitigationHoldEnabled $true'
    module: ExchangeOnlineManagement
    perms: 'Exchange Administrator ou rôle « Mail Recipients »'
    pitfall: 'Le transfert externe est souvent bloqué par la politique anti-spam sortante du tenant.'
    doc: exchange/set-mailbox
  - name: Set-MailboxAutoReplyConfiguration
    cat: exchange
    syn: Set-MailboxAutoReplyConfiguration -Identity <id> -AutoReplyState Enabled|Disabled|Scheduled
    desc: Active, programme ou coupe la réponse automatique d'absence d'une boîte (message interne et externe).
    ex:
      - "Set-MailboxAutoReplyConfiguration -Identity user@contoso.com -AutoReplyState Enabled -InternalMessage 'Absent jusqu''au 5 janvier.' -ExternalMessage 'Absent jusqu''au 5 janvier.'"
      - "Set-MailboxAutoReplyConfiguration -Identity user@contoso.com -AutoReplyState Scheduled -StartTime '2026-12-22 18:00' -EndTime '2027-01-05 08:00' -InternalMessage 'Congés'"
      - 'Set-MailboxAutoReplyConfiguration -Identity user@contoso.com -AutoReplyState Disabled'
    tags: [absence, répondeur, congés]
    module: ExchangeOnlineManagement
    perms: 'Exchange Administrator ou rôle « Mail Recipients »'
    pitfall: 'Sans -ExternalMessage, les expéditeurs externes ne reçoivent rien ; -ExternalAudience (Known ou All) limite ou élargit les destinataires de la réponse.'
    doc: exchange/set-mailboxautoreplyconfiguration
  - name: New-Mailbox
    cat: exchange
    syn: New-Mailbox -Shared -Name <nom> -DisplayName <nom>
    desc: Crée une boîte aux lettres partagée (ou salle/équipement avec -Room, -Equipment).
    ex:
      - "New-Mailbox -Shared -Name 'Support' -DisplayName 'Support' -PrimarySmtpAddress support@contoso.com"
    module: ExchangeOnlineManagement
    perms: 'Exchange Administrator'
    pitfall: "Une boîte partagée n'a pas besoin de licence tant qu'elle reste sous 50 Go et sans archive."
    doc: exchange/new-mailbox
  - name: Add-MailboxPermission
    cat: exchange
    syn: Add-MailboxPermission -Identity <boîte> -User <utilisateur> -AccessRights FullAccess
    desc: Donne l'accès complet à une boîte (délégation de lecture/écriture).
    ex:
      - 'Add-MailboxPermission -Identity shared@contoso.com -User user@contoso.com -AccessRights FullAccess -AutoMapping $true'
    alias: [delegation, full access]
    module: ExchangeOnlineManagement
    perms: 'Exchange Administrator'
    pitfall: 'Prévoyez 30 à 60 minutes de propagation ; ajoutez aussi Add-RecipientPermission pour « Envoyer en tant que ».'
    doc: exchange/add-mailboxpermission
  - name: Add-RecipientPermission
    cat: exchange
    syn: Add-RecipientPermission -Identity <boîte> -Trustee <utilisateur> -AccessRights SendAs
    desc: Autorise « Envoyer en tant que » sur une boîte ou un groupe.
    ex:
      - 'Add-RecipientPermission -Identity shared@contoso.com -Trustee user@contoso.com -AccessRights SendAs -Confirm:$false'
    module: ExchangeOnlineManagement
    perms: 'Exchange Administrator'
    pitfall: '« Envoyer de la part de » (SendOnBehalf) est une autre commande : Set-Mailbox -GrantSendOnBehalfTo.'
    doc: exchange/add-recipientpermission
  - name: Get-MailboxStatistics
    cat: exchange
    syn: Get-MailboxStatistics -Identity <id>
    desc: Taille, nombre d'éléments et dernière connexion d'une boîte.
    ex:
      - 'Get-MailboxStatistics user@contoso.com | Select DisplayName,TotalItemSize,ItemCount,LastLogonTime'
    module: ExchangeOnlineManagement
    perms: 'View-Only Recipients'
    pitfall: "LastLogonTime peut être vide si la boîte n'a jamais été ouverte ou n'a pas été utilisée récemment."
    doc: exchange/get-mailboxstatistics
  - name: Get-MessageTraceV2
    cat: exchange
    syn: Get-MessageTraceV2 -SenderAddress <expéditeur> -StartDate <date> -EndDate <date>
    desc: Suit un message (remis, retardé, rejeté) sur les 10 derniers jours. Remplace Get-MessageTrace.
    ex:
      - 'Get-MessageTraceV2 -RecipientAddress user@contoso.com -StartDate (Get-Date).AddDays(-2) -EndDate (Get-Date)'
    alias: [Get-MessageTrace, trace de message]
    module: ExchangeOnlineManagement (version récente)
    perms: 'View-Only Recipients ou Message Tracking'
    pitfall: 'Get-MessageTrace est en cours de retrait ; au-delà de 10 jours, utilisez Start-HistoricalSearch.'
    doc: exchange/get-messagetracev2
  - name: Start-HistoricalSearch
    cat: exchange
    syn: Start-HistoricalSearch -ReportTitle <titre> -ReportType MessageTrace ...
    desc: Lance une recherche de traces de messages au-delà de 10 jours (jusqu'à 90 jours), livrée par e-mail.
    ex:
      - "Start-HistoricalSearch -ReportTitle 'Trace' -ReportType MessageTrace -StartDate (Get-Date).AddDays(-30) -EndDate (Get-Date) -SenderAddress a@example.com -NotifyAddress admin@contoso.com"
    module: ExchangeOnlineManagement
    perms: 'Exchange Administrator'
    pitfall: "Le résultat n'arrive pas dans la console : il est envoyé en CSV à l'adresse de notification."
    doc: exchange/start-historicalsearch
  - name: New-TransportRule
    cat: exchange
    syn: New-TransportRule -Name <nom> -Conditions... -Actions...
    desc: Crée une règle de flux de messagerie (disclaimer, blocage, redirection).
    ex:
      - "New-TransportRule -Name 'Étiquette externe' -FromScope NotInOrganization -PrependSubject '[EXTERNE] '"
    module: ExchangeOnlineManagement
    perms: 'Exchange Administrator (rôle Transport Rules)'
    pitfall: "Créez-la en mode test (-Mode Audit) avant d'appliquer ; l'ordre des règles (-Priority) compte."
    doc: exchange/new-transportrule
  - name: Get-DistributionGroupMember
    cat: exchange
    syn: Get-DistributionGroupMember -Identity <groupe>
    desc: Liste les membres d'une liste de distribution.
    ex:
      - 'Get-DistributionGroupMember -Identity team@contoso.com -ResultSize Unlimited | Select DisplayName,PrimarySmtpAddress'
    module: ExchangeOnlineManagement
    perms: 'View-Only Recipients'
    pitfall: 'Pour un groupe Microsoft 365, utilisez Get-UnifiedGroupLinks -LinkType Members.'
    doc: exchange/get-distributiongroupmember
  - name: Add-DistributionGroupMember
    cat: exchange
    syn: Add-DistributionGroupMember -Identity <groupe> -Member <utilisateur>
    desc: Ajoute un membre à une liste de distribution.
    ex:
      - 'Add-DistributionGroupMember -Identity team@contoso.com -Member user@contoso.com'
    module: ExchangeOnlineManagement
    perms: 'Propriétaire du groupe ou Exchange Administrator'
    pitfall: 'Impossible de modifier un groupe de sécurité à extension messagerie synchronisé depuis AD : modifiez-le sur site.'
    doc: exchange/add-distributiongroupmember
  - name: Set-CalendarProcessing
    cat: exchange
    syn: Set-CalendarProcessing -Identity <salle> -AutomateProcessing AutoAccept
    desc: Règle l'acceptation automatique des réunions pour une salle ou un équipement.
    ex:
      - 'Set-CalendarProcessing -Identity salle1@contoso.com -AutomateProcessing AutoAccept -AllowConflicts $false'
    module: ExchangeOnlineManagement
    perms: 'Exchange Administrator'
    pitfall: '-AllowConflicts $false ne suffit pas pour les réunions récurrentes : réglez aussi -ConflictPercentageAllowed.'
    doc: exchange/set-calendarprocessing
  - name: Add-MailboxFolderPermission
    cat: exchange
    syn: Add-MailboxFolderPermission -Identity <boîte>:\Calendrier -User <utilisateur> -AccessRights Reviewer
    desc: Partage un dossier (agenda, boîte de réception) avec un utilisateur.
    ex:
      - "Add-MailboxFolderPermission -Identity user@contoso.com:\\Calendar -User collegue@contoso.com -AccessRights Editor"
    module: ExchangeOnlineManagement
    perms: 'Exchange Administrator ou propriétaire de la boîte'
    pitfall: 'Le nom du dossier dépend de la langue de la boîte (Calendrier en français) ; vérifiez avec Get-MailboxFolderStatistics.'
    doc: exchange/add-mailboxfolderpermission
  - name: Get-EXOMailbox
    cat: exchange
    syn: Get-EXOMailbox -Identity <id> -Properties <liste>
    desc: Version rapide et économe de Get-Mailbox pour de grands volumes.
    ex:
      - 'Get-EXOMailbox -ResultSize Unlimited -Properties ProhibitSendQuota | Select DisplayName,ProhibitSendQuota'
    module: ExchangeOnlineManagement (v3+)
    perms: 'View-Only Recipients'
    pitfall: 'Seules les propriétés demandées avec -Properties sont renvoyées.'
    doc: exchange/get-exomailbox
  - name: Enable-Mailbox (archive)
    cat: exchange
    syn: Enable-Mailbox -Identity <id> -Archive
    desc: Active l'archivage en ligne d'une boîte.
    ex:
      - 'Enable-Mailbox -Identity user@contoso.com -Archive'
    module: ExchangeOnlineManagement
    perms: 'Exchange Administrator'
    pitfall: "Nécessite une licence qui inclut l'archive (Exchange Online Plan 2 ou équivalent)."
    doc: exchange/enable-mailbox

  # ---------------------------------------------------------------- Microsoft Graph et Entra ID
  - name: Connect-MgGraph
    cat: graph
    syn: Connect-MgGraph -Scopes <scopes> [-TenantId <id>] [-NoWelcome]
    desc: Ouvre une session Microsoft Graph PowerShell avec les scopes demandés.
    ex:
      - "Connect-MgGraph -Scopes 'User.ReadWrite.All' -NoWelcome"
      - 'Get-MgContext | Select Account,TenantId,Scopes'
    module: Microsoft.Graph.Authentication
    perms: 'Consentement administrateur pour les scopes sensibles'
    pitfall: 'Un scope absent donne « Insufficient privileges » : reconnectez-vous avec le bon scope.'
    url: https://learn.microsoft.com/powershell/module/microsoft.graph.authentication/connect-mggraph
  - name: Get-MgUser
    cat: graph
    syn: Get-MgUser [-UserId <id>] [-Filter <odata>] [-Property <liste>] [-All]
    desc: Lit un utilisateur ou liste les comptes Entra ID. Remplace Get-MsolUser / Get-AzureADUser.
    alias: [Get-MsolUser, Get-AzureADUser]
    ex:
      - 'Get-MgUser -UserId user@contoso.com -Property DisplayName,AccountEnabled,SignInActivity'
      - 'Get-MgUser -All -Filter "accountEnabled eq false" | Select DisplayName,UserPrincipalName'
    module: Microsoft.Graph.Users
    perms: 'User.Read.All (AuditLog.Read.All pour SignInActivity)'
    pitfall: 'Par défaut peu de propriétés sont renvoyées : demandez-les avec -Property. Sans -All, la liste est tronquée.'
    doc: microsoft.graph.users/get-mguser
  - name: New-MgUser
    cat: graph
    syn: New-MgUser -DisplayName <nom> -UserPrincipalName <upn> -MailNickname <alias> -AccountEnabled -PasswordProfile <hash>
    desc: Crée un utilisateur Entra ID.
    ex:
      - "New-MgUser -DisplayName 'Jean Dupont' -UserPrincipalName jean@contoso.com -MailNickname jean -AccountEnabled -PasswordProfile @{ Password = '<mot de passe>'; ForceChangePasswordNextSignIn = $true }"
    module: Microsoft.Graph.Users
    perms: 'User.ReadWrite.All ; rôle User Administrator'
    pitfall: "Définissez UsageLocation avant d'attribuer une licence."
    doc: microsoft.graph.users/new-mguser
  - name: Update-MgUser
    cat: graph
    syn: Update-MgUser -UserId <id> [-propriété valeur]
    desc: Modifie un utilisateur (service, titre, activation, localisation d'usage).
    ex:
      - 'Update-MgUser -UserId user@contoso.com -AccountEnabled:$false'
      - 'Update-MgUser -UserId user@contoso.com -UsageLocation FR'
    module: Microsoft.Graph.Users
    perms: 'User.ReadWrite.All'
    pitfall: "Désactiver un compte n'invalide pas les sessions en cours : utilisez aussi Revoke-MgUserSignInSession."
    doc: microsoft.graph.users/update-mguser
  - name: Revoke-MgUserSignInSession
    cat: graph
    syn: Revoke-MgUserSignInSession -UserId <id>
    desc: Révoque les jetons d'actualisation et les sessions d'un utilisateur (compte compromis).
    ex:
      - 'Revoke-MgUserSignInSession -UserId user@contoso.com'
    module: Microsoft.Graph.Users.Actions
    perms: 'User.RevokeSessions.All'
    pitfall: "Les jetons d'accès déjà émis restent valides jusqu'à environ une heure."
    doc: microsoft.graph.users.actions/revoke-mgusersigninsession
  - name: Set-MgUserLicense
    cat: graph
    syn: Set-MgUserLicense -UserId <id> -AddLicenses @{SkuId=...} -RemoveLicenses @()
    desc: Attribue ou retire des licences Microsoft 365.
    ex:
      - 'Get-MgSubscribedSku | Select SkuPartNumber,SkuId,ConsumedUnits'
      - "Set-MgUserLicense -UserId user@contoso.com -AddLicenses @{SkuId='<SkuId>'} -RemoveLicenses @()"
    module: Microsoft.Graph.Users.Actions
    perms: 'LicenseAssignment.ReadWrite.All ou User.ReadWrite.All'
    pitfall: '-RemoveLicenses est obligatoire même vide ; UsageLocation doit être renseignée.'
    doc: microsoft.graph.users.actions/set-mguserlicense
  - name: Get-MgGroup
    cat: graph
    syn: Get-MgGroup [-GroupId <id>] [-Filter <odata>] [-All]
    desc: Liste les groupes Entra ID (Microsoft 365, sécurité).
    ex:
      - 'Get-MgGroup -All -Filter "startsWith(displayName,''Ventes'')"'
    module: Microsoft.Graph.Groups
    perms: 'Group.Read.All'
    pitfall: 'Les filtres avancés (endswith, not) demandent -ConsistencyLevel eventual -CountVariable n.'
    doc: microsoft.graph.groups/get-mggroup
  - name: New-MgGroupMember
    cat: graph
    syn: New-MgGroupMember -GroupId <id> -DirectoryObjectId <id>
    desc: Ajoute un membre à un groupe Entra ID.
    ex:
      - 'New-MgGroupMember -GroupId $groupId -DirectoryObjectId (Get-MgUser -UserId user@contoso.com).Id'
    module: Microsoft.Graph.Groups
    perms: 'GroupMember.ReadWrite.All'
    pitfall: 'Impossible sur un groupe à appartenance dynamique ou synchronisé depuis AD.'
    doc: microsoft.graph.groups/new-mggroupmember
  - name: Get-MgUserAuthenticationMethod
    cat: graph
    syn: Get-MgUserAuthenticationMethod -UserId <id>
    desc: Liste les méthodes d'authentification (MFA) d'un utilisateur.
    ex:
      - 'Get-MgUserAuthenticationMethod -UserId user@contoso.com | Select Id,AdditionalProperties'
    module: Microsoft.Graph.Identity.SignIns
    perms: 'UserAuthenticationMethod.Read.All ; rôle Authentication Administrator'
    pitfall: 'Le type de méthode est dans AdditionalProperties.@odata.type.'
    doc: microsoft.graph.identity.signins/get-mguserauthenticationmethod
  - name: Get-MgAuditLogSignIn
    cat: graph
    syn: Get-MgAuditLogSignIn -Filter <odata> -Top <n>
    desc: Journal des connexions Entra ID (échecs, localisation, accès conditionnel).
    ex:
      - 'Get-MgAuditLogSignIn -Filter "userPrincipalName eq ''user@contoso.com''" -Top 20 | Select CreatedDateTime,AppDisplayName,IPAddress,Status'
    module: Microsoft.Graph.Reports
    perms: 'AuditLog.Read.All ; licence Entra ID P1'
    pitfall: 'Conservation de 30 jours seulement ; le filtre ne gère pas toutes les combinaisons.'
    doc: microsoft.graph.reports/get-mgauditlogsignin
  - name: Get-MgDirectoryRole
    cat: graph
    syn: Get-MgDirectoryRole / Get-MgDirectoryRoleMember
    desc: Liste les rôles d'administration activés et leurs membres.
    ex:
      - '$r = Get-MgDirectoryRole -Filter "displayName eq ''Global Administrator''"; Get-MgDirectoryRoleMember -DirectoryRoleId $r.Id'
    module: Microsoft.Graph.Identity.DirectoryManagement
    perms: 'RoleManagement.Read.Directory'
    pitfall: "Un rôle jamais attribué n'apparaît pas tant qu'il n'est pas activé ; l'appartenance via PIM n'est pas listée ici."
    doc: microsoft.graph.identity.directorymanagement/get-mgdirectoryrole
  - name: Get-MgSubscribedSku
    cat: graph
    syn: Get-MgSubscribedSku
    desc: Licences achetées, consommées et disponibles du tenant.
    ex:
      - "Get-MgSubscribedSku | Select SkuPartNumber,ConsumedUnits,@{n='Total';e={$_.PrepaidUnits.Enabled}}"
    module: Microsoft.Graph.Identity.DirectoryManagement
    perms: 'Organization.Read.All'
    pitfall: 'SkuPartNumber est un nom technique (SPE_E3 pour Microsoft 365 E3), pas le nom commercial.'
    doc: microsoft.graph.identity.directorymanagement/get-mgsubscribedsku
  - name: Get-MgIdentityConditionalAccessPolicy
    cat: graph
    syn: Get-MgIdentityConditionalAccessPolicy
    desc: Liste les stratégies d'accès conditionnel.
    ex:
      - 'Get-MgIdentityConditionalAccessPolicy | Select DisplayName,State'
    module: Microsoft.Graph.Identity.SignIns
    perms: 'Policy.Read.All'
    pitfall: "Passez toujours une nouvelle stratégie en mode « rapport seul » avant de l'activer, pour ne pas vous verrouiller."
    doc: microsoft.graph.identity.signins/get-mgidentityconditionalaccesspolicy

  # ---------------------------------------------------------------- Teams
  - name: Get-Team
    cat: teams
    syn: Get-Team [-DisplayName <nom>] [-User <upn>]
    desc: Liste les équipes Teams.
    ex:
      - "Get-Team -DisplayName 'Projet' | Select GroupId,DisplayName,Visibility,Archived"
    module: MicrosoftTeams
    perms: 'Teams Administrator ou lecture globale'
    pitfall: '-DisplayName fait une recherche par préfixe, pas un nom exact.'
    doc: teams/get-team
  - name: New-Team
    cat: teams
    syn: New-Team -DisplayName <nom> -Visibility Private
    desc: Crée une équipe (et son groupe Microsoft 365).
    ex:
      - "New-Team -DisplayName 'Projet Alpha' -Visibility Private -Owner admin@contoso.com"
    module: MicrosoftTeams
    perms: 'Teams Administrator ; création possiblement limitée par la stratégie de groupes'
    pitfall: "Précisez -Owner : sans propriétaire, l'équipe peut être orpheline."
    doc: teams/new-team
  - name: Add-TeamUser
    cat: teams
    syn: Add-TeamUser -GroupId <id> -User <upn> -Role Member
    desc: Ajoute un membre ou un propriétaire à une équipe.
    ex:
      - 'Add-TeamUser -GroupId $groupId -User user@contoso.com -Role Member'
    module: MicrosoftTeams
    perms: "Propriétaire de l'équipe ou Teams Administrator"
    pitfall: "Pour un propriétaire, l'utilisateur doit déjà être membre."
    doc: teams/add-teamuser
  - name: Get-CsOnlineUser
    cat: teams
    syn: Get-CsOnlineUser -Identity <upn>
    desc: Affiche la configuration Teams d'un utilisateur (téléphonie, stratégies).
    ex:
      - 'Get-CsOnlineUser -Identity user@contoso.com | Select DisplayName,TeamsMeetingPolicy,LineUri,InterpretedUserType'
    module: MicrosoftTeams
    perms: 'Teams Administrator'
    pitfall: 'Une stratégie vide signifie « globale par défaut », pas « aucune ».'
    doc: teams/get-csonlineuser
  - name: Grant-CsTeamsMeetingPolicy
    cat: teams
    syn: Grant-CsTeamsMeetingPolicy -Identity <upn> -PolicyName <stratégie>
    desc: Attribue une stratégie de réunion Teams à un utilisateur.
    ex:
      - "Grant-CsTeamsMeetingPolicy -Identity user@contoso.com -PolicyName 'RestrictedAnonymous'"
    module: MicrosoftTeams
    perms: 'Teams Administrator'
    pitfall: "Jusqu'à 24 h de propagation ; pour beaucoup d'utilisateurs, préférez une attribution par groupe (New-CsGroupPolicyAssignment)."
    doc: teams/grant-csteamsmeetingpolicy

  # ---------------------------------------------------------------- SharePoint Online
  - name: Get-SPOSite
    cat: sharepoint
    syn: Get-SPOSite [-Identity <url>] [-Limit All]
    desc: Liste les collections de sites SharePoint.
    ex:
      - 'Get-SPOSite -Limit All | Select Url,StorageUsageCurrent,SharingCapability'
    module: Microsoft.Online.SharePoint.PowerShell
    perms: 'SharePoint Administrator'
    pitfall: 'Sans -Limit All, seuls 200 sites sont renvoyés.'
    doc: sharepoint-online/get-sposite
  - name: Set-SPOSite
    cat: sharepoint
    syn: Set-SPOSite -Identity <url> [-SharingCapability ...] [-StorageQuota ...]
    desc: Modifie un site (partage externe, quota, verrouillage).
    ex:
      - 'Set-SPOSite -Identity https://contoso.sharepoint.com/sites/rh -SharingCapability Disabled'
      - 'Set-SPOSite -Identity https://contoso.sharepoint.com/sites/rh -LockState ReadOnly'
    module: Microsoft.Online.SharePoint.PowerShell
    perms: 'SharePoint Administrator'
    pitfall: "Le partage d'un site ne peut pas être plus ouvert que celui du tenant (Set-SPOTenant)."
    doc: sharepoint-online/set-sposite
  - name: Get-SPOTenant
    cat: sharepoint
    syn: Get-SPOTenant
    desc: Paramètres globaux du tenant SharePoint et OneDrive (partage, synchronisation).
    ex:
      - 'Get-SPOTenant | Select SharingCapability,DefaultSharingLinkType,OneDriveStorageQuota'
    module: Microsoft.Online.SharePoint.PowerShell
    perms: 'SharePoint Administrator'
    pitfall: "Une modification de Set-SPOTenant peut mettre plusieurs minutes à s'appliquer."
    doc: sharepoint-online/get-spotenant
  - name: Get-SPOUser / Add-SPOUser
    cat: sharepoint
    syn: Get-SPOUser -Site <url> / Add-SPOUser -Site <url> -LoginName <upn> -Group <groupe>
    desc: Consulte ou ajoute des utilisateurs dans un site.
    ex:
      - 'Get-SPOUser -Site https://contoso.sharepoint.com/sites/rh -Limit All'
      - "Add-SPOUser -Site https://contoso.sharepoint.com/sites/rh -LoginName user@contoso.com -Group 'RH Members'"
    module: Microsoft.Online.SharePoint.PowerShell
    perms: 'Administrateur de la collection de sites'
    pitfall: 'Add-SPOUser exige un groupe existant du site ; vérifiez le nom exact avec Get-SPOSiteGroup.'
    doc: sharepoint-online/add-spouser
  - name: Restore-SPODeletedSite
    cat: sharepoint
    syn: Restore-SPODeletedSite -Identity <url>
    desc: Restaure un site supprimé (corbeille du tenant, 93 jours).
    ex:
      - 'Get-SPODeletedSite | Select Url,DeletionTime'
      - 'Restore-SPODeletedSite -Identity https://contoso.sharepoint.com/sites/rh'
    module: Microsoft.Online.SharePoint.PowerShell
    perms: 'SharePoint Administrator'
    pitfall: 'Un site lié à un groupe Microsoft 365 se restaure aussi via le groupe supprimé (Entra ID).'
    doc: sharepoint-online/restore-spodeletedsite

  # ---------------------------------------------------------------- Intune
  - name: Get-MgDeviceManagementManagedDevice
    cat: intune
    syn: Get-MgDeviceManagementManagedDevice [-Filter <odata>] [-All]
    desc: Liste les appareils gérés par Intune (conformité, système, dernier contact).
    ex:
      - 'Get-MgDeviceManagementManagedDevice -All -Filter "operatingSystem eq ''Windows''" | Select DeviceName,UserPrincipalName,ComplianceState,LastSyncDateTime'
    module: Microsoft.Graph.DeviceManagement
    perms: 'DeviceManagementManagedDevices.Read.All ; rôle Intune Administrator'
    pitfall: "LastSyncDateTime ancien n'est pas une panne : l'appareil est peut-être simplement éteint."
    doc: microsoft.graph.devicemanagement/get-mgdevicemanagementmanageddevice
  - name: Sync-MgDeviceManagementManagedDevice
    cat: intune
    syn: Sync-MgDeviceManagementManagedDevice -ManagedDeviceId <id>
    desc: Demande une synchronisation immédiate d'un appareil Intune.
    ex:
      - 'Sync-MgDeviceManagementManagedDevice -ManagedDeviceId $id'
    module: Microsoft.Graph.DeviceManagement
    perms: 'DeviceManagementManagedDevices.PrivilegedOperations.All'
    pitfall: "La commande n'est qu'une demande : l'appareil doit être en ligne pour la traiter."
    doc: microsoft.graph.devicemanagement/sync-mgdevicemanagementmanageddevice
  - name: Invoke-MgRetireDeviceManagementManagedDevice
    cat: intune
    syn: Invoke-MgRetireDeviceManagementManagedDevice -ManagedDeviceId <id>
    desc: Retire un appareil de la gestion (supprime les données d'entreprise, garde les données personnelles).
    ex:
      - 'Invoke-MgRetireDeviceManagementManagedDevice -ManagedDeviceId $id'
    module: Microsoft.Graph.DeviceManagement
    perms: 'DeviceManagementManagedDevices.PrivilegedOperations.All'
    pitfall: 'Ne confondez pas avec Wipe (réinitialisation complète, destructive).'
    doc: microsoft.graph.devicemanagement/invoke-mgretiredevicemanagementmanageddevice

  # ---------------------------------------------------------------- Defender et Purview
  - name: Get-QuarantineMessage
    cat: security
    syn: Get-QuarantineMessage -StartReceivedDate <date> -EndReceivedDate <date>
    desc: Liste les messages en quarantaine Defender for Office 365.
    ex:
      - 'Get-QuarantineMessage -RecipientAddress user@contoso.com -StartReceivedDate (Get-Date).AddDays(-7) -EndReceivedDate (Get-Date) | Select ReceivedTime,SenderAddress,Subject,Type'
    module: ExchangeOnlineManagement
    perms: 'Security Administrator ou Quarantine Administrator'
    pitfall: 'Libérez avec Release-QuarantineMessage -Identity <id> -ReleaseToAll ; le délai maximum par défaut est de 30 jours.'
    doc: exchange/get-quarantinemessage
  - name: Get-MalwareFilterPolicy
    cat: security
    syn: Get-MalwareFilterPolicy / Set-MalwareFilterPolicy
    desc: Consulte ou règle la stratégie anti-programmes malveillants.
    ex:
      - 'Get-MalwareFilterPolicy | Select Name,EnableFileFilter,FileTypes'
    module: ExchangeOnlineManagement
    perms: 'Security Administrator'
    pitfall: "La stratégie par défaut s'applique en dernier ; les stratégies Preset peuvent la surcharger."
    doc: exchange/get-malwarefilterpolicy
  - name: Get-SafeLinksPolicy
    cat: security
    syn: Get-SafeLinksPolicy
    desc: Stratégies Liens fiables de Defender for Office 365.
    ex:
      - 'Get-SafeLinksPolicy | Select Name,EnableSafeLinksForEmail,ScanUrls,DoNotRewriteUrls'
    module: ExchangeOnlineManagement
    perms: 'Security Administrator'
    pitfall: 'Nécessite une licence Defender for Office 365 (Plan 1 ou 2).'
    doc: exchange/get-safelinkspolicy
  - name: Search-UnifiedAuditLog
    cat: security
    syn: Search-UnifiedAuditLog -StartDate <date> -EndDate <date> -UserIds <upn> -Operations <liste>
    desc: Interroge le journal d'audit unifié (connexions, accès aux fichiers, règles de boîte).
    ex:
      - 'Search-UnifiedAuditLog -StartDate (Get-Date).AddDays(-7) -EndDate (Get-Date) -UserIds user@contoso.com -Operations New-InboxRule,Set-InboxRule -ResultSize 500'
    module: ExchangeOnlineManagement
    perms: 'Rôle « View-Only Audit Logs » ; audit activé sur le tenant'
    pitfall: 'Limité à 5000 résultats par appel : paginez avec -SessionId et -SessionCommand ReturnLargeSet.'
    doc: exchange/search-unifiedauditlog
  - name: New-ComplianceSearch
    cat: security
    syn: New-ComplianceSearch -Name <nom> -ExchangeLocation All -ContentMatchQuery <KQL>
    desc: Crée une recherche de contenu Purview eDiscovery (puis Start-ComplianceSearch).
    ex:
      - 'New-ComplianceSearch -Name ''Facture-X'' -ExchangeLocation All -ContentMatchQuery ''subject:"Facture X"'''
      - "Start-ComplianceSearch -Identity 'Facture-X'"
    module: ExchangeOnlineManagement (Connect-IPPSSession)
    perms: 'eDiscovery Manager'
    pitfall: "N'utilisez New-ComplianceSearchAction -Purge qu'après vérification des résultats : la suppression est définitive."
    doc: exchange/new-compliancesearch
  - name: Get-DlpCompliancePolicy
    cat: security
    syn: Get-DlpCompliancePolicy
    desc: Liste les stratégies de prévention contre la perte de données (DLP).
    ex:
      - 'Get-DlpCompliancePolicy | Select Name,Mode,Enabled'
    module: ExchangeOnlineManagement (Connect-IPPSSession)
    perms: 'Compliance Administrator'
    pitfall: 'Une stratégie en mode TestWithNotifications ne bloque rien.'
    doc: exchange/get-dlpcompliancepolicy

  # ---------------------------------------------------------------- MSOnline / AzureAD (déprécié)
  - name: Connect-MsolService
    cat: legacy
    syn: Connect-MsolService
    desc: Connexion du module MSOnline, déprécié. Remplacer par Connect-MgGraph.
    alias: [MSOnline, Get-MsolUser, Set-MsolUser]
    ex:
      - '# Ancien : Connect-MsolService ; Get-MsolUser -UserPrincipalName user@contoso.com'
      - "# Nouveau : Connect-MgGraph -Scopes 'User.Read.All' ; Get-MgUser -UserId user@contoso.com"
    module: MSOnline (déprécié)
    perms: 'Rôle Global Reader ou supérieur'
    pitfall: 'Le module cesse de fonctionner avec la fin de ses API ; ne bâtissez plus de scripts dessus.'
    url: https://learn.microsoft.com/powershell/azure/active-directory/overview
  - name: Connect-AzureAD
    cat: legacy
    syn: Connect-AzureAD
    desc: Connexion du module AzureAD, déprécié. Remplacer par Connect-MgGraph.
    alias: [AzureAD, Get-AzureADUser, Get-AzureADGroup]
    ex:
      - '# Ancien : Get-AzureADGroupMember -ObjectId $id'
      - '# Nouveau : Get-MgGroupMember -GroupId $id'
    module: AzureAD (déprécié)
    perms: 'Rôle Global Reader ou supérieur'
    pitfall: "Les noms d'objets changent (ObjectId devient Id) et il faut redemander les scopes."
    url: https://learn.microsoft.com/powershell/microsoftgraph/azuread-msoline-cmdlet-map
  - name: Set-MsolUserPassword
    cat: legacy
    syn: Set-MsolUserPassword -UserPrincipalName <upn> -NewPassword <mdp>
    desc: 'Réinitialise un mot de passe (MSOnline, déprécié). Équivalent Graph : Update-MgUser avec -PasswordProfile.'
    ex:
      - "Update-MgUser -UserId user@contoso.com -PasswordProfile @{ Password = '<mot de passe>'; ForceChangePasswordNextSignIn = $true }"
    module: Microsoft.Graph.Users
    perms: 'User.ReadWrite.All ; rôle Password / User Administrator'
    pitfall: 'Un compte synchronisé depuis AD sur site se réinitialise côté AD, pas dans Entra ID.'
    doc: microsoft.graph.users/update-mguser
  - name: Get-MailboxPermission
    cat: exchange
    syn: Get-MailboxPermission -Identity <boîte>
    desc: Liste qui a accès à une boîte aux lettres (contrôle total, lecture et gestion).
    ex:
      - Get-MailboxPermission -Identity shared@contoso.com | Where-Object { $_.User -ne 'NT AUTHORITY\SELF' -and -not $_.IsInherited } | Select-Object User,AccessRights
      - Get-MailboxPermission -User bob@contoso.com | Select-Object Identity,AccessRights
    tags:
      - delegation
      - accès
      - fullaccess
    module: ExchangeOnlineManagement
    perms: Rôle Exchange « View-Only Recipients » ou Exchange Administrator
    pitfall: Masquez les droits hérités et NT AUTHORITY\SELF, sinon la liste est très bruyante.
    doc: exchange/get-mailboxpermission
  - name: Remove-MailboxPermission
    cat: exchange
    syn: Remove-MailboxPermission -Identity <boîte> -User <utilisateur> -AccessRights FullAccess
    desc: Retire un accès « contrôle total » à une boîte aux lettres.
    ex:
      - Remove-MailboxPermission -Identity shared@contoso.com -User bob@contoso.com -AccessRights FullAccess -Confirm:$false
    tags:
      - delegation
      - accès
    module: ExchangeOnlineManagement
    perms: Rôle Exchange Administrator ou rôle de gestion adapté
    pitfall: Le retrait peut mettre plusieurs minutes à se propager dans Outlook.
    doc: exchange/remove-mailboxpermission
  - name: Get-RecipientPermission
    cat: exchange
    syn: Get-RecipientPermission -Identity <boîte>
    desc: Liste les droits « Envoyer en tant que » (SendAs) sur une boîte ou un groupe.
    ex:
      - Get-RecipientPermission -Identity shared@contoso.com | Where-Object { $_.Trustee -ne "NT AUTHORITY\SELF" } | Select-Object Trustee,AccessRights
      - Get-RecipientPermission -Trustee bob@contoso.com
    tags:
      - sendas
      - delegation
    module: ExchangeOnlineManagement
    perms: Rôle Exchange « View-Only Recipients » ou Exchange Administrator
    pitfall: SendAs et « Envoyer de la part de » (GrantSendOnBehalfTo) sont deux droits différents.
    doc: exchange/get-recipientpermission
  - name: Remove-RecipientPermission
    cat: exchange
    syn: Remove-RecipientPermission -Identity <boîte> -Trustee <utilisateur> -AccessRights SendAs
    desc: Retire un droit « Envoyer en tant que ».
    ex:
      - Remove-RecipientPermission -Identity shared@contoso.com -Trustee bob@contoso.com -AccessRights SendAs -Confirm:$false
    tags:
      - sendas
    module: ExchangeOnlineManagement
    perms: Rôle Exchange Administrator ou rôle de gestion adapté
    pitfall: Pensez aussi à retirer le droit « Envoyer de la part de » avec Set-Mailbox -GrantSendOnBehalfTo.
    doc: exchange/remove-recipientpermission
  - name: Set-Mailbox -GrantSendOnBehalfTo
    cat: exchange
    syn: Set-Mailbox -Identity <boîte> -GrantSendOnBehalfTo @{Add="<utilisateur>"}
    desc: Autorise (ou retire) « Envoyer de la part de » sur une boîte.
    ex:
      - Set-Mailbox -Identity shared@contoso.com -GrantSendOnBehalfTo @{Add="bob@contoso.com"}
      - Set-Mailbox -Identity shared@contoso.com -GrantSendOnBehalfTo @{Remove="bob@contoso.com"}
    tags:
      - delegation
      - sendonbehalf
    module: ExchangeOnlineManagement
    perms: Rôle Exchange Administrator ou rôle de gestion adapté
    pitfall: Sans @{Add=…}/@{Remove=…}, la liste est remplacée en entier.
    doc: exchange/set-mailbox
  - name: Set-Mailbox -EmailAddresses
    cat: exchange
    syn: Set-Mailbox -Identity <boîte> -EmailAddresses @{Add="<alias>"}
    desc: Ajoute, retire ou remplace les alias (adresses e-mail secondaires) d'une boîte.
    ex:
      - Set-Mailbox -Identity user@contoso.com -EmailAddresses @{Add="contact@contoso.com"}
      - Set-Mailbox -Identity user@contoso.com -EmailAddresses @{Remove="ancien@contoso.com"}
      - Set-Mailbox -Identity user@contoso.com -WindowsEmailAddress nouveau@contoso.com
    tags:
      - alias
      - proxyaddresses
      - smtp
    module: ExchangeOnlineManagement
    perms: Rôle Exchange Administrator ou rôle de gestion adapté
    pitfall: Sur un compte synchronisé depuis AD sur site, les alias se gèrent côté AD (proxyAddresses).
    doc: exchange/set-mailbox
  - name: Set-Mailbox -Type
    cat: exchange
    syn: Set-Mailbox -Identity <boîte> -Type Shared|Regular|Room|Equipment
    desc: Convertit une boîte (utilisateur en boîte partagée, par exemple lors d'un départ).
    ex:
      - Set-Mailbox -Identity ancien.salarie@contoso.com -Type Shared
    tags:
      - partagée
      - shared
      - départ
    module: ExchangeOnlineManagement
    perms: Rôle Exchange Administrator ou rôle de gestion adapté
    pitfall: Une boîte partagée de plus de 50 Go ou avec archive exige une licence Exchange Online Plan 2.
    doc: exchange/set-mailbox
  - name: Set-Mailbox -ProhibitSendQuota
    cat: exchange
    syn: Set-Mailbox -Identity <boîte> -ProhibitSendQuota <taille> -ProhibitSendReceiveQuota <taille> -IssueWarningQuota <taille>
    desc: Définit les quotas d'une boîte (avertissement, envoi interdit, envoi et réception interdits).
    ex:
      - Set-Mailbox -Identity user@contoso.com -IssueWarningQuota 44GB -ProhibitSendQuota 49GB -ProhibitSendReceiveQuota 50GB
    tags:
      - quota
      - taille
      - stockage
    module: ExchangeOnlineManagement
    perms: Rôle Exchange Administrator ou rôle de gestion adapté
    pitfall: 'Les valeurs doivent respecter la limite de la licence (50 Go ou 100 Go) : IssueWarning < ProhibitSend < ProhibitSendReceive.'
    doc: exchange/set-mailbox
  - name: Get-MailboxFolderStatistics
    cat: exchange
    syn: Get-MailboxFolderStatistics -Identity <boîte>
    desc: Taille et nombre d'éléments de chaque dossier d'une boîte (trouver ce qui la remplit).
    ex:
      - Get-MailboxFolderStatistics -Identity user@contoso.com | Sort-Object FolderSize -Descending | Select-Object -First 10 FolderPath,ItemsInFolder,FolderSize
      - Get-MailboxFolderStatistics -Identity user@contoso.com -FolderScope RecoverableItems
    tags:
      - taille
      - dossier
      - quota
    module: ExchangeOnlineManagement
    perms: Rôle Exchange « View-Only Recipients » ou Exchange Administrator
    pitfall: 'FolderSize est un texte (« 1.2 GB (1,288,490,188 bytes) ») : extrayez les octets pour trier ou calculer.'
    doc: exchange/get-mailboxfolderstatistics
  - name: Get-MailboxFolderPermission
    cat: exchange
    syn: Get-MailboxFolderPermission -Identity <boîte>:\<dossier>
    desc: Liste les droits sur un dossier de boîte (calendrier, boîte de réception).
    ex:
      - Get-MailboxFolderPermission -Identity user@contoso.com:\Calendrier
      - Get-MailboxFolderPermission -Identity user@contoso.com:\Calendar
    tags:
      - calendrier
      - calendar
      - permissions
    module: ExchangeOnlineManagement
    perms: Rôle Exchange « View-Only Recipients » ou Exchange Administrator
    pitfall: "Le nom du dossier dépend de la langue de la boîte : \\Calendrier en français, \\Calendar en anglais."
    doc: exchange/get-mailboxfolderpermission
  - name: Set-MailboxFolderPermission
    cat: exchange
    syn: Set-MailboxFolderPermission -Identity <boîte>:\<dossier> -User <utilisateur> -AccessRights <droit>
    desc: Modifie le droit d'un utilisateur existant sur un dossier (ex. Reviewer vers Editor).
    ex:
      - Set-MailboxFolderPermission -Identity user@contoso.com:\Calendrier -User bob@contoso.com -AccessRights Editor
      - Set-MailboxFolderPermission -Identity user@contoso.com:\Calendrier -User Default -AccessRights LimitedDetails
    tags:
      - calendrier
      - permissions
    module: ExchangeOnlineManagement
    perms: Rôle Exchange Administrator ou rôle de gestion adapté
    pitfall: Set modifie un droit déjà présent ; pour un nouvel utilisateur, utilisez Add-MailboxFolderPermission.
    doc: exchange/set-mailboxfolderpermission
  - name: Remove-MailboxFolderPermission
    cat: exchange
    syn: Remove-MailboxFolderPermission -Identity <boîte>:\<dossier> -User <utilisateur>
    desc: Retire le droit d'un utilisateur sur un dossier de boîte.
    ex:
      - Remove-MailboxFolderPermission -Identity user@contoso.com:\Calendrier -User bob@contoso.com -Confirm:$false
    tags:
      - calendrier
      - permissions
    module: ExchangeOnlineManagement
    perms: Rôle Exchange Administrator ou rôle de gestion adapté
    pitfall: 'Les entrées « Default » et « Anonymous » ne se retirent pas : on abaisse leur droit avec Set-.'
    doc: exchange/remove-mailboxfolderpermission
  - name: Get-InboxRule
    cat: exchange
    syn: Get-InboxRule -Mailbox <boîte>
    desc: Liste les règles de boîte de réception (repérer une redirection cachée après un piratage).
    ex:
      - Get-InboxRule -Mailbox user@contoso.com | Select-Object Name,Enabled,ForwardTo,ForwardAsAttachmentTo,RedirectTo,DeleteMessage
      - Get-InboxRule -Mailbox user@contoso.com -IncludeHidden | Where-Object { $_.ForwardTo -or $_.RedirectTo }
    tags:
      - règle
      - redirection
      - sécurité
      - transfert
    module: ExchangeOnlineManagement
    perms: Rôle Exchange « View-Only Recipients » ou Exchange Administrator
    pitfall: 'Les attaquants créent souvent des règles masquées : ajoutez -IncludeHidden.'
    doc: exchange/get-inboxrule
  - name: Remove-InboxRule
    cat: exchange
    syn: Remove-InboxRule -Identity <règle> -Mailbox <boîte>
    desc: Supprime une règle de boîte de réception.
    ex:
      - Remove-InboxRule -Identity "Transfert externe" -Mailbox user@contoso.com -Confirm:$false
    tags:
      - règle
      - sécurité
    module: ExchangeOnlineManagement
    perms: Rôle Exchange Administrator ou rôle de gestion adapté
    pitfall: Identifiez la règle par son Identity (RuleIdentity) si plusieurs portent le même nom.
    doc: exchange/remove-inboxrule
  - name: Get-Recipient
    cat: exchange
    syn: Get-Recipient -Identity <adresse>
    desc: Retrouve à quel objet (boîte, groupe, contact) appartient une adresse, alias compris.
    ex:
      - Get-Recipient -Identity contact@contoso.com | Format-List RecipientTypeDetails,PrimarySmtpAddress,EmailAddresses
      - Get-Recipient -ResultSize Unlimited -Filter "EmailAddresses -eq 'smtp:contact@contoso.com'"
    tags:
      - alias
      - adresse
      - propriétaire
    module: ExchangeOnlineManagement
    perms: Rôle Exchange « View-Only Recipients » ou Exchange Administrator
    pitfall: "Utile quand « l'adresse est déjà utilisée » : elle peut appartenir à un groupe ou à un contact."
    doc: exchange/get-recipient
  - name: Get-User
    cat: exchange
    syn: Get-User [-Identity <id>] [-ResultSize Unlimited]
    desc: "Lit les attributs d'annuaire d'un utilisateur : prénom, nom, service, fonction, manager."
    ex:
      - Get-User -Identity user@contoso.com | Format-List FirstName,LastName,DisplayName,Department,Title,Manager,Phone
      - Get-User -ResultSize Unlimited | Select-Object FirstName,LastName,UserPrincipalName,Department
    tags:
      - prénom
      - nom
      - annuaire
    module: ExchangeOnlineManagement
    perms: Rôle Exchange « View-Only Recipients » ou Exchange Administrator
    pitfall: 'Les prénom et nom ne sont pas dans Get-Mailbox : il faut Get-User (ou Get-MgUser) pour les exporter.'
    doc: exchange/get-user
  - name: Set-User
    cat: exchange
    syn: Set-User -Identity <id> [-FirstName] [-LastName] [-Department] [-Title]
    desc: Modifie le prénom, le nom, le service ou la fonction d'un utilisateur.
    ex:
      - Set-User -Identity user@contoso.com -FirstName Alice -LastName Martin -Department Comptabilité -Title "Responsable comptable"
    tags:
      - prénom
      - nom
      - annuaire
    module: ExchangeOnlineManagement
    perms: Rôle Exchange Administrator ou rôle de gestion adapté
    pitfall: Sur un compte synchronisé depuis AD sur site, la modification se fait côté AD.
    doc: exchange/set-user
  - name: Get-CASMailbox
    cat: exchange
    syn: Get-CASMailbox -Identity <boîte>
    desc: Affiche les protocoles activés d'une boîte (IMAP, POP, ActiveSync, MAPI, EWS, OWA).
    ex:
      - Get-CASMailbox -Identity user@contoso.com | Format-List ImapEnabled,PopEnabled,ActiveSyncEnabled,MAPIEnabled,OWAEnabled
      - Get-CASMailbox -ResultSize Unlimited -Filter "ImapEnabled -eq $true" | Select-Object PrimarySmtpAddress
    tags:
      - imap
      - pop
      - activesync
      - protocole
    module: ExchangeOnlineManagement
    perms: Rôle Exchange « View-Only Recipients » ou Exchange Administrator
    pitfall: Désactiver l'authentification de base se fait aussi au niveau du tenant (Authentication Policy / Security Defaults).
    doc: exchange/get-casmailbox
  - name: Set-CASMailbox
    cat: exchange
    syn: Set-CASMailbox -Identity <boîte> -ImapEnabled <bool> -PopEnabled <bool>
    desc: Active ou désactive IMAP, POP, ActiveSync… pour une boîte.
    ex:
      - Set-CASMailbox -Identity user@contoso.com -ImapEnabled $false -PopEnabled $false
      - Set-CASMailbox -Identity user@contoso.com -ActiveSyncEnabled $false
    tags:
      - imap
      - pop
      - sécurité
    module: ExchangeOnlineManagement
    perms: Rôle Exchange Administrator ou rôle de gestion adapté
    pitfall: 'Une application qui relève la boîte en IMAP/POP cessera de fonctionner : vérifiez avant.'
    doc: exchange/set-casmailbox
  - name: Set-MailboxRegionalConfiguration
    cat: exchange
    syn: Set-MailboxRegionalConfiguration -Identity <boîte> -Language <culture> -TimeZone <fuseau>
    desc: Règle la langue, le fuseau horaire et le format de date d'une boîte.
    ex:
      - Set-MailboxRegionalConfiguration -Identity user@contoso.com -Language fr-FR -TimeZone "Romance Standard Time" -LocalizeDefaultFolderName
    tags:
      - langue
      - fuseau
      - timezone
    module: ExchangeOnlineManagement
    perms: Rôle Exchange Administrator ou rôle de gestion adapté
    pitfall: Sans -LocalizeDefaultFolderName, les dossiers (Inbox, Sent Items) gardent leur nom anglais.
    doc: exchange/set-mailboxregionalconfiguration
  - name: Get-DistributionGroup
    cat: exchange
    syn: Get-DistributionGroup [-Identity <groupe>] [-ResultSize Unlimited]
    desc: Liste les groupes de distribution (listes de diffusion) et leurs propriétaires.
    ex:
      - Get-DistributionGroup -ResultSize Unlimited | Select-Object DisplayName,PrimarySmtpAddress,ManagedBy,RequireSenderAuthenticationEnabled
      - Get-DistributionGroup -Identity equipe-compta@contoso.com | Format-List
    tags:
      - liste de diffusion
      - groupe
    module: ExchangeOnlineManagement
    perms: Rôle Exchange « View-Only Recipients » ou Exchange Administrator
    pitfall: Les groupes Microsoft 365 s'obtiennent avec Get-UnifiedGroup, pas Get-DistributionGroup.
    doc: exchange/get-distributiongroup
  - name: New-DistributionGroup
    cat: exchange
    syn: New-DistributionGroup -Name <nom> -PrimarySmtpAddress <adresse> [-Members <liste>]
    desc: Crée un groupe de distribution (liste de diffusion).
    ex:
      - New-DistributionGroup -Name "Equipe Compta" -PrimarySmtpAddress equipe-compta@contoso.com -Members alice.martin@contoso.com,bob.durand@contoso.com
    tags:
      - liste de diffusion
      - groupe
      - créer
    module: ExchangeOnlineManagement
    perms: Rôle Exchange Administrator ou rôle de gestion adapté
    pitfall: "Par défaut, seuls les expéditeurs internes peuvent écrire au groupe : -RequireSenderAuthenticationEnabled $false pour l'ouvrir."
    doc: exchange/new-distributiongroup
  - name: Remove-DistributionGroupMember
    cat: exchange
    syn: Remove-DistributionGroupMember -Identity <groupe> -Member <utilisateur>
    desc: Retire un membre d'un groupe de distribution.
    ex:
      - Remove-DistributionGroupMember -Identity equipe-compta@contoso.com -Member ancien.salarie@contoso.com -Confirm:$false
    tags:
      - liste de diffusion
      - membre
    module: ExchangeOnlineManagement
    perms: Rôle Exchange Administrator ou rôle de gestion adapté
    pitfall: Un groupe synchronisé depuis AD sur site se modifie côté AD.
    doc: exchange/remove-distributiongroupmember
  - name: Get-UnifiedGroup
    cat: exchange
    syn: Get-UnifiedGroup [-Identity <groupe>] [-ResultSize Unlimited]
    desc: Liste les groupes Microsoft 365 (équipes Teams, groupes Outlook, sites).
    ex:
      - Get-UnifiedGroup -ResultSize Unlimited | Select-Object DisplayName,PrimarySmtpAddress,AccessType,ManagedBy
      - Get-UnifiedGroupLinks -Identity equipe-projet@contoso.com -LinkType Members
    tags:
      - groupe m365
      - teams
    module: ExchangeOnlineManagement
    perms: Rôle Exchange « View-Only Recipients » ou Exchange Administrator
    pitfall: Les membres se lisent avec Get-UnifiedGroupLinks -LinkType Members.
    doc: exchange/get-unifiedgroup
  - name: Add-UnifiedGroupLinks
    cat: exchange
    syn: Add-UnifiedGroupLinks -Identity <groupe> -LinkType Members -Links <utilisateurs>
    desc: Ajoute des membres ou des propriétaires à un groupe Microsoft 365.
    ex:
      - Add-UnifiedGroupLinks -Identity equipe-projet@contoso.com -LinkType Members -Links alice.martin@contoso.com,bob.durand@contoso.com
      - Add-UnifiedGroupLinks -Identity equipe-projet@contoso.com -LinkType Owners -Links alice.martin@contoso.com
    tags:
      - groupe m365
      - membre
    module: ExchangeOnlineManagement
    perms: Rôle Exchange Administrator ou rôle de gestion adapté
    pitfall: Un propriétaire doit d'abord être membre du groupe.
    doc: exchange/add-unifiedgrouplinks
  - name: New-MailContact
    cat: exchange
    syn: New-MailContact -Name <nom> -ExternalEmailAddress <adresse>
    desc: Crée un contact de messagerie externe (visible dans l'annuaire, utilisable dans des groupes).
    ex:
      - New-MailContact -Name "Cabinet comptable" -ExternalEmailAddress contact@cabinet.example.net
    tags:
      - contact
      - externe
    module: ExchangeOnlineManagement
    perms: Rôle Exchange Administrator ou rôle de gestion adapté
    pitfall: "Un contact n'a pas de boîte : il ne reçoit que des messages redirigés vers son adresse externe."
    doc: exchange/new-mailcontact
  - name: Undo-SoftDeletedMailbox
    cat: exchange
    syn: Undo-SoftDeletedMailbox -SoftDeletedObject <boîte> -WindowsLiveID <upn> -Password <mdp>
    desc: Restaure une boîte supprimée il y a moins de 30 jours (compte supprimé dans Entra ID).
    ex:
      - Get-Mailbox -SoftDeletedMailbox | Select-Object DisplayName,PrimarySmtpAddress,WhenSoftDeleted
      - $pwd = Read-Host -AsSecureString; Undo-SoftDeletedMailbox -SoftDeletedObject user@contoso.com -WindowsLiveID user@contoso.com -Password $pwd
    tags:
      - restaurer
      - supprimée
      - récupérer
    module: ExchangeOnlineManagement
    perms: Rôle Exchange Administrator ou rôle de gestion adapté
    pitfall: "Plus simple : restaurer l'utilisateur dans Entra ID (corbeille, 30 jours) : la boîte revient avec lui."
    doc: exchange/undo-softdeletedmailbox
  - name: Get-MobileDevice
    cat: exchange
    syn: Get-MobileDevice [-Mailbox <boîte>]
    desc: Liste les appareils mobiles synchronisés (ActiveSync) avec une boîte.
    ex:
      - Get-MobileDevice -Mailbox user@contoso.com | Select-Object DeviceModel,DeviceOS,FirstSyncTime,DeviceAccessState
      - Get-MobileDevice -ResultSize Unlimited | Select-Object UserDisplayName,DeviceModel,DeviceOS
    tags:
      - mobile
      - activesync
      - appareil
    module: ExchangeOnlineManagement
    perms: Rôle Exchange « View-Only Recipients » ou Exchange Administrator
    pitfall: "Pour l'effacement à distance : Clear-MobileDevice (ou Intune pour les appareils inscrits)."
    doc: exchange/get-mobiledevice
  - name: Remove-MobileDevice
    cat: exchange
    syn: Remove-MobileDevice -Identity <appareil>
    desc: Supprime la relation de synchronisation d'un appareil mobile (perte, remplacement).
    ex:
      - Get-MobileDevice -Mailbox user@contoso.com | Remove-MobileDevice -Confirm:$false
    tags:
      - mobile
      - activesync
    module: ExchangeOnlineManagement
    perms: Rôle Exchange Administrator ou rôle de gestion adapté
    pitfall: L'appareil se resynchronisera s'il se reconnecte avec les bons identifiants.
    doc: exchange/remove-mobiledevice
  - name: Get-AcceptedDomain
    cat: exchange
    syn: Get-AcceptedDomain
    desc: Liste les domaines acceptés du tenant (domaines de messagerie).
    ex:
      - Get-AcceptedDomain | Select-Object DomainName,DomainType,Default
    tags:
      - domaine
    module: ExchangeOnlineManagement
    perms: Rôle Exchange « View-Only Recipients » ou Exchange Administrator
    pitfall: DomainType InternalRelay indique un domaine partagé avec un autre système de messagerie (migration en cours).
    doc: exchange/get-accepteddomain
  - name: Get-DkimSigningConfig
    cat: exchange
    syn: Get-DkimSigningConfig -Identity <domaine>
    desc: Affiche l'état de la signature DKIM d'un domaine et les enregistrements CNAME à publier.
    ex:
      - Get-DkimSigningConfig -Identity contoso.com | Format-List Domain,Enabled,Selector1CNAME,Selector2CNAME
      - Set-DkimSigningConfig -Identity contoso.com -Enabled $true
    tags:
      - dkim
      - spf
      - dmarc
      - délivrabilité
    module: ExchangeOnlineManagement
    perms: Rôle Exchange Administrator ou rôle de gestion adapté
    pitfall: Publiez d'abord les deux CNAME (selector1 et selector2) dans le DNS ; l'activation échoue sinon.
    doc: exchange/get-dkimsigningconfig
  - name: New-DkimSigningConfig
    cat: exchange
    syn: New-DkimSigningConfig -DomainName <domaine> -Enabled $true
    desc: Crée la configuration DKIM d'un domaine personnalisé.
    ex:
      - New-DkimSigningConfig -DomainName contoso.com -KeySize 2048 -Enabled $false
      - Get-DkimSigningConfig -Identity contoso.com | Format-List Selector1CNAME,Selector2CNAME
    tags:
      - dkim
    module: ExchangeOnlineManagement
    perms: Rôle Exchange Administrator ou rôle de gestion adapté
    pitfall: Créez-la désactivée, publiez les CNAME, puis activez avec Set-DkimSigningConfig -Enabled $true.
    doc: exchange/new-dkimsigningconfig
  - name: Get-HostedOutboundSpamFilterPolicy
    cat: exchange
    syn: Get-HostedOutboundSpamFilterPolicy
    desc: Vérifie la politique anti-spam sortante, notamment le transfert automatique vers l'extérieur.
    ex:
      - Get-HostedOutboundSpamFilterPolicy | Format-List Name,AutoForwardingMode,RecipientLimitPerHour
      - Set-HostedOutboundSpamFilterPolicy -Identity Default -AutoForwardingMode Off
    tags:
      - transfert
      - forwarding
      - spam
      - sécurité
    module: ExchangeOnlineManagement
    perms: Rôle Exchange Administrator ou rôle de gestion adapté
    pitfall: "AutoForwardingMode Automatic (le défaut) bloque le transfert externe : c'est la cause n°1 d'un transfert « qui ne marche pas »."
    doc: exchange/get-hostedoutboundspamfilterpolicy
  - name: Get-TransportRule
    cat: exchange
    syn: Get-TransportRule
    desc: Liste les règles de flux de messagerie (bandeaux, redirections, blocages).
    ex:
      - Get-TransportRule | Select-Object Name,State,Priority,Mode
      - Get-TransportRule -Identity "Avertissement externe" | Format-List
    tags:
      - règle de flux
      - bandeau
    module: ExchangeOnlineManagement
    perms: Rôle Exchange « View-Only Recipients » ou Exchange Administrator
    pitfall: "L'ordre (Priority) compte : une règle « arrêter le traitement » peut empêcher les suivantes."
    doc: exchange/get-transportrule
  - name: Get-InboundConnector
    cat: exchange
    syn: Get-InboundConnector | Get-OutboundConnector
    desc: Liste les connecteurs de messagerie entrants et sortants (relais, partenaires, serveur sur site).
    ex:
      - Get-InboundConnector | Format-List Name,Enabled,SenderDomains,ConnectorType
      - Get-OutboundConnector | Format-List Name,Enabled,RecipientDomains,SmartHosts
    tags:
      - connecteur
      - relais
      - smtp
    module: ExchangeOnlineManagement
    perms: Rôle Exchange « View-Only Recipients » ou Exchange Administrator
    pitfall: Un connecteur mal limité (SenderIPAddresses) peut ouvrir un relais ; vérifiez les adresses autorisées.
    doc: exchange/get-inboundconnector
  - name: Get-MessageTraceDetailV2
    cat: exchange
    syn: Get-MessageTraceDetailV2 -MessageTraceId <id> -RecipientAddress <adresse>
    desc: Détail du parcours d'un message (étape par étape) trouvé avec Get-MessageTraceV2.
    ex:
      - $t = Get-MessageTraceV2 -SenderAddress expediteur@example.net -StartDate (Get-Date).AddDays(-2) -EndDate (Get-Date); Get-MessageTraceDetailV2 -MessageTraceId $t[0].MessageTraceId -RecipientAddress user@contoso.com
    tags:
      - traçage
      - message
      - délivrabilité
    module: ExchangeOnlineManagement
    perms: Rôle Exchange « View-Only Recipients » ou Exchange Administrator
    pitfall: Limité aux 10 derniers jours ; au-delà, Start-HistoricalSearch.
    doc: exchange/get-messagetracedetailv2
  - name: Release-QuarantineMessage
    cat: security
    syn: Release-QuarantineMessage -Identity <id> -ReleaseToAll
    desc: Libère un message de la quarantaine (faux positif).
    ex:
      - Get-QuarantineMessage -RecipientAddress user@contoso.com -StartReceivedDate (Get-Date).AddDays(-3) | Release-QuarantineMessage -ReleaseToAll
    tags:
      - quarantaine
      - faux positif
    module: ExchangeOnlineManagement
    perms: Rôle Security Administrator ou Quarantine Administrator
    pitfall: Un message de hameçonnage à fort niveau de confiance ne peut être libéré que par un administrateur.
    doc: exchange/release-quarantinemessage
  - name: Get-AntiPhishPolicy
    cat: security
    syn: Get-AntiPhishPolicy
    desc: Affiche les politiques anti-hameçonnage (usurpation, personnes protégées).
    ex:
      - Get-AntiPhishPolicy | Select-Object Name,Enabled,EnableMailboxIntelligence,EnableSpoofIntelligence,PhishThresholdLevel
    tags:
      - hameçonnage
      - phishing
      - defender
    module: ExchangeOnlineManagement
    perms: Rôle Security Reader ou supérieur
    pitfall: "La politique par défaut s'applique à tout le monde : créez-en une dédiée pour les dirigeants."
    doc: exchange/get-antiphishpolicy
  - name: Get-SafeAttachmentPolicy
    cat: security
    syn: Get-SafeAttachmentPolicy
    desc: Affiche les politiques « Pièces jointes fiables » de Defender for Office 365.
    ex:
      - Get-SafeAttachmentPolicy | Select-Object Name,Enable,Action,Redirect
    tags:
      - pièces jointes
      - defender
    module: ExchangeOnlineManagement
    perms: Rôle Security Reader ou supérieur
    pitfall: Disponible seulement avec une licence Defender for Office 365 (Plan 1 ou 2).
    doc: exchange/get-safeattachmentpolicy
  - name: Remove-MgUser
    cat: graph
    syn: Remove-MgUser -UserId <id>
    desc: Supprime un utilisateur Entra ID (conservé 30 jours dans la corbeille).
    ex:
      - Remove-MgUser -UserId ancien.salarie@contoso.com
      - Get-MgDirectoryDeletedItemAsUser | Select-Object Id,DisplayName,DeletedDateTime
    tags:
      - supprimer
      - départ
    module: Microsoft.Graph.Users
    perms: User.ReadWrite.All ; rôle User Administrator
    pitfall: "La boîte aux lettres et OneDrive suivent le compte : transférez ce qui doit l'être avant."
    doc: microsoft.graph.users/remove-mguser
  - name: Update-MgUser -AccountEnabled
    cat: graph
    syn: Update-MgUser -UserId <id> -AccountEnabled:$false
    desc: Bloque (ou réactive) la connexion d'un utilisateur sans supprimer son compte.
    ex:
      - Update-MgUser -UserId ancien.salarie@contoso.com -AccountEnabled:$false
      - Revoke-MgUserSignInSession -UserId ancien.salarie@contoso.com
    tags:
      - bloquer
      - départ
      - sécurité
    module: Microsoft.Graph.Users
    perms: User.ReadWrite.All
    pitfall: 'Les sessions ouvertes restent valides un moment : révoquez-les aussi avec Revoke-MgUserSignInSession.'
    doc: microsoft.graph.users/update-mguser
  - name: Get-MgUserMemberOf
    cat: graph
    syn: Get-MgUserMemberOf -UserId <id>
    desc: Liste les groupes et rôles d'annuaire dont un utilisateur est membre.
    ex:
      - Get-MgUserMemberOf -UserId user@contoso.com -All | ForEach-Object { $_.AdditionalProperties.displayName }
    tags:
      - groupe
      - appartenance
    module: Microsoft.Graph.Users
    perms: GroupMember.Read.All ou Directory.Read.All
    pitfall: Le nom se trouve dans AdditionalProperties.displayName, pas dans une propriété directe.
    doc: microsoft.graph.users/get-mgusermemberof
  - name: Get-MgUserLicenseDetail
    cat: graph
    syn: Get-MgUserLicenseDetail -UserId <id>
    desc: Liste les licences et plans de service attribués à un utilisateur.
    ex:
      - Get-MgUserLicenseDetail -UserId user@contoso.com | Select-Object SkuPartNumber
      - Get-MgUserLicenseDetail -UserId user@contoso.com | Select-Object -ExpandProperty ServicePlans | Where-Object ProvisioningStatus -eq "Disabled"
    tags:
      - licence
    module: Microsoft.Graph.Users
    perms: User.Read.All
    pitfall: SkuPartNumber (ex. SPE_E3) n'est pas le nom commercial ; croisez avec Get-MgSubscribedSku.
    doc: microsoft.graph.users/get-mguserlicensedetail
  - name: Get-MgUserManager
    cat: graph
    syn: Get-MgUserManager -UserId <id>
    desc: Affiche le responsable hiérarchique d'un utilisateur.
    ex:
      - Get-MgUserManager -UserId user@contoso.com | Select-Object -ExpandProperty AdditionalProperties
      - Set-MgUserManagerByRef -UserId user@contoso.com -BodyParameter @{ "@odata.id" = "https://graph.microsoft.com/v1.0/users/chef@contoso.com" }
    tags:
      - manager
      - hiérarchie
    module: Microsoft.Graph.Users
    perms: User.Read.All
    pitfall: "Renvoie une erreur 404 si aucun manager n'est défini : ce n'est pas une panne."
    doc: microsoft.graph.users/get-mgusermanager
  - name: Get-MgGroupMember
    cat: graph
    syn: Get-MgGroupMember -GroupId <id> [-All]
    desc: Liste les membres d'un groupe Entra ID / Microsoft 365.
    ex:
      - Get-MgGroupMember -GroupId (Get-MgGroup -Filter "displayName eq 'Equipe Compta'").Id -All | ForEach-Object { $_.AdditionalProperties.userPrincipalName }
    tags:
      - groupe
      - membre
    module: Microsoft.Graph.Groups
    perms: GroupMember.Read.All
    pitfall: Sans -All, seuls 100 membres sont renvoyés.
    doc: microsoft.graph.groups/get-mggroupmember
  - name: New-MgGroup
    cat: graph
    syn: New-MgGroup -DisplayName <nom> -MailNickname <alias> -MailEnabled:$false -SecurityEnabled:$true
    desc: Crée un groupe de sécurité (ou un groupe Microsoft 365 avec GroupTypes).
    ex:
      - New-MgGroup -DisplayName "Acces Compta" -MailNickname acces-compta -MailEnabled:$false -SecurityEnabled:$true
      - New-MgGroup -DisplayName "Equipe Projet" -MailNickname equipe-projet -MailEnabled:$true -SecurityEnabled:$false -GroupTypes "Unified"
    tags:
      - groupe
      - créer
    module: Microsoft.Graph.Groups
    perms: Group.ReadWrite.All
    pitfall: MailNickname est obligatoire, même pour un groupe de sécurité sans messagerie.
    doc: microsoft.graph.groups/new-mggroup
  - name: Remove-MgGroupMemberByRef
    cat: graph
    syn: Remove-MgGroupMemberByRef -GroupId <id> -DirectoryObjectId <idUtilisateur>
    desc: Retire un membre d'un groupe Entra ID.
    ex:
      - Remove-MgGroupMemberByRef -GroupId $groupId -DirectoryObjectId (Get-MgUser -UserId ancien.salarie@contoso.com).Id
    tags:
      - groupe
      - membre
    module: Microsoft.Graph.Groups
    perms: GroupMember.ReadWrite.All
    pitfall: Il faut l'identifiant (GUID) de l'utilisateur, pas son adresse.
    doc: microsoft.graph.groups/remove-mggroupmemberbyref
  - name: Get-MgReportAuthenticationMethodUserRegistrationDetail
    cat: graph
    syn: Get-MgReportAuthenticationMethodUserRegistrationDetail [-All]
    desc: État d'enregistrement MFA de chaque utilisateur (qui n'a pas de méthode d'authentification forte).
    ex:
      - Get-MgReportAuthenticationMethodUserRegistrationDetail -All | Where-Object { -not $_.IsMfaRegistered } | Select-Object UserPrincipalName,UserDisplayName
      - Get-MgReportAuthenticationMethodUserRegistrationDetail -All | Select-Object UserPrincipalName,IsMfaRegistered,MethodsRegistered
    tags:
      - mfa
      - authentification
      - sécurité
    module: Microsoft.Graph.Reports
    perms: AuditLog.Read.All ; rôle Reports Reader ou Security Reader
    pitfall: Nécessite Entra ID P1/P2 pour certains champs de rapport.
    doc: microsoft.graph.reports/get-mgreportauthenticationmethoduserregistrationdetail
  - name: Get-MgAuditLogDirectoryAudit
    cat: graph
    syn: Get-MgAuditLogDirectoryAudit [-Filter <odata>] [-Top <n>]
    desc: "Journal d'audit de l'annuaire : qui a créé, modifié ou supprimé quoi."
    ex:
      - Get-MgAuditLogDirectoryAudit -Filter "activityDisplayName eq 'Add member to role'" -Top 20 | Select-Object ActivityDateTime,ActivityDisplayName,Result
      - Get-MgAuditLogDirectoryAudit -Top 50 | Select-Object ActivityDateTime,ActivityDisplayName,@{n="By";e={$_.InitiatedBy.User.UserPrincipalName}}
    tags:
      - audit
      - journal
    module: Microsoft.Graph.Reports
    perms: AuditLog.Read.All ; rôle Reports Reader
    pitfall: 'Conservé 30 jours (7 en Entra ID gratuit) : exportez ce qui doit durer.'
    doc: microsoft.graph.reports/get-mgauditlogdirectoryaudit
  - name: Get-MgDomain
    cat: graph
    syn: Get-MgDomain
    desc: Liste les domaines du tenant (vérifiés, par défaut) et leur état.
    ex:
      - Get-MgDomain | Select-Object Id,IsDefault,IsVerified,AuthenticationType
      - Get-MgDomainVerificationDnsRecord -DomainId contoso.com
    tags:
      - domaine
      - dns
    module: Microsoft.Graph.Identity.DirectoryManagement
    perms: Domain.Read.All
    pitfall: Get-MgDomainVerificationDnsRecord donne l'enregistrement TXT à publier pour vérifier un domaine.
    doc: microsoft.graph.identity.directorymanagement/get-mgdomain
  - name: Get-MgOrganization
    cat: graph
    syn: Get-MgOrganization
    desc: Informations du tenant (nom, identifiant, contacts techniques, synchronisation).
    ex:
      - Get-MgOrganization | Select-Object DisplayName,Id,OnPremisesSyncEnabled,TechnicalNotificationMails
    tags:
      - tenant
    module: Microsoft.Graph.Identity.DirectoryManagement
    perms: Organization.Read.All
    pitfall: "OnPremisesSyncEnabled True : les comptes se gèrent surtout dans l'AD sur site."
    doc: microsoft.graph.identity.directorymanagement/get-mgorganization
  - name: Get-MgDevice
    cat: graph
    syn: Get-MgDevice [-All]
    desc: Liste les appareils enregistrés dans Entra ID (joints, hybrides, inscrits).
    ex:
      - Get-MgDevice -All | Select-Object DisplayName,OperatingSystem,OperatingSystemVersion,TrustType,ApproximateLastSignInDateTime
    tags:
      - appareil
      - inventaire
    module: Microsoft.Graph.Identity.DirectoryManagement
    perms: Device.Read.All
    pitfall: "Des appareils inactifs s'accumulent : filtrez sur ApproximateLastSignInDateTime pour les nettoyer."
    doc: microsoft.graph.identity.directorymanagement/get-mgdevice
  - name: Get-MgDirectoryRoleMember
    cat: graph
    syn: Get-MgDirectoryRoleMember -DirectoryRoleId <id>
    desc: Liste les membres d'un rôle d'administration (qui est administrateur général, etc.).
    ex:
      - $r = Get-MgDirectoryRole -Filter "displayName eq 'Global Administrator'"; Get-MgDirectoryRoleMember -DirectoryRoleId $r.Id | ForEach-Object { $_.AdditionalProperties.userPrincipalName }
    tags:
      - admin
      - rôle
      - sécurité
    module: Microsoft.Graph.Identity.DirectoryManagement
    perms: RoleManagement.Read.Directory
    pitfall: "Un rôle activé n'apparaît que s'il a déjà été utilisé : sinon Get-MgDirectoryRole ne le renvoie pas."
    doc: microsoft.graph.identity.directorymanagement/get-mgdirectoryrolemember
  - name: Get-MgApplication
    cat: graph
    syn: Get-MgApplication [-All]
    desc: Liste les inscriptions d'applications (et leurs secrets qui expirent).
    ex:
      - Get-MgApplication -All | Select-Object DisplayName,AppId,@{n="Expire";e={($_.PasswordCredentials.EndDateTime | Sort-Object | Select-Object -First 1)}}
    tags:
      - application
      - secret
      - expiration
    module: Microsoft.Graph.Applications
    perms: Application.Read.All
    pitfall: "Un secret expiré casse l'application sans prévenir : surveillez EndDateTime."
    doc: microsoft.graph.applications/get-mgapplication
  - name: Get-TeamUser
    cat: teams
    syn: Get-TeamUser -GroupId <id>
    desc: Liste les membres et propriétaires d'une équipe Teams.
    ex:
      - Get-TeamUser -GroupId (Get-Team -DisplayName "Equipe Projet").GroupId | Select-Object User,Name,Role
    tags:
      - teams
      - membre
    module: MicrosoftTeams
    perms: Rôle Teams Administrator
    pitfall: Une équipe est identifiée par son GroupId (GUID), pas par son nom.
    doc: teams/get-teamuser
  - name: Remove-TeamUser
    cat: teams
    syn: Remove-TeamUser -GroupId <id> -User <utilisateur>
    desc: Retire un membre d'une équipe Teams.
    ex:
      - Remove-TeamUser -GroupId $groupId -User ancien.salarie@contoso.com
    tags:
      - teams
      - membre
    module: MicrosoftTeams
    perms: Rôle Teams Administrator
    pitfall: Un propriétaire doit être rétrogradé (-Role Owner) avant d'être retiré s'il est le dernier.
    doc: teams/remove-teamuser
  - name: Get-TeamChannel
    cat: teams
    syn: Get-TeamChannel -GroupId <id>
    desc: Liste les canaux d'une équipe (standard, privés, partagés).
    ex:
      - Get-TeamChannel -GroupId $groupId | Select-Object DisplayName,MembershipType
    tags:
      - teams
      - canal
    module: MicrosoftTeams
    perms: Rôle Teams Administrator
    pitfall: 'Les canaux privés ont leur propre liste de membres : Get-TeamChannelUser.'
    doc: teams/get-teamchannel
  - name: Set-Team
    cat: teams
    syn: Set-Team -GroupId <id> [-DisplayName] [-Visibility] [-AllowGuestCreateUpdateChannels]
    desc: Modifie les réglages d'une équipe (nom, visibilité, droits des membres et invités).
    ex:
      - Set-Team -GroupId $groupId -DisplayName "Equipe Projet 2026" -Visibility Private
    tags:
      - teams
      - réglages
    module: MicrosoftTeams
    perms: Rôle Teams Administrator
    pitfall: "Le nom de l'équipe est celui du groupe Microsoft 365 : la propagation peut prendre du temps."
    doc: teams/set-team
  - name: New-SPOSite
    cat: sharepoint
    syn: New-SPOSite -Url <url> -Owner <propriétaire> -StorageQuota <Mo> -Title <titre> -Template <modèle>
    desc: Crée un site SharePoint.
    ex:
      - New-SPOSite -Url https://contoso.sharepoint.com/sites/projets -Owner admin@contoso.com -StorageQuota 1024 -Title "Projets" -Template "STS#3"
    tags:
      - site
      - créer
    module: Microsoft.Online.SharePoint.PowerShell
    perms: Rôle SharePoint Administrator
    pitfall: STS#3 crée un site d'équipe sans groupe Microsoft 365 ; pour un site avec groupe, utilisez l'interface ou PnP.
    doc: sharepoint-online/new-sposite
  - name: Remove-SPOSite
    cat: sharepoint
    syn: Remove-SPOSite -Identity <url>
    desc: Met un site SharePoint à la corbeille de la collection de sites (restaurable 93 jours).
    ex:
      - Remove-SPOSite -Identity https://contoso.sharepoint.com/sites/ancien -Confirm:$false
      - Get-SPODeletedSite | Select-Object Url,DeletionTime
    tags:
      - site
      - supprimer
    module: Microsoft.Online.SharePoint.PowerShell
    perms: Rôle SharePoint Administrator
    pitfall: "Remove-SPODeletedSite supprime définitivement : à ne lancer qu'en connaissance de cause."
    doc: sharepoint-online/remove-sposite
  - name: Get-SPOExternalUser
    cat: sharepoint
    syn: Get-SPOExternalUser [-PageSize <n>]
    desc: Liste les utilisateurs externes (invités) du tenant SharePoint.
    ex:
      - Get-SPOExternalUser -PageSize 50 | Select-Object DisplayName,Email,InvitedBy,WhenCreated
    tags:
      - externe
      - invité
      - partage
    module: Microsoft.Online.SharePoint.PowerShell
    perms: Rôle SharePoint Administrator
    pitfall: Boucle sur -Position pour tout lister (50 par page au maximum).
    doc: sharepoint-online/get-spoexternaluser
  - name: Invoke-MgWipeDeviceManagementManagedDevice
    cat: intune
    syn: Invoke-MgWipeDeviceManagementManagedDevice -ManagedDeviceId <id>
    desc: Réinitialise à distance un appareil géré par Intune (perte, vol, recyclage).
    ex:
      - Invoke-MgWipeDeviceManagementManagedDevice -ManagedDeviceId $deviceId -KeepEnrollmentData:$false -KeepUserData:$false
    tags:
      - effacer
      - perte
      - vol
    module: Microsoft.Graph.DeviceManagement.Actions
    perms: DeviceManagementManagedDevices.PrivilegedOperations.All ; rôle Intune Administrator
    pitfall: Irréversible. Sur un appareil personnel, préférez « Retirer » (Invoke-MgRetire…) qui ne touche que les données de l'entreprise.
    doc: microsoft.graph.devicemanagement.actions/invoke-mgwipedevicemanagementmanageddevice
  - name: Get-MgDeviceManagementDeviceCompliancePolicy
    cat: intune
    syn: Get-MgDeviceManagementDeviceCompliancePolicy
    desc: Liste les stratégies de conformité Intune.
    ex:
      - Get-MgDeviceManagementDeviceCompliancePolicy | Select-Object DisplayName,CreatedDateTime,LastModifiedDateTime
    tags:
      - conformité
      - intune
    module: Microsoft.Graph.DeviceManagement
    perms: DeviceManagementConfiguration.Read.All
    pitfall: Un appareil sans stratégie de conformité affectée est considéré comme conforme par défaut (réglage du tenant).
    doc: microsoft.graph.devicemanagement/get-mgdevicemanagementdevicecompliancepolicy
  - name: 'Script : exporter toutes les boîtes Exchange Online (nom, prénom, adresse, taille, alias, transferts)'
    cat: scripts
    syn: .\Export-BoitesExchange.ps1
    desc: "Exporte en CSV chaque boîte : prénom, nom, adresse principale, type, taille et nombre d'éléments, quotas, alias, transferts (boîte et règles), archive, dernière connexion."
    ex:
      - |-
        # Prérequis : Install-Module ExchangeOnlineManagement -Scope CurrentUser
        Connect-ExchangeOnline -ShowBanner:$false

        $IncludeInboxRules = $true   # $false pour aller plus vite (les règles se lisent boîte par boîte)

        function ConvertTo-Mb($size) {
            if (-not $size) { return $null }
            $m = [regex]::Match("$size", '\(([\d\s,.\u00A0\u202F]+) bytes\)')
            if ($m.Success) { [math]::Round([decimal]($m.Groups[1].Value -replace '[^\d]', '') / 1MB, 1) }
        }

        # Prénom, nom, service et fonction viennent de Get-User (absents de Get-Mailbox)
        $users = @{}
        Get-User -ResultSize Unlimited | ForEach-Object { $users[$_.UserPrincipalName] = $_ }

        $props = 'DisplayName','PrimarySmtpAddress','UserPrincipalName','EmailAddresses','RecipientTypeDetails',
                 'ForwardingAddress','ForwardingSmtpAddress','DeliverToMailboxAndForward','GrantSendOnBehalfTo',
                 'ProhibitSendQuota','ProhibitSendReceiveQuota','IssueWarningQuota','ArchiveStatus',
                 'LitigationHoldEnabled','HiddenFromAddressListsEnabled','WhenCreated'
        $mailboxes = Get-EXOMailbox -ResultSize Unlimited -Properties $props
        $i = 0
        $rows = foreach ($mb in $mailboxes) {
            $i++; Write-Progress -Activity 'Export des boîtes' -Status $mb.PrimarySmtpAddress -PercentComplete ($i / $mailboxes.Count * 100)
            $u     = $users[$mb.UserPrincipalName]
            $stats = Get-EXOMailboxStatistics -Identity $mb.UserPrincipalName -ErrorAction SilentlyContinue
            $rules = if ($IncludeInboxRules) {
                Get-InboxRule -Mailbox $mb.UserPrincipalName -ErrorAction SilentlyContinue |
                    Where-Object { $_.ForwardTo -or $_.ForwardAsAttachmentTo -or $_.RedirectTo }
            }
            [pscustomobject]@{
                Prenom             = $u.FirstName
                Nom                = $u.LastName
                NomAffiche         = $mb.DisplayName
                Service            = $u.Department
                Fonction           = $u.Title
                AdressePrincipale  = $mb.PrimarySmtpAddress
                UPN                = $mb.UserPrincipalName
                Type               = $mb.RecipientTypeDetails
                TailleMo           = ConvertTo-Mb $stats.TotalItemSize
                NbElements         = $stats.ItemCount
                DerniereConnexion  = $stats.LastLogonTime
                QuotaAlerte        = "$($mb.IssueWarningQuota)"
                QuotaEnvoiInterdit = "$($mb.ProhibitSendQuota)"
                QuotaTotal         = "$($mb.ProhibitSendReceiveQuota)"
                Alias              = ($mb.EmailAddresses | Where-Object { $_ -clike 'smtp:*' } | ForEach-Object { $_.Substring(5) }) -join ';'
                TransfertBoite     = (@($mb.ForwardingAddress, $mb.ForwardingSmtpAddress) | Where-Object { $_ }) -join ';'
                GarderUneCopie     = $mb.DeliverToMailboxAndForward
                TransfertRegles    = ($rules | ForEach-Object { "$($_.Name) -> " + (@($_.ForwardTo + $_.ForwardAsAttachmentTo + $_.RedirectTo) -join ',') }) -join ' | '
                EnvoyerDeLaPartDe  = ($mb.GrantSendOnBehalfTo -join ';')
                Archive            = $mb.ArchiveStatus
                ConservationLitige = $mb.LitigationHoldEnabled
                MasqueeAnnuaire    = $mb.HiddenFromAddressListsEnabled
                Creee              = $mb.WhenCreated
            }
        }
        $rows | Sort-Object Nom, Prenom | Export-Csv .\export-boites-exchange.csv -NoTypeInformation -Encoding UTF8 -Delimiter ';'
        Write-Host "$($rows.Count) boîtes exportées dans export-boites-exchange.csv"
    tags:
      - export
      - csv
      - taille
      - alias
      - transfert
      - boîtes
      - inventaire
      - utilisateurs
    module: ExchangeOnlineManagement
    perms: Rôle Exchange « View-Only Recipients » ou Exchange Administrator
    pitfall: "Lent sur un grand tenant (une requête de statistiques par boîte) : lancez-le hors heures de pointe. Le CSV s'ouvre dans Excel avec le séparateur « ; »."
    url: https://learn.microsoft.com/powershell/module/exchange/get-exomailbox
  - name: 'Script : exporter la taille des boîtes, des plus grosses aux plus petites'
    cat: scripts
    syn: .\Export-TailleBoites.ps1
    desc: Classe les boîtes par taille (Go), avec le quota et le pourcentage utilisé, pour repérer celles qui vont saturer.
    ex:
      - |-
        Connect-ExchangeOnline -ShowBanner:$false
        function ConvertTo-Bytes($s) {
            $m = [regex]::Match("$s", '\(([\d\s,.\u00A0\u202F]+) bytes\)')
            if ($m.Success) { [decimal]($m.Groups[1].Value -replace '[^\d]', '') } else { 0 }
        }
        Get-EXOMailbox -ResultSize Unlimited -Properties ProhibitSendReceiveQuota | ForEach-Object {
            $s     = Get-EXOMailboxStatistics -Identity $_.UserPrincipalName
            $used  = ConvertTo-Bytes $s.TotalItemSize
            $quota = ConvertTo-Bytes $_.ProhibitSendReceiveQuota
            [pscustomobject]@{
                Adresse  = $_.PrimarySmtpAddress
                TailleGo = [math]::Round($used / 1GB, 2)
                QuotaGo  = [math]::Round($quota / 1GB, 0)
                Utilise  = if ($quota) { [math]::Round($used / $quota * 100, 1) } else { $null }
                Elements = $s.ItemCount
            }
        } | Sort-Object TailleGo -Descending | Export-Csv .\taille-boites.csv -NoTypeInformation -Encoding UTF8 -Delimiter ';'
    tags:
      - taille
      - quota
      - export
      - boîtes pleines
    module: ExchangeOnlineManagement
    perms: Rôle Exchange « View-Only Recipients » ou Exchange Administrator
    pitfall: 'Le quota vient de ProhibitSendReceiveQuota : pour une boîte avec archive, ajoutez Get-EXOMailboxStatistics -Archive.'
    url: https://learn.microsoft.com/powershell/module/exchange/get-exomailboxstatistics
  - name: 'Script : lister tous les transferts de messagerie (boîtes et règles)'
    cat: scripts
    syn: .\Export-Transferts.ps1
    desc: "Audit des redirections : transferts configurés sur la boîte et règles de boîte de réception qui redirigent vers l'extérieur."
    ex:
      - |-
        Connect-ExchangeOnline -ShowBanner:$false
        $domaines = (Get-AcceptedDomain).DomainName
        $mailboxes = Get-EXOMailbox -ResultSize Unlimited -Properties ForwardingAddress,ForwardingSmtpAddress,DeliverToMailboxAndForward
        $res = foreach ($mb in $mailboxes) {
            if ($mb.ForwardingAddress -or $mb.ForwardingSmtpAddress) {
                [pscustomobject]@{ Boite = $mb.PrimarySmtpAddress; Origine = 'Boîte'; Vers = (@($mb.ForwardingAddress, $mb.ForwardingSmtpAddress) | Where-Object { $_ }) -join ';'; Copie = $mb.DeliverToMailboxAndForward }
            }
            Get-InboxRule -Mailbox $mb.UserPrincipalName -ErrorAction SilentlyContinue |
                Where-Object { $_.ForwardTo -or $_.ForwardAsAttachmentTo -or $_.RedirectTo } | ForEach-Object {
                    [pscustomobject]@{ Boite = $mb.PrimarySmtpAddress; Origine = "Règle : $($_.Name)"; Vers = (@($_.ForwardTo + $_.ForwardAsAttachmentTo + $_.RedirectTo) -join ','); Copie = $null }
                }
        }
        $res | Export-Csv .\transferts.csv -NoTypeInformation -Encoding UTF8 -Delimiter ';'
        $res | Format-Table -AutoSize
    tags:
      - transfert
      - redirection
      - sécurité
      - audit
      - règles
      - forwarding
    module: ExchangeOnlineManagement
    perms: Rôle Exchange « View-Only Recipients » ou Exchange Administrator
    pitfall: "À lancer régulièrement : une redirection vers l'extérieur est le signe classique d'un compte piraté."
    url: https://learn.microsoft.com/powershell/module/exchange/get-inboxrule
  - name: 'Script : auditer les délégations (accès complet, envoyer en tant que, de la part de)'
    cat: scripts
    syn: .\Export-Delegations.ps1
    desc: Liste, pour chaque boîte, qui peut l'ouvrir, envoyer en son nom ou de sa part.
    ex:
      - |-
        Connect-ExchangeOnline -ShowBanner:$false
        $res = foreach ($mb in Get-EXOMailbox -ResultSize Unlimited -Properties GrantSendOnBehalfTo) {
            Get-EXOMailboxPermission -Identity $mb.UserPrincipalName |
                Where-Object { $_.User -ne 'NT AUTHORITY\SELF' -and -not $_.IsInherited -and -not $_.Deny } |
                ForEach-Object { [pscustomobject]@{ Boite = $mb.PrimarySmtpAddress; Droit = 'Accès complet'; Utilisateur = $_.User } }
            Get-EXORecipientPermission -Identity $mb.UserPrincipalName |
                Where-Object { $_.Trustee -ne 'NT AUTHORITY\SELF' } |
                ForEach-Object { [pscustomobject]@{ Boite = $mb.PrimarySmtpAddress; Droit = 'Envoyer en tant que'; Utilisateur = $_.Trustee } }
            foreach ($d in $mb.GrantSendOnBehalfTo) {
                [pscustomobject]@{ Boite = $mb.PrimarySmtpAddress; Droit = 'Envoyer de la part de'; Utilisateur = $d }
            }
        }
        $res | Export-Csv .\delegations.csv -NoTypeInformation -Encoding UTF8 -Delimiter ';'
    tags:
      - délégation
      - accès
      - sendas
      - fullaccess
      - audit
    module: ExchangeOnlineManagement
    perms: Rôle Exchange « View-Only Recipients » ou Exchange Administrator
    pitfall: 'Une boîte partagée sans propriétaire clair est un risque : repérez celles dont les accès datent.'
    url: https://learn.microsoft.com/powershell/module/exchange/get-exomailboxpermission
  - name: 'Script : exporter les utilisateurs Entra ID (licences, dernière connexion, MFA)'
    cat: scripts
    syn: .\Export-UtilisateursEntra.ps1
    desc: Exporte les utilisateurs avec service, fonction, manager, licences, dernière connexion et état d'activation.
    ex:
      - |-
        Connect-MgGraph -Scopes 'User.Read.All','AuditLog.Read.All','Organization.Read.All'
        $sku = @{}; Get-MgSubscribedSku | ForEach-Object { $sku[$_.SkuId] = $_.SkuPartNumber }
        $props = 'Id','DisplayName','GivenName','Surname','UserPrincipalName','Mail','Department','JobTitle','AccountEnabled','CreatedDateTime','UserType','AssignedLicenses','SignInActivity'
        Get-MgUser -All -Property $props -ExpandProperty Manager | ForEach-Object {
            [pscustomobject]@{
                Prenom            = $_.GivenName
                Nom               = $_.Surname
                UPN               = $_.UserPrincipalName
                Mail              = $_.Mail
                Service           = $_.Department
                Fonction          = $_.JobTitle
                Manager           = $_.Manager.AdditionalProperties.userPrincipalName
                Actif             = $_.AccountEnabled
                Type              = $_.UserType
                Licences          = ($_.AssignedLicenses | ForEach-Object { $sku[$_.SkuId] }) -join ';'
                DerniereConnexion = $_.SignInActivity.LastSignInDateTime
                Cree              = $_.CreatedDateTime
            }
        } | Export-Csv .\utilisateurs-entra.csv -NoTypeInformation -Encoding UTF8 -Delimiter ';'
    tags:
      - export
      - licence
      - dernière connexion
      - utilisateurs
      - entra
    module: Microsoft.Graph.Users
    perms: User.Read.All, AuditLog.Read.All
    pitfall: SignInActivity exige une licence Entra ID P1 ; sans elle, la colonne reste vide.
    url: https://learn.microsoft.com/powershell/module/microsoft.graph.users/get-mguser
  - name: 'Script : comptes inactifs depuis plus de 90 jours'
    cat: scripts
    syn: .\Export-ComptesInactifs.ps1
    desc: Repère les comptes sans connexion depuis 90 jours (candidats à la désactivation ou au retrait de licence).
    ex:
      - |-
        Connect-MgGraph -Scopes 'User.Read.All','AuditLog.Read.All'
        $limite = (Get-Date).AddDays(-90)
        Get-MgUser -All -Filter "accountEnabled eq true and userType eq 'Member'" -Property DisplayName,UserPrincipalName,SignInActivity,AssignedLicenses |
            Where-Object { $_.SignInActivity.LastSignInDateTime -lt $limite -or -not $_.SignInActivity.LastSignInDateTime } |
            Select-Object DisplayName, UserPrincipalName,
                @{n='DerniereConnexion'; e={ $_.SignInActivity.LastSignInDateTime }},
                @{n='NbLicences'; e={ $_.AssignedLicenses.Count }} |
            Sort-Object DerniereConnexion | Export-Csv .\comptes-inactifs.csv -NoTypeInformation -Encoding UTF8 -Delimiter ';'
    tags:
      - inactif
      - licence
      - nettoyage
      - dernière connexion
    module: Microsoft.Graph.Users
    perms: User.Read.All, AuditLog.Read.All
    pitfall: "Les comptes de service ou de boîte partagée n'ont pas de connexion normale : excluez-les avant d'agir."
    url: https://learn.microsoft.com/powershell/module/microsoft.graph.users/get-mguser
  - name: 'Script : utilisateurs sans méthode MFA enregistrée'
    cat: scripts
    syn: .\Export-SansMfa.ps1
    desc: Liste les utilisateurs actifs qui n'ont pas enregistré d'authentification multifacteur.
    ex:
      - |-
        Connect-MgGraph -Scopes 'AuditLog.Read.All','User.Read.All'
        $actifs = Get-MgUser -All -Filter 'accountEnabled eq true' -Property UserPrincipalName | Select-Object -ExpandProperty UserPrincipalName
        Get-MgReportAuthenticationMethodUserRegistrationDetail -All |
            Where-Object { $_.UserPrincipalName -in $actifs -and -not $_.IsMfaRegistered } |
            Select-Object UserDisplayName, UserPrincipalName, DefaultMfaMethod |
            Export-Csv .\sans-mfa.csv -NoTypeInformation -Encoding UTF8 -Delimiter ';'
    tags:
      - mfa
      - sécurité
      - authentification
    module: Microsoft.Graph.Reports
    perms: AuditLog.Read.All, User.Read.All
    pitfall: 'Les invités et comptes de service apparaissent aussi : filtrez sur UserType et les comptes à exclure.'
    url: https://learn.microsoft.com/powershell/module/microsoft.graph.reports/get-mgreportauthenticationmethoduserregistrationdetail
  - name: 'Script : membres de tous les groupes de distribution (export)'
    cat: scripts
    syn: .\Export-MembresGroupes.ps1
    desc: Exporte, pour chaque groupe de distribution, la liste de ses membres.
    ex:
      - |-
        Connect-ExchangeOnline -ShowBanner:$false
        Get-DistributionGroup -ResultSize Unlimited | ForEach-Object {
            $g = $_
            Get-DistributionGroupMember -Identity $g.PrimarySmtpAddress -ResultSize Unlimited | ForEach-Object {
                [pscustomobject]@{ Groupe = $g.DisplayName; AdresseGroupe = $g.PrimarySmtpAddress; Membre = $_.DisplayName; AdresseMembre = $_.PrimarySmtpAddress; Type = $_.RecipientType }
            }
        } | Export-Csv .\membres-groupes.csv -NoTypeInformation -Encoding UTF8 -Delimiter ';'
    tags:
      - groupe
      - membre
      - liste de diffusion
      - export
    module: ExchangeOnlineManagement
    perms: Rôle Exchange « View-Only Recipients » ou Exchange Administrator
    pitfall: Les groupes Microsoft 365 se lisent avec Get-UnifiedGroup / Get-UnifiedGroupLinks.
    url: https://learn.microsoft.com/powershell/module/exchange/get-distributiongroupmember
  - name: 'Script : créer des utilisateurs depuis un fichier CSV (Graph)'
    cat: scripts
    syn: .\Import-Utilisateurs.ps1
    desc: Crée des comptes Microsoft 365 depuis un CSV (prénom, nom, adresse, service) et leur attribue une licence.
    ex:
      - |-
        # nouveaux.csv : Prenom;Nom;UPN;Service;MotDePasse
        Connect-MgGraph -Scopes 'User.ReadWrite.All','Organization.Read.All'
        $sku = (Get-MgSubscribedSku | Where-Object SkuPartNumber -eq 'O365_BUSINESS_PREMIUM').SkuId
        Import-Csv .\nouveaux.csv -Delimiter ';' | ForEach-Object {
            $user = New-MgUser -DisplayName "$($_.Prenom) $($_.Nom)" -GivenName $_.Prenom -Surname $_.Nom `
                -UserPrincipalName $_.UPN -MailNickname ($_.UPN.Split('@')[0]) -Department $_.Service -UsageLocation FR `
                -AccountEnabled -PasswordProfile @{ Password = $_.MotDePasse; ForceChangePasswordNextSignIn = $true }
            Set-MgUserLicense -UserId $user.Id -AddLicenses @(@{ SkuId = $sku }) -RemoveLicenses @() | Out-Null
            Write-Host "Créé : $($_.UPN)"
        }
    tags:
      - créer
      - csv
      - licence
      - arrivée
      - onboarding
    module: Microsoft.Graph.Users
    perms: User.ReadWrite.All, Organization.Read.All
    pitfall: "UsageLocation est obligatoire avant d'attribuer une licence. Ne stockez pas les mots de passe en clair : générez-les à la volée."
    url: https://learn.microsoft.com/powershell/module/microsoft.graph.users/new-mguser
  - name: 'Script : procédure de départ (bloquer, révoquer, boîte partagée, licences)'
    cat: scripts
    syn: .\Depart-Utilisateur.ps1 -Utilisateur <upn>
    desc: "Départ d'un salarié : bloque la connexion, révoque les sessions, convertit la boîte en boîte partagée, retire les licences."
    ex:
      - |-
        param([Parameter(Mandatory)][string]$Utilisateur)
        Connect-MgGraph -Scopes 'User.ReadWrite.All'
        Connect-ExchangeOnline -ShowBanner:$false

        Update-MgUser -UserId $Utilisateur -AccountEnabled:$false                       # 1. bloquer la connexion
        Revoke-MgUserSignInSession -UserId $Utilisateur | Out-Null                      # 2. couper les sessions ouvertes
        Set-Mailbox -Identity $Utilisateur -Type Shared                                 # 3. boîte partagée (garde les mails)
        Set-Mailbox -Identity $Utilisateur -HiddenFromAddressListsEnabled $true         # 4. masquer de l'annuaire
        $lic = (Get-MgUserLicenseDetail -UserId $Utilisateur).SkuId                     # 5. retirer les licences
        if ($lic) { Set-MgUserLicense -UserId $Utilisateur -AddLicenses @() -RemoveLicenses $lic | Out-Null }
        Write-Host "Départ traité pour $Utilisateur"
    tags:
      - départ
      - offboarding
      - licence
      - partagée
      - bloquer
    module: ExchangeOnlineManagement + Microsoft.Graph
    perms: Exchange Administrator + User Administrator
    pitfall: "Retirez les licences en dernier : une boîte partagée garde son contenu sans licence jusqu'à 50 Go, pas au-delà. Testez d'abord sur un compte de test."
    url: https://learn.microsoft.com/microsoft-365/admin/add-users/remove-former-employee
