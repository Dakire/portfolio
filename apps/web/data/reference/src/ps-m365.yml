# PowerShell Microsoft 365 : source éditable. Après modification : `pnpm --filter @grichard/web reference:build`.
# Champs d'une entrée : name, cat, syn, desc, alias, ex (liste), tags, module, perms, pitfall, doc (suffixe Microsoft Learn) ou url.
meta:
  id: powershell-m365
  order: 2
  title: 'PowerShell Microsoft 365 : cheatsheet | Guillaume Richard'
  h1: PowerShell Microsoft 365
  description: 'Cheatsheet PowerShell pour Microsoft 365 : Exchange Online, Graph, Entra ID, Teams, SharePoint, avec module, permissions, exemple et piège courant.'
  intro: 'Cmdlets des modules actuels (Exchange Online, Microsoft Graph PowerShell, Teams, SharePoint Online). MSOnline et AzureAD sont dépréciés : utilisez Microsoft Graph PowerShell.'
  card: 'Exchange Online, Microsoft Graph, Entra ID, Teams, SharePoint, Intune, Defender/Purview : cmdlet, module, permissions, exemple, piège.'
  notice: "MSOnline et AzureAD (cmdlets Msol* et *-AzureAD*) sont dépréciés et ne reçoivent plus de correctifs : migrez vers Microsoft Graph PowerShell (Mg*). Testez d'abord avec -WhatIf quand il existe."
  docBase: https://learn.microsoft.com/powershell/module/
  docs:
    label: Documentation PowerShell Microsoft 365
    url: https://learn.microsoft.com/microsoft-365/enterprise/connect-to-microsoft-365-powershell
  fields:
    - { key: module, label: Module requis }
    - { key: perms, label: Permissions / rôles }
    - { key: pitfall, label: Piège courant }
  cats:
    - { id: exchange, label: Exchange Online }
    - { id: graph, label: Graph et Entra ID }
    - { id: teams, label: Teams }
    - { id: sharepoint, label: SharePoint Online }
    - { id: intune, label: Intune }
    - { id: security, label: Defender et Purview }
    - { id: legacy, label: MSOnline / AzureAD (déprécié) }
  top:
    - title: Connexion
      note: "Installez d'abord les modules (une fois) avec Install-Module -Scope CurrentUser, puis connectez-vous à chaque session."
      items:
        - code: 'Connect-ExchangeOnline -UserPrincipalName admin@contoso.com'
          note: 'Exchange Online (module ExchangeOnlineManagement). Ajoutez -ShowBanner:$false pour un affichage plus court. Déconnexion : Disconnect-ExchangeOnline -Confirm:$false.'
        - code: "Connect-MgGraph -Scopes 'User.Read.All','Group.ReadWrite.All','Directory.Read.All'"
          note: 'Microsoft Graph PowerShell : demandez uniquement les scopes nécessaires (moindre privilège). Vérifiez avec Get-MgContext. Scopes courants : User.ReadWrite.All, Group.ReadWrite.All, Directory.ReadWrite.All, Policy.Read.All, DeviceManagementManagedDevices.Read.All, AuditLog.Read.All.'
        - code: 'Connect-MicrosoftTeams'
          note: 'Teams (module MicrosoftTeams). Rôle Teams Administrator ou supérieur.'
        - code: 'Connect-SPOService -Url https://contoso-admin.sharepoint.com'
          note: "SharePoint Online (module Microsoft.Online.SharePoint.PowerShell), URL du centre d'administration. Alternative : PnP.PowerShell."
        - code: 'Connect-IPPSSession -UserPrincipalName admin@contoso.com'
          note: 'Security & Compliance (Defender, Purview) : même module que Exchange Online.'
entries:
  # ---------------------------------------------------------------- Exchange Online
  - name: Get-Mailbox
    cat: exchange
    syn: Get-Mailbox [-Identity <id>] [-ResultSize Unlimited]
    desc: Liste les boîtes aux lettres ou affiche les propriétés d'une boîte.
    ex:
      - 'Get-Mailbox -Identity user@contoso.com | Format-List DisplayName,PrimarySmtpAddress,ArchiveStatus,LitigationHoldEnabled'
      - 'Get-Mailbox -ResultSize Unlimited -RecipientTypeDetails SharedMailbox'
    tags: [boîte aux lettres, partagée, shared]
    module: ExchangeOnlineManagement
    perms: 'Rôle Exchange « View-Only Recipients » ou Exchange Administrator'
    pitfall: 'Sans -ResultSize Unlimited, seuls 1000 résultats sont renvoyés.'
    doc: exchange/get-mailbox
  - name: Set-Mailbox
    cat: exchange
    syn: Set-Mailbox -Identity <id> [propriétés]
    desc: Modifie une boîte aux lettres (quota, adresse, transfert, archive, conservation).
    ex:
      - 'Set-Mailbox -Identity user@contoso.com -ForwardingSmtpAddress ext@example.com -DeliverToMailboxAndForward $true'
      - 'Set-Mailbox -Identity user@contoso.com -LitigationHoldEnabled $true'
    module: ExchangeOnlineManagement
    perms: 'Exchange Administrator ou rôle « Mail Recipients »'
    pitfall: 'Le transfert externe est souvent bloqué par la politique anti-spam sortante du tenant.'
    doc: exchange/set-mailbox
  - name: New-Mailbox
    cat: exchange
    syn: New-Mailbox -Shared -Name <nom> -DisplayName <nom>
    desc: Crée une boîte aux lettres partagée (ou salle/équipement avec -Room, -Equipment).
    ex:
      - "New-Mailbox -Shared -Name 'Support' -DisplayName 'Support' -PrimarySmtpAddress support@contoso.com"
    module: ExchangeOnlineManagement
    perms: 'Exchange Administrator'
    pitfall: "Une boîte partagée n'a pas besoin de licence tant qu'elle reste sous 50 Go et sans archive."
    doc: exchange/new-mailbox
  - name: Add-MailboxPermission
    cat: exchange
    syn: Add-MailboxPermission -Identity <boîte> -User <utilisateur> -AccessRights FullAccess
    desc: Donne l'accès complet à une boîte (délégation de lecture/écriture).
    ex:
      - 'Add-MailboxPermission -Identity shared@contoso.com -User user@contoso.com -AccessRights FullAccess -AutoMapping $true'
    alias: [delegation, full access]
    module: ExchangeOnlineManagement
    perms: 'Exchange Administrator'
    pitfall: 'Prévoyez 30 à 60 minutes de propagation ; ajoutez aussi Add-RecipientPermission pour « Envoyer en tant que ».'
    doc: exchange/add-mailboxpermission
  - name: Add-RecipientPermission
    cat: exchange
    syn: Add-RecipientPermission -Identity <boîte> -Trustee <utilisateur> -AccessRights SendAs
    desc: Autorise « Envoyer en tant que » sur une boîte ou un groupe.
    ex:
      - 'Add-RecipientPermission -Identity shared@contoso.com -Trustee user@contoso.com -AccessRights SendAs -Confirm:$false'
    module: ExchangeOnlineManagement
    perms: 'Exchange Administrator'
    pitfall: '« Envoyer de la part de » (SendOnBehalf) est une autre commande : Set-Mailbox -GrantSendOnBehalfTo.'
    doc: exchange/add-recipientpermission
  - name: Get-MailboxStatistics
    cat: exchange
    syn: Get-MailboxStatistics -Identity <id>
    desc: Taille, nombre d'éléments et dernière connexion d'une boîte.
    ex:
      - 'Get-MailboxStatistics user@contoso.com | Select DisplayName,TotalItemSize,ItemCount,LastLogonTime'
    module: ExchangeOnlineManagement
    perms: 'View-Only Recipients'
    pitfall: "LastLogonTime peut être vide si la boîte n'a jamais été ouverte ou n'a pas été utilisée récemment."
    doc: exchange/get-mailboxstatistics
  - name: Get-MessageTraceV2
    cat: exchange
    syn: Get-MessageTraceV2 -SenderAddress <expéditeur> -StartDate <date> -EndDate <date>
    desc: Suit un message (remis, retardé, rejeté) sur les 10 derniers jours. Remplace Get-MessageTrace.
    ex:
      - 'Get-MessageTraceV2 -RecipientAddress user@contoso.com -StartDate (Get-Date).AddDays(-2) -EndDate (Get-Date)'
    alias: [Get-MessageTrace, trace de message]
    module: ExchangeOnlineManagement (version récente)
    perms: 'View-Only Recipients ou Message Tracking'
    pitfall: 'Get-MessageTrace est en cours de retrait ; au-delà de 10 jours, utilisez Start-HistoricalSearch.'
    doc: exchange/get-messagetracev2
  - name: Start-HistoricalSearch
    cat: exchange
    syn: Start-HistoricalSearch -ReportTitle <titre> -ReportType MessageTrace ...
    desc: Lance une recherche de traces de messages au-delà de 10 jours (jusqu'à 90 jours), livrée par e-mail.
    ex:
      - "Start-HistoricalSearch -ReportTitle 'Trace' -ReportType MessageTrace -StartDate (Get-Date).AddDays(-30) -EndDate (Get-Date) -SenderAddress a@example.com -NotifyAddress admin@contoso.com"
    module: ExchangeOnlineManagement
    perms: 'Exchange Administrator'
    pitfall: "Le résultat n'arrive pas dans la console : il est envoyé en CSV à l'adresse de notification."
    doc: exchange/start-historicalsearch
  - name: New-TransportRule
    cat: exchange
    syn: New-TransportRule -Name <nom> -Conditions... -Actions...
    desc: Crée une règle de flux de messagerie (disclaimer, blocage, redirection).
    ex:
      - "New-TransportRule -Name 'Étiquette externe' -FromScope NotInOrganization -PrependSubject '[EXTERNE] '"
    module: ExchangeOnlineManagement
    perms: 'Exchange Administrator (rôle Transport Rules)'
    pitfall: "Créez-la en mode test (-Mode Audit) avant d'appliquer ; l'ordre des règles (-Priority) compte."
    doc: exchange/new-transportrule
  - name: Get-DistributionGroupMember
    cat: exchange
    syn: Get-DistributionGroupMember -Identity <groupe>
    desc: Liste les membres d'une liste de distribution.
    ex:
      - 'Get-DistributionGroupMember -Identity team@contoso.com -ResultSize Unlimited | Select DisplayName,PrimarySmtpAddress'
    module: ExchangeOnlineManagement
    perms: 'View-Only Recipients'
    pitfall: 'Pour un groupe Microsoft 365, utilisez Get-UnifiedGroupLinks -LinkType Members.'
    doc: exchange/get-distributiongroupmember
  - name: Add-DistributionGroupMember
    cat: exchange
    syn: Add-DistributionGroupMember -Identity <groupe> -Member <utilisateur>
    desc: Ajoute un membre à une liste de distribution.
    ex:
      - 'Add-DistributionGroupMember -Identity team@contoso.com -Member user@contoso.com'
    module: ExchangeOnlineManagement
    perms: 'Propriétaire du groupe ou Exchange Administrator'
    pitfall: 'Impossible de modifier un groupe de sécurité à extension messagerie synchronisé depuis AD : modifiez-le sur site.'
    doc: exchange/add-distributiongroupmember
  - name: Set-CalendarProcessing
    cat: exchange
    syn: Set-CalendarProcessing -Identity <salle> -AutomateProcessing AutoAccept
    desc: Règle l'acceptation automatique des réunions pour une salle ou un équipement.
    ex:
      - 'Set-CalendarProcessing -Identity salle1@contoso.com -AutomateProcessing AutoAccept -AllowConflicts $false'
    module: ExchangeOnlineManagement
    perms: 'Exchange Administrator'
    pitfall: '-AllowConflicts $false ne suffit pas pour les réunions récurrentes : réglez aussi -ConflictPercentageAllowed.'
    doc: exchange/set-calendarprocessing
  - name: Add-MailboxFolderPermission
    cat: exchange
    syn: Add-MailboxFolderPermission -Identity <boîte>:\Calendrier -User <utilisateur> -AccessRights Reviewer
    desc: Partage un dossier (agenda, boîte de réception) avec un utilisateur.
    ex:
      - "Add-MailboxFolderPermission -Identity user@contoso.com:\\Calendar -User collegue@contoso.com -AccessRights Editor"
    module: ExchangeOnlineManagement
    perms: 'Exchange Administrator ou propriétaire de la boîte'
    pitfall: 'Le nom du dossier dépend de la langue de la boîte (Calendrier en français) ; vérifiez avec Get-MailboxFolderStatistics.'
    doc: exchange/add-mailboxfolderpermission
  - name: Get-EXOMailbox
    cat: exchange
    syn: Get-EXOMailbox -Identity <id> -Properties <liste>
    desc: Version rapide et économe de Get-Mailbox pour de grands volumes.
    ex:
      - 'Get-EXOMailbox -ResultSize Unlimited -Properties ProhibitSendQuota | Select DisplayName,ProhibitSendQuota'
    module: ExchangeOnlineManagement (v3+)
    perms: 'View-Only Recipients'
    pitfall: 'Seules les propriétés demandées avec -Properties sont renvoyées.'
    doc: exchange/get-exomailbox
  - name: Enable-Mailbox (archive)
    cat: exchange
    syn: Enable-Mailbox -Identity <id> -Archive
    desc: Active l'archivage en ligne d'une boîte.
    ex:
      - 'Enable-Mailbox -Identity user@contoso.com -Archive'
    module: ExchangeOnlineManagement
    perms: 'Exchange Administrator'
    pitfall: "Nécessite une licence qui inclut l'archive (Exchange Online Plan 2 ou équivalent)."
    doc: exchange/enable-mailbox

  # ---------------------------------------------------------------- Microsoft Graph et Entra ID
  - name: Connect-MgGraph
    cat: graph
    syn: Connect-MgGraph -Scopes <scopes> [-TenantId <id>] [-NoWelcome]
    desc: Ouvre une session Microsoft Graph PowerShell avec les scopes demandés.
    ex:
      - "Connect-MgGraph -Scopes 'User.ReadWrite.All' -NoWelcome"
      - 'Get-MgContext | Select Account,TenantId,Scopes'
    module: Microsoft.Graph.Authentication
    perms: 'Consentement administrateur pour les scopes sensibles'
    pitfall: 'Un scope absent donne « Insufficient privileges » : reconnectez-vous avec le bon scope.'
    url: https://learn.microsoft.com/powershell/module/microsoft.graph.authentication/connect-mggraph
  - name: Get-MgUser
    cat: graph
    syn: Get-MgUser [-UserId <id>] [-Filter <odata>] [-Property <liste>] [-All]
    desc: Lit un utilisateur ou liste les comptes Entra ID. Remplace Get-MsolUser / Get-AzureADUser.
    alias: [Get-MsolUser, Get-AzureADUser]
    ex:
      - 'Get-MgUser -UserId user@contoso.com -Property DisplayName,AccountEnabled,SignInActivity'
      - 'Get-MgUser -All -Filter "accountEnabled eq false" | Select DisplayName,UserPrincipalName'
    module: Microsoft.Graph.Users
    perms: 'User.Read.All (AuditLog.Read.All pour SignInActivity)'
    pitfall: 'Par défaut peu de propriétés sont renvoyées : demandez-les avec -Property. Sans -All, la liste est tronquée.'
    doc: microsoft.graph.users/get-mguser
  - name: New-MgUser
    cat: graph
    syn: New-MgUser -DisplayName <nom> -UserPrincipalName <upn> -MailNickname <alias> -AccountEnabled -PasswordProfile <hash>
    desc: Crée un utilisateur Entra ID.
    ex:
      - "New-MgUser -DisplayName 'Jean Dupont' -UserPrincipalName jean@contoso.com -MailNickname jean -AccountEnabled -PasswordProfile @{ Password = '<mot de passe>'; ForceChangePasswordNextSignIn = $true }"
    module: Microsoft.Graph.Users
    perms: 'User.ReadWrite.All ; rôle User Administrator'
    pitfall: "Définissez UsageLocation avant d'attribuer une licence."
    doc: microsoft.graph.users/new-mguser
  - name: Update-MgUser
    cat: graph
    syn: Update-MgUser -UserId <id> [-propriété valeur]
    desc: Modifie un utilisateur (service, titre, activation, localisation d'usage).
    ex:
      - 'Update-MgUser -UserId user@contoso.com -AccountEnabled:$false'
      - 'Update-MgUser -UserId user@contoso.com -UsageLocation FR'
    module: Microsoft.Graph.Users
    perms: 'User.ReadWrite.All'
    pitfall: "Désactiver un compte n'invalide pas les sessions en cours : utilisez aussi Revoke-MgUserSignInSession."
    doc: microsoft.graph.users/update-mguser
  - name: Revoke-MgUserSignInSession
    cat: graph
    syn: Revoke-MgUserSignInSession -UserId <id>
    desc: Révoque les jetons d'actualisation et les sessions d'un utilisateur (compte compromis).
    ex:
      - 'Revoke-MgUserSignInSession -UserId user@contoso.com'
    module: Microsoft.Graph.Users.Actions
    perms: 'User.RevokeSessions.All'
    pitfall: "Les jetons d'accès déjà émis restent valides jusqu'à environ une heure."
    doc: microsoft.graph.users.actions/revoke-mgusersigninsession
  - name: Set-MgUserLicense
    cat: graph
    syn: Set-MgUserLicense -UserId <id> -AddLicenses @{SkuId=...} -RemoveLicenses @()
    desc: Attribue ou retire des licences Microsoft 365.
    ex:
      - 'Get-MgSubscribedSku | Select SkuPartNumber,SkuId,ConsumedUnits'
      - "Set-MgUserLicense -UserId user@contoso.com -AddLicenses @{SkuId='<SkuId>'} -RemoveLicenses @()"
    module: Microsoft.Graph.Users.Actions
    perms: 'LicenseAssignment.ReadWrite.All ou User.ReadWrite.All'
    pitfall: '-RemoveLicenses est obligatoire même vide ; UsageLocation doit être renseignée.'
    doc: microsoft.graph.users.actions/set-mguserlicense
  - name: Get-MgGroup
    cat: graph
    syn: Get-MgGroup [-GroupId <id>] [-Filter <odata>] [-All]
    desc: Liste les groupes Entra ID (Microsoft 365, sécurité).
    ex:
      - 'Get-MgGroup -All -Filter "startsWith(displayName,''Ventes'')"'
    module: Microsoft.Graph.Groups
    perms: 'Group.Read.All'
    pitfall: 'Les filtres avancés (endswith, not) demandent -ConsistencyLevel eventual -CountVariable n.'
    doc: microsoft.graph.groups/get-mggroup
  - name: New-MgGroupMember
    cat: graph
    syn: New-MgGroupMember -GroupId <id> -DirectoryObjectId <id>
    desc: Ajoute un membre à un groupe Entra ID.
    ex:
      - 'New-MgGroupMember -GroupId $groupId -DirectoryObjectId (Get-MgUser -UserId user@contoso.com).Id'
    module: Microsoft.Graph.Groups
    perms: 'GroupMember.ReadWrite.All'
    pitfall: 'Impossible sur un groupe à appartenance dynamique ou synchronisé depuis AD.'
    doc: microsoft.graph.groups/new-mggroupmember
  - name: Get-MgUserAuthenticationMethod
    cat: graph
    syn: Get-MgUserAuthenticationMethod -UserId <id>
    desc: Liste les méthodes d'authentification (MFA) d'un utilisateur.
    ex:
      - 'Get-MgUserAuthenticationMethod -UserId user@contoso.com | Select Id,AdditionalProperties'
    module: Microsoft.Graph.Identity.SignIns
    perms: 'UserAuthenticationMethod.Read.All ; rôle Authentication Administrator'
    pitfall: 'Le type de méthode est dans AdditionalProperties.@odata.type.'
    doc: microsoft.graph.identity.signins/get-mguserauthenticationmethod
  - name: Get-MgAuditLogSignIn
    cat: graph
    syn: Get-MgAuditLogSignIn -Filter <odata> -Top <n>
    desc: Journal des connexions Entra ID (échecs, localisation, accès conditionnel).
    ex:
      - 'Get-MgAuditLogSignIn -Filter "userPrincipalName eq ''user@contoso.com''" -Top 20 | Select CreatedDateTime,AppDisplayName,IPAddress,Status'
    module: Microsoft.Graph.Reports
    perms: 'AuditLog.Read.All ; licence Entra ID P1'
    pitfall: 'Conservation de 30 jours seulement ; le filtre ne gère pas toutes les combinaisons.'
    doc: microsoft.graph.reports/get-mgauditlogsignin
  - name: Get-MgDirectoryRole
    cat: graph
    syn: Get-MgDirectoryRole / Get-MgDirectoryRoleMember
    desc: Liste les rôles d'administration activés et leurs membres.
    ex:
      - '$r = Get-MgDirectoryRole -Filter "displayName eq ''Global Administrator''"; Get-MgDirectoryRoleMember -DirectoryRoleId $r.Id'
    module: Microsoft.Graph.Identity.DirectoryManagement
    perms: 'RoleManagement.Read.Directory'
    pitfall: "Un rôle jamais attribué n'apparaît pas tant qu'il n'est pas activé ; l'appartenance via PIM n'est pas listée ici."
    doc: microsoft.graph.identity.directorymanagement/get-mgdirectoryrole
  - name: Get-MgSubscribedSku
    cat: graph
    syn: Get-MgSubscribedSku
    desc: Licences achetées, consommées et disponibles du tenant.
    ex:
      - "Get-MgSubscribedSku | Select SkuPartNumber,ConsumedUnits,@{n='Total';e={$_.PrepaidUnits.Enabled}}"
    module: Microsoft.Graph.Identity.DirectoryManagement
    perms: 'Organization.Read.All'
    pitfall: 'SkuPartNumber est un nom technique (SPE_E3 pour Microsoft 365 E3), pas le nom commercial.'
    doc: microsoft.graph.identity.directorymanagement/get-mgsubscribedsku
  - name: Get-MgIdentityConditionalAccessPolicy
    cat: graph
    syn: Get-MgIdentityConditionalAccessPolicy
    desc: Liste les stratégies d'accès conditionnel.
    ex:
      - 'Get-MgIdentityConditionalAccessPolicy | Select DisplayName,State'
    module: Microsoft.Graph.Identity.SignIns
    perms: 'Policy.Read.All'
    pitfall: "Passez toujours une nouvelle stratégie en mode « rapport seul » avant de l'activer, pour ne pas vous verrouiller."
    doc: microsoft.graph.identity.signins/get-mgidentityconditionalaccesspolicy

  # ---------------------------------------------------------------- Teams
  - name: Get-Team
    cat: teams
    syn: Get-Team [-DisplayName <nom>] [-User <upn>]
    desc: Liste les équipes Teams.
    ex:
      - "Get-Team -DisplayName 'Projet' | Select GroupId,DisplayName,Visibility,Archived"
    module: MicrosoftTeams
    perms: 'Teams Administrator ou lecture globale'
    pitfall: '-DisplayName fait une recherche par préfixe, pas un nom exact.'
    doc: teams/get-team
  - name: New-Team
    cat: teams
    syn: New-Team -DisplayName <nom> -Visibility Private
    desc: Crée une équipe (et son groupe Microsoft 365).
    ex:
      - "New-Team -DisplayName 'Projet Alpha' -Visibility Private -Owner admin@contoso.com"
    module: MicrosoftTeams
    perms: 'Teams Administrator ; création possiblement limitée par la stratégie de groupes'
    pitfall: "Précisez -Owner : sans propriétaire, l'équipe peut être orpheline."
    doc: teams/new-team
  - name: Add-TeamUser
    cat: teams
    syn: Add-TeamUser -GroupId <id> -User <upn> -Role Member
    desc: Ajoute un membre ou un propriétaire à une équipe.
    ex:
      - 'Add-TeamUser -GroupId $groupId -User user@contoso.com -Role Member'
    module: MicrosoftTeams
    perms: "Propriétaire de l'équipe ou Teams Administrator"
    pitfall: "Pour un propriétaire, l'utilisateur doit déjà être membre."
    doc: teams/add-teamuser
  - name: Get-CsOnlineUser
    cat: teams
    syn: Get-CsOnlineUser -Identity <upn>
    desc: Affiche la configuration Teams d'un utilisateur (téléphonie, stratégies).
    ex:
      - 'Get-CsOnlineUser -Identity user@contoso.com | Select DisplayName,TeamsMeetingPolicy,LineUri,InterpretedUserType'
    module: MicrosoftTeams
    perms: 'Teams Administrator'
    pitfall: 'Une stratégie vide signifie « globale par défaut », pas « aucune ».'
    doc: teams/get-csonlineuser
  - name: Grant-CsTeamsMeetingPolicy
    cat: teams
    syn: Grant-CsTeamsMeetingPolicy -Identity <upn> -PolicyName <stratégie>
    desc: Attribue une stratégie de réunion Teams à un utilisateur.
    ex:
      - "Grant-CsTeamsMeetingPolicy -Identity user@contoso.com -PolicyName 'RestrictedAnonymous'"
    module: MicrosoftTeams
    perms: 'Teams Administrator'
    pitfall: "Jusqu'à 24 h de propagation ; pour beaucoup d'utilisateurs, préférez une attribution par groupe (New-CsGroupPolicyAssignment)."
    doc: teams/grant-csteamsmeetingpolicy

  # ---------------------------------------------------------------- SharePoint Online
  - name: Get-SPOSite
    cat: sharepoint
    syn: Get-SPOSite [-Identity <url>] [-Limit All]
    desc: Liste les collections de sites SharePoint.
    ex:
      - 'Get-SPOSite -Limit All | Select Url,StorageUsageCurrent,SharingCapability'
    module: Microsoft.Online.SharePoint.PowerShell
    perms: 'SharePoint Administrator'
    pitfall: 'Sans -Limit All, seuls 200 sites sont renvoyés.'
    doc: sharepoint-online/get-sposite
  - name: Set-SPOSite
    cat: sharepoint
    syn: Set-SPOSite -Identity <url> [-SharingCapability ...] [-StorageQuota ...]
    desc: Modifie un site (partage externe, quota, verrouillage).
    ex:
      - 'Set-SPOSite -Identity https://contoso.sharepoint.com/sites/rh -SharingCapability Disabled'
      - 'Set-SPOSite -Identity https://contoso.sharepoint.com/sites/rh -LockState ReadOnly'
    module: Microsoft.Online.SharePoint.PowerShell
    perms: 'SharePoint Administrator'
    pitfall: "Le partage d'un site ne peut pas être plus ouvert que celui du tenant (Set-SPOTenant)."
    doc: sharepoint-online/set-sposite
  - name: Get-SPOTenant
    cat: sharepoint
    syn: Get-SPOTenant
    desc: Paramètres globaux du tenant SharePoint et OneDrive (partage, synchronisation).
    ex:
      - 'Get-SPOTenant | Select SharingCapability,DefaultSharingLinkType,OneDriveStorageQuota'
    module: Microsoft.Online.SharePoint.PowerShell
    perms: 'SharePoint Administrator'
    pitfall: "Une modification de Set-SPOTenant peut mettre plusieurs minutes à s'appliquer."
    doc: sharepoint-online/get-spotenant
  - name: Get-SPOUser / Add-SPOUser
    cat: sharepoint
    syn: Get-SPOUser -Site <url> / Add-SPOUser -Site <url> -LoginName <upn> -Group <groupe>
    desc: Consulte ou ajoute des utilisateurs dans un site.
    ex:
      - 'Get-SPOUser -Site https://contoso.sharepoint.com/sites/rh -Limit All'
      - "Add-SPOUser -Site https://contoso.sharepoint.com/sites/rh -LoginName user@contoso.com -Group 'RH Members'"
    module: Microsoft.Online.SharePoint.PowerShell
    perms: 'Administrateur de la collection de sites'
    pitfall: 'Add-SPOUser exige un groupe existant du site ; vérifiez le nom exact avec Get-SPOSiteGroup.'
    doc: sharepoint-online/add-spouser
  - name: Restore-SPODeletedSite
    cat: sharepoint
    syn: Restore-SPODeletedSite -Identity <url>
    desc: Restaure un site supprimé (corbeille du tenant, 93 jours).
    ex:
      - 'Get-SPODeletedSite | Select Url,DeletionTime'
      - 'Restore-SPODeletedSite -Identity https://contoso.sharepoint.com/sites/rh'
    module: Microsoft.Online.SharePoint.PowerShell
    perms: 'SharePoint Administrator'
    pitfall: 'Un site lié à un groupe Microsoft 365 se restaure aussi via le groupe supprimé (Entra ID).'
    doc: sharepoint-online/restore-spodeletedsite

  # ---------------------------------------------------------------- Intune
  - name: Get-MgDeviceManagementManagedDevice
    cat: intune
    syn: Get-MgDeviceManagementManagedDevice [-Filter <odata>] [-All]
    desc: Liste les appareils gérés par Intune (conformité, système, dernier contact).
    ex:
      - 'Get-MgDeviceManagementManagedDevice -All -Filter "operatingSystem eq ''Windows''" | Select DeviceName,UserPrincipalName,ComplianceState,LastSyncDateTime'
    module: Microsoft.Graph.DeviceManagement
    perms: 'DeviceManagementManagedDevices.Read.All ; rôle Intune Administrator'
    pitfall: "LastSyncDateTime ancien n'est pas une panne : l'appareil est peut-être simplement éteint."
    doc: microsoft.graph.devicemanagement/get-mgdevicemanagementmanageddevice
  - name: Sync-MgDeviceManagementManagedDevice
    cat: intune
    syn: Sync-MgDeviceManagementManagedDevice -ManagedDeviceId <id>
    desc: Demande une synchronisation immédiate d'un appareil Intune.
    ex:
      - 'Sync-MgDeviceManagementManagedDevice -ManagedDeviceId $id'
    module: Microsoft.Graph.DeviceManagement
    perms: 'DeviceManagementManagedDevices.PrivilegedOperations.All'
    pitfall: "La commande n'est qu'une demande : l'appareil doit être en ligne pour la traiter."
    doc: microsoft.graph.devicemanagement/sync-mgdevicemanagementmanageddevice
  - name: Invoke-MgRetireDeviceManagementManagedDevice
    cat: intune
    syn: Invoke-MgRetireDeviceManagementManagedDevice -ManagedDeviceId <id>
    desc: Retire un appareil de la gestion (supprime les données d'entreprise, garde les données personnelles).
    ex:
      - 'Invoke-MgRetireDeviceManagementManagedDevice -ManagedDeviceId $id'
    module: Microsoft.Graph.DeviceManagement
    perms: 'DeviceManagementManagedDevices.PrivilegedOperations.All'
    pitfall: 'Ne confondez pas avec Wipe (réinitialisation complète, destructive).'
    doc: microsoft.graph.devicemanagement/invoke-mgretiredevicemanagementmanageddevice

  # ---------------------------------------------------------------- Defender et Purview
  - name: Get-QuarantineMessage
    cat: security
    syn: Get-QuarantineMessage -StartReceivedDate <date> -EndReceivedDate <date>
    desc: Liste les messages en quarantaine Defender for Office 365.
    ex:
      - 'Get-QuarantineMessage -RecipientAddress user@contoso.com -StartReceivedDate (Get-Date).AddDays(-7) -EndReceivedDate (Get-Date) | Select ReceivedTime,SenderAddress,Subject,Type'
    module: ExchangeOnlineManagement
    perms: 'Security Administrator ou Quarantine Administrator'
    pitfall: 'Libérez avec Release-QuarantineMessage -Identity <id> -ReleaseToAll ; le délai maximum par défaut est de 30 jours.'
    doc: exchange/get-quarantinemessage
  - name: Get-MalwareFilterPolicy
    cat: security
    syn: Get-MalwareFilterPolicy / Set-MalwareFilterPolicy
    desc: Consulte ou règle la stratégie anti-programmes malveillants.
    ex:
      - 'Get-MalwareFilterPolicy | Select Name,EnableFileFilter,FileTypes'
    module: ExchangeOnlineManagement
    perms: 'Security Administrator'
    pitfall: "La stratégie par défaut s'applique en dernier ; les stratégies Preset peuvent la surcharger."
    doc: exchange/get-malwarefilterpolicy
  - name: Get-SafeLinksPolicy
    cat: security
    syn: Get-SafeLinksPolicy
    desc: Stratégies Liens fiables de Defender for Office 365.
    ex:
      - 'Get-SafeLinksPolicy | Select Name,EnableSafeLinksForEmail,ScanUrls,DoNotRewriteUrls'
    module: ExchangeOnlineManagement
    perms: 'Security Administrator'
    pitfall: 'Nécessite une licence Defender for Office 365 (Plan 1 ou 2).'
    doc: exchange/get-safelinkspolicy
  - name: Search-UnifiedAuditLog
    cat: security
    syn: Search-UnifiedAuditLog -StartDate <date> -EndDate <date> -UserIds <upn> -Operations <liste>
    desc: Interroge le journal d'audit unifié (connexions, accès aux fichiers, règles de boîte).
    ex:
      - 'Search-UnifiedAuditLog -StartDate (Get-Date).AddDays(-7) -EndDate (Get-Date) -UserIds user@contoso.com -Operations New-InboxRule,Set-InboxRule -ResultSize 500'
    module: ExchangeOnlineManagement
    perms: 'Rôle « View-Only Audit Logs » ; audit activé sur le tenant'
    pitfall: 'Limité à 5000 résultats par appel : paginez avec -SessionId et -SessionCommand ReturnLargeSet.'
    doc: exchange/search-unifiedauditlog
  - name: New-ComplianceSearch
    cat: security
    syn: New-ComplianceSearch -Name <nom> -ExchangeLocation All -ContentMatchQuery <KQL>
    desc: Crée une recherche de contenu Purview eDiscovery (puis Start-ComplianceSearch).
    ex:
      - 'New-ComplianceSearch -Name ''Facture-X'' -ExchangeLocation All -ContentMatchQuery ''subject:"Facture X"'''
      - "Start-ComplianceSearch -Identity 'Facture-X'"
    module: ExchangeOnlineManagement (Connect-IPPSSession)
    perms: 'eDiscovery Manager'
    pitfall: "N'utilisez New-ComplianceSearchAction -Purge qu'après vérification des résultats : la suppression est définitive."
    doc: exchange/new-compliancesearch
  - name: Get-DlpCompliancePolicy
    cat: security
    syn: Get-DlpCompliancePolicy
    desc: Liste les stratégies de prévention contre la perte de données (DLP).
    ex:
      - 'Get-DlpCompliancePolicy | Select Name,Mode,Enabled'
    module: ExchangeOnlineManagement (Connect-IPPSSession)
    perms: 'Compliance Administrator'
    pitfall: 'Une stratégie en mode TestWithNotifications ne bloque rien.'
    doc: exchange/get-dlpcompliancepolicy

  # ---------------------------------------------------------------- MSOnline / AzureAD (déprécié)
  - name: Connect-MsolService
    cat: legacy
    syn: Connect-MsolService
    desc: Connexion du module MSOnline, déprécié. Remplacer par Connect-MgGraph.
    alias: [MSOnline, Get-MsolUser, Set-MsolUser]
    ex:
      - '# Ancien : Connect-MsolService ; Get-MsolUser -UserPrincipalName user@contoso.com'
      - "# Nouveau : Connect-MgGraph -Scopes 'User.Read.All' ; Get-MgUser -UserId user@contoso.com"
    module: MSOnline (déprécié)
    perms: 'Rôle Global Reader ou supérieur'
    pitfall: 'Le module cesse de fonctionner avec la fin de ses API ; ne bâtissez plus de scripts dessus.'
    url: https://learn.microsoft.com/powershell/azure/active-directory/overview
  - name: Connect-AzureAD
    cat: legacy
    syn: Connect-AzureAD
    desc: Connexion du module AzureAD, déprécié. Remplacer par Connect-MgGraph.
    alias: [AzureAD, Get-AzureADUser, Get-AzureADGroup]
    ex:
      - '# Ancien : Get-AzureADGroupMember -ObjectId $id'
      - '# Nouveau : Get-MgGroupMember -GroupId $id'
    module: AzureAD (déprécié)
    perms: 'Rôle Global Reader ou supérieur'
    pitfall: "Les noms d'objets changent (ObjectId devient Id) et il faut redemander les scopes."
    url: https://learn.microsoft.com/powershell/microsoftgraph/azuread-msoline-cmdlet-map
  - name: Set-MsolUserPassword
    cat: legacy
    syn: Set-MsolUserPassword -UserPrincipalName <upn> -NewPassword <mdp>
    desc: 'Réinitialise un mot de passe (MSOnline, déprécié). Équivalent Graph : Update-MgUser avec -PasswordProfile.'
    ex:
      - "Update-MgUser -UserId user@contoso.com -PasswordProfile @{ Password = '<mot de passe>'; ForceChangePasswordNextSignIn = $true }"
    module: Microsoft.Graph.Users
    perms: 'User.ReadWrite.All ; rôle Password / User Administrator'
    pitfall: 'Un compte synchronisé depuis AD sur site se réinitialise côté AD, pas dans Entra ID.'
    doc: microsoft.graph.users/update-mguser
