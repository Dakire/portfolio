entries:
  - name: Acer
    cat: laptops
    syn: 'BIOS/UEFI : F2 (Suppr sur certains PC fixes) | Menu de démarrage : F12'
    desc: Aspire, Swift, Nitro, Predator, TravelMate, Extensa
    pitfall: Sur certains modèles, il faut d'abord activer « F12 Boot Menu » dans le BIOS
  - name: 'ASUS : VivoBook'
    cat: laptops
    syn: 'BIOS/UEFI : F2 (maintenue tout en appuyant sur Alimentation) | Menu de démarrage : Échap maintenue tout en appuyant sur Alimentation, relâchée quand le menu apparaît'
