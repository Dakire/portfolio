# Touches BIOS/UEFI et boot menu : source éditable (issue des anciens articles du blog). Après modification : `pnpm --filter @grichard/web reference:build`.
meta:
  id: bios-uefi
  order: 8
  optionalUrl: true
  topAfter: true
  searchLabel: Rechercher une marque ou un modèle
  placeholder: ex. thinkpad, dell, msi
  topTitle: À savoir
  lang: fr
  title: 'Touches BIOS/UEFI et boot menu par marque | Guillaume Richard'
  h1: Touches BIOS/UEFI et boot menu
  description: 'Les touches pour entrer dans le BIOS/UEFI et ouvrir le menu de démarrage : Dell, HP, Lenovo, ASUS, Acer, MSI, Surface, Mac. Recherche par marque.'
  intro: 'La touche pour entrer dans le BIOS/UEFI ou ouvrir le menu de démarrage change selon le constructeur, et parfois selon la série. Tapez une marque ou un modèle : par exemple thinkpad, dell ou rog.'
  card: 'Les touches pour entrer dans le BIOS/UEFI ou ouvrir le menu de démarrage, par constructeur : Dell, HP, Lenovo, ASUS, Acer, MSI, Surface, Mac.'
  notice: "Ces touches ont été recoupées avec des sources en ligne (dont les pages d'assistance d'ASUS et de Samsung, Dell, Lenovo, Acer, Microsoft, Apple, LG, Huawei, Framework et Intel). Elles peuvent varier selon le modèle exact et l'année : en cas d'échec, consultez le manuel ou la page de support du modèle. Une mauvaise modification dans le BIOS peut empêcher le PC de démarrer : notez les réglages d'origine. Sur un PC géré par une entreprise, l'accès peut être protégé par un mot de passe : ne le contournez pas sans autorisation et adressez-vous à votre service informatique."
  top:
    - title: 'Menu de démarrage ou BIOS : lequel choisir ?'
      note: "Le menu de démarrage (boot menu) sert à choisir une seule fois le périphérique de démarrage : une clé USB d'installation, un outil de diagnostic. C'est le plus simple pour réinstaller un système. Le BIOS/UEFI donne accès aux réglages permanents : ordre de démarrage, Secure Boot, TPM, virtualisation, mode SATA. C'est là qu'on active par exemple le TPM 2.0 requis par Windows 11."
      items: []
    - title: Entrer dans l'UEFI depuis le système
      note: "Sur un PC qui démarre en UEFI, on peut demander au système de redémarrer directement dans le firmware, sans deviner la touche. Windows 11 : Paramètres > Système > Récupération > Démarrage avancé > Redémarrer maintenant, puis Dépannage > Options avancées > Paramètres du micrologiciel UEFI. Windows 10 : Paramètres > Mise à jour et sécurité > Récupération > Démarrage avancé, puis la même suite d'options. En ligne de commande :"
      items:
        - code: shutdown /r /fw /t 0
          note: Windows, dans une invite de commandes en administrateur.
        - code: systemctl reboot --firmware-setup
          note: Linux (systemd).
    - title: Si la touche ne répond pas
      note: "Les PC récents démarrent si vite que la fenêtre pour presser la touche est très courte. Tapez la touche en rafale dès l'allumage au lieu de la maintenir. Éteignez complètement le PC plutôt que de le redémarrer (avec le démarrage rapide de Windows, un arrêt n'est pas complet : Maj + clic sur Arrêter force un arrêt complet). Sur un portable, essayez avec Fn (Fn + F2). Utilisez un clavier filaire branché directement sur le PC."
      items: []
