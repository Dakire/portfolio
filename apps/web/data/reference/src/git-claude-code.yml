# Git, GitHub et Claude Code : source éditable. Après modification : `pnpm --filter @grichard/web reference:build`.
meta:
  id: git-claude-code
  order: 7
  title: 'Git, GitHub et Claude Code : commandes, gh, commandes slash et raccourcis | Guillaume Richard'
  h1: Git, GitHub et Claude Code
  description: 'Aide-mémoire Git (commit, branch, rebase, reset, stash), GitHub CLI (gh pr, gh run) et Claude Code (commandes slash, raccourcis clavier, mémoire CLAUDE.md), avec exemples à copier et pièges.'
  intro: 'Les commandes Git du quotidien, la CLI GitHub (gh) et les commandes slash et raccourcis de Claude Code.'
  card: 'Git, GitHub CLI (gh) et Claude Code : commandes, annulations sûres, commandes slash, raccourcis.'
  notice: "Les commandes qui réécrivent l'historique (reset --hard, rebase, push --force) peuvent faire perdre du travail : préférez revert et --force-with-lease. Les commandes slash de Claude Code évoluent : /help liste celles de votre version."
  docs:
    label: Documentation Git
    url: https://git-scm.com/docs
  fields:
    - { key: pitfall, label: Piège courant }
    - { key: equiv, label: Voir aussi }
  cats:
    - { id: basics, label: 'Git : bases' }
    - { id: branches, label: 'Git : branches' }
    - { id: undo, label: 'Git : annuler' }
    - { id: remote, label: 'Git : dépôts distants' }
    - { id: gh, label: GitHub CLI }
    - { id: claude-slash, label: 'Claude Code : commandes slash' }
    - { id: claude-keys, label: 'Claude Code : raccourcis et CLI' }
entries:
  - name: git status · git diff · git log
    cat: basics
    syn: 'git status -sb | git diff [--staged] | git log --oneline --graph'
    desc: 'État du dépôt, modifications et historique.'
    ex:
      - 'git status -sb'
      - 'git diff --staged'
      - 'git log --oneline --graph --decorate -20'
      - 'git log -p -- chemin/fichier'
    pitfall: "git diff seul ignore ce qui est déjà ajouté à l'index : ajoutez --staged."
    url: https://git-scm.com/docs/git-log
  - name: git add · git commit
    cat: basics
    syn: 'git add <fichiers> | git commit -m <message>'
    desc: 'Prépare puis enregistre un changement.'
    ex:
      - 'git add -p'
      - 'git commit -m "fix(web): corrige le lien du pied de page"'
      - 'git commit --amend --no-edit'
    pitfall: 'git add -p permet de choisir les morceaux à valider ; --amend réécrit le dernier commit, à éviter après un push.'
    url: https://git-scm.com/docs/git-commit
  - name: git clone · git init
    cat: basics
    syn: 'git clone <url> [dossier] | git init'
    desc: 'Récupère un dépôt ou en crée un.'
    ex:
      - 'git clone https://github.com/utilisateur/depot.git'
      - 'git clone --depth 1 https://github.com/utilisateur/depot.git'
      - 'git init -b main'
    pitfall: "--depth 1 ne récupère que le dernier état : pratique pour un build, pas pour travailler sur l'historique."
    url: https://git-scm.com/docs/git-clone
  - name: git stash
    cat: basics
    syn: 'git stash [push -m <msg>] | git stash pop | git stash list'
    desc: 'Met de côté les modifications en cours.'
    ex:
      - 'git stash push -m "brouillon" -u'
      - 'git stash list'
      - 'git stash pop'
    pitfall: '-u inclut les fichiers non suivis ; pop applique et supprime, apply applique et conserve.'
    url: https://git-scm.com/docs/git-stash
  - name: git blame · git bisect
    cat: basics
    syn: 'git blame <fichier> | git bisect start / good / bad'
    desc: 'Retrouve qui a modifié une ligne, ou le commit qui a introduit un bug.'
    ex:
      - 'git blame -L 10,30 src/app.ts'
      - 'git bisect start; git bisect bad; git bisect good v1.2.0'
      - 'git bisect reset'
    pitfall: 'Terminez toujours par git bisect reset pour revenir sur votre branche.'
    url: https://git-scm.com/docs/git-bisect
  - name: git switch · git branch
    cat: branches
    syn: 'git switch [-c] <branche> | git branch [-d|-D] <branche>'
    desc: 'Change, crée, liste et supprime des branches (remplace git checkout pour cet usage).'
    ex:
      - 'git switch -c feat/recherche'
      - 'git branch -vv'
      - 'git branch -d feat/recherche'
    alias: [git checkout]
    pitfall: '-D supprime même une branche non fusionnée : vérifiez avec git branch --no-merged.'
    url: https://git-scm.com/docs/git-switch
  - name: git merge · git rebase
    cat: branches
    syn: 'git merge <branche> | git rebase <base>'
    desc: "Intègre les commits d'une branche dans une autre."
    ex:
      - 'git merge --no-ff feat/recherche'
      - 'git rebase origin/main'
      - 'git rebase --abort'
    pitfall: 'Ne rebasez pas une branche déjà poussée et partagée. En cas de conflit : corriger, git add, git rebase --continue.'
    url: https://git-scm.com/docs/git-rebase
  - name: git cherry-pick
    cat: branches
    syn: 'git cherry-pick <commit>'
    desc: 'Applique un commit précis sur la branche courante.'
    ex:
      - 'git cherry-pick a1b2c3d'
      - 'git cherry-pick -x a1b2c3d'
    pitfall: "-x ajoute la référence du commit d'origine dans le message."
    url: https://git-scm.com/docs/git-cherry-pick
  - name: git worktree
    cat: branches
    syn: 'git worktree add <dossier> <branche>'
    desc: 'Travaille sur plusieurs branches en parallèle dans des dossiers distincts, sans stash.'
    ex:
      - 'git worktree add ../hotfix hotfix/urgence'
      - 'git worktree list'
      - 'git worktree remove ../hotfix'
    url: https://git-scm.com/docs/git-worktree
  - name: git restore
    cat: undo
    syn: 'git restore [--staged] <fichier>'
    desc: "Annule les modifications d'un fichier (ou le retire de l'index)."
    ex:
      - 'git restore src/app.ts'
      - 'git restore --staged src/app.ts'
      - 'git restore --source=HEAD~2 src/app.ts'
    pitfall: 'Sans --staged, les modifications non validées sont perdues définitivement.'
    url: https://git-scm.com/docs/git-restore
  - name: git revert
    cat: undo
    syn: 'git revert <commit>'
    desc: "Annule un commit en en créant un nouveau, sans réécrire l'historique (sûr après un push)."
    ex:
      - 'git revert HEAD'
      - 'git revert -m 1 <commit-de-fusion>'
    pitfall: 'Pour annuler un commit de fusion, il faut préciser le parent avec -m 1.'
    url: https://git-scm.com/docs/git-revert
  - name: git reset
    cat: undo
    syn: 'git reset [--soft|--mixed|--hard] <commit>'
    desc: 'Déplace la branche courante vers un autre commit.'
    ex:
      - 'git reset --soft HEAD~1'
      - 'git reset HEAD~1'
      - 'git reset --hard origin/main'
    pitfall: '--hard supprime les modifications locales. Retrouvez un état perdu avec git reflog.'
    url: https://git-scm.com/docs/git-reset
  - name: git reflog
    cat: undo
    syn: 'git reflog'
    desc: 'Journal des déplacements de HEAD : permet de retrouver un commit « perdu ».'
    ex:
      - 'git reflog -20'
      - 'git switch -c recuperation HEAD@{3}'
    pitfall: 'Le reflog est local et expire (90 jours par défaut).'
    url: https://git-scm.com/docs/git-reflog
  - name: git clean
    cat: undo
    syn: 'git clean -nd | git clean -fd'
    desc: 'Supprime les fichiers non suivis.'
    ex:
      - 'git clean -nd'
      - 'git clean -fd'
    pitfall: 'Lancez toujours -n (simulation) avant -f : les fichiers supprimés ne vont pas à la corbeille.'
    url: https://git-scm.com/docs/git-clean
  - name: git fetch · git pull · git push
    cat: remote
    syn: 'git fetch [--prune] | git pull --rebase | git push [-u origin <branche>]'
    desc: 'Synchronise avec le dépôt distant.'
    ex:
      - 'git fetch --prune'
      - 'git pull --rebase'
      - 'git push -u origin feat/recherche'
      - 'git push --force-with-lease'
    pitfall: "Préférez --force-with-lease à --force : il refuse d'écraser des commits que vous n'avez pas vus."
    url: https://git-scm.com/docs/git-push
  - name: git remote · git config
    cat: remote
    syn: 'git remote -v | git config --global user.name|user.email'
    desc: 'Dépôts distants et configuration.'
    ex:
      - 'git remote -v'
      - 'git remote set-url origin git@github.com:utilisateur/depot.git'
      - 'git config --global user.name "Prénom Nom"'
      - 'git config --global pull.rebase true'
    pitfall: 'Une config sans --global ne vaut que pour le dépôt courant.'
    url: https://git-scm.com/docs/git-config
  - name: git tag
    cat: remote
    syn: 'git tag [-a] <nom> | git push origin <nom>'
    desc: 'Marque une version.'
    ex:
      - 'git tag -a v1.2.0 -m "Version 1.2.0"'
      - 'git push origin v1.2.0'
      - 'git tag -d v1.2.0 && git push origin :refs/tags/v1.2.0'
    pitfall: 'git push ne pousse pas les tags : poussez-les explicitement ou avec --tags.'
    url: https://git-scm.com/docs/git-tag
  - name: gh auth · repo
    cat: gh
    syn: 'gh auth login | gh repo clone|create|view'
    desc: 'Authentification et gestion des dépôts GitHub en ligne de commande.'
    ex:
      - 'gh auth login'
      - 'gh repo clone utilisateur/depot'
      - 'gh repo view --web'
    url: https://cli.github.com/manual/gh_repo
  - name: gh pr
    cat: gh
    syn: 'gh pr create|list|view|checkout|merge'
    desc: 'Crée et gère les pull requests.'
    ex:
      - 'gh pr create --fill'
      - 'gh pr list --state open'
      - 'gh pr checkout 123'
      - 'gh pr merge 123 --squash --delete-branch'
    pitfall: 'gh pr create --fill reprend le titre et le message du dernier commit.'
    url: https://cli.github.com/manual/gh_pr
  - name: gh run · workflow
    cat: gh
    syn: 'gh run list | gh run view <id> --log-failed | gh workflow run <nom>'
    desc: 'Suit et relance les workflows GitHub Actions.'
    ex:
      - 'gh run list --limit 5'
      - 'gh run watch'
      - 'gh run view --log-failed'
      - 'gh workflow run deploy.yml -f ref=main'
    url: https://cli.github.com/manual/gh_run
  - name: gh issue · api
    cat: gh
    syn: 'gh issue create|list | gh api <route>'
    desc: "Tickets et appels directs à l'API GitHub."
    ex:
      - 'gh issue create --title "Bug" --body "Description"'
      - 'gh issue list --assignee @me'
      - 'gh api repos/{owner}/{repo}/releases/latest --jq .tag_name'
    url: https://cli.github.com/manual/gh_api
  - name: /help · /clear · /compact
    cat: claude-slash
    syn: '/help | /clear | /compact [consignes]'
    desc: 'Aide, nouvelle conversation, et résumé du contexte quand il devient long.'
    ex:
      - '/help'
      - '/clear'
      - "/compact conserve les décisions d'architecture"
    pitfall: '/compact résume la conversation pour libérer de la place ; /clear repart de zéro (le CLAUDE.md est rechargé).'
    url: https://docs.claude.com/en/docs/claude-code/slash-commands
  - name: /init · /memory
    cat: claude-slash
    syn: '/init | /memory'
    desc: 'Crée un CLAUDE.md pour le projet ; modifie les fichiers de mémoire.'
    ex:
      - '/init'
      - '/memory'
    pitfall: 'CLAUDE.md est lu à chaque session : gardez-le court et ne mettez aucun secret (le fichier est versionné).'
    url: https://docs.claude.com/en/docs/claude-code/memory
  - name: /model · /config · /status
    cat: claude-slash
    syn: '/model [modèle] | /config | /status'
    desc: "Change de modèle, ouvre les réglages, affiche l'état de la session."
    ex:
      - '/model'
      - '/config'
      - '/status'
    url: https://docs.claude.com/en/docs/claude-code/slash-commands
  - name: /permissions · /hooks · /mcp
    cat: claude-slash
    syn: '/permissions | /hooks | /mcp'
    desc: "Règles d'autorisation des outils, hooks d'événements et serveurs MCP."
    ex:
      - '/permissions'
      - '/hooks'
      - '/mcp'
    pitfall: "Les règles de permission s'enregistrent dans .claude/settings.json (projet) ou ~/.claude/settings.json (utilisateur)."
    url: https://docs.claude.com/en/docs/claude-code/settings
  - name: /review · /cost · /resume
    cat: claude-slash
    syn: '/review | /cost | /resume'
    desc: "Revue de code, consommation de jetons, reprise d'une conversation précédente."
    ex:
      - '/review'
      - '/cost'
      - '/resume'
    url: https://docs.claude.com/en/docs/claude-code/slash-commands
  - name: 'Raccourcis : Échap · Maj+Tab · Ctrl+C · Ctrl+R'
    cat: claude-keys
    syn: 'Échap | Maj+Tab | Ctrl+C | Ctrl+R'
    desc: "Échap interrompt l'action en cours (Échap deux fois : revenir en arrière dans la conversation). Maj+Tab change le mode d'autorisation (dont le mode plan). Ctrl+C annule. Ctrl+R cherche dans l'historique."
    tags: [clavier, plan, mode]
    pitfall: 'Les raccourcis dépendent du terminal : /help et la documentation donnent la liste de votre version.'
    url: https://docs.claude.com/en/docs/claude-code/interactive-mode
  - name: 'Saisie : @ · ! · #'
    cat: claude-keys
    syn: '@fichier | !commande | # note'
    desc: '@ référence un fichier ou dossier, ! exécute une commande shell directement, # ajoute une note à la mémoire.'
    ex:
      - 'Explique @src/app.ts'
      - '! git status'
      - '# Toujours lancer pnpm verify avant un push'
    url: https://docs.claude.com/en/docs/claude-code/interactive-mode
  - name: 'claude (CLI) : -p · --continue · --resume'
    cat: claude-keys
    syn: 'claude [-p <invite>] [--continue] [--resume] [--model <m>]'
    desc: 'Lance Claude Code ; -p exécute une invite unique et affiche le résultat (mode non interactif).'
    ex:
      - 'claude'
      - 'claude -p "Résume les changements de la dernière semaine"'
      - 'claude --continue'
      - 'claude --resume'
      - 'git diff | claude -p "Relis ce diff"'
    pitfall: "En mode -p, aucune confirmation n'est demandée : limitez les outils autorisés (--allowedTools)."
    url: https://docs.claude.com/en/docs/claude-code/cli-reference
  - name: 'Fichiers : CLAUDE.md · .claude/settings.json · commandes personnalisées'
    cat: claude-keys
    syn: 'CLAUDE.md | .claude/settings.json | .claude/commands/<nom>.md'
    desc: 'CLAUDE.md contient les consignes du projet ; settings.json les permissions et hooks ; un fichier Markdown dans .claude/commands/ devient une commande slash personnalisée.'
    ex:
      - '.claude/commands/verifier.md  ->  /verifier'
    pitfall: 'settings.local.json est pour vos réglages personnels : ne le versionnez pas.'
    url: https://docs.claude.com/en/docs/claude-code/slash-commands
