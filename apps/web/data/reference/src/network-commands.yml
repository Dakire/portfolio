# Networking and troubleshooting (English) : source éditable, traduction de reseau.yml. Après modification : `pnpm --filter @grichard/web reference:build`.
meta:
  id: network-commands
  order: 5
  title: 'Network commands: nslookup, dig, ping, tcpdump'
  h1: Networking and troubleshooting
  description: 'Networking cheatsheet for technicians: nslookup, dig, ping, tracert, ss, tcpdump, curl, nmap and common ports, on Windows and Linux.'
  intro: Network troubleshooting commands (DNS, routing, ports, captures) on Windows and Linux, plus the most common TCP/UDP ports.
  card: nslookup, dig, tracert, ss, tcpdump, curl, nmap and common TCP/UDP ports, on Windows and Linux.
  notice: Only scan or capture networks you are authorized to test. A capture can contain passwords and personal data.
  docs:
    label: Networking documentation (Microsoft Learn)
    url: https://learn.microsoft.com/windows-server/networking/technologies/
  fields:
    - key: equiv
      label: Equivalent
    - key: pitfall
      label: Common pitfall
  cats:
    - id: dns
      label: DNS
    - id: connectivity
      label: Connectivity and routing
    - id: ports
      label: Ports and sockets
    - id: capture
      label: Capture and analysis
    - id: http
      label: HTTP and TLS
    - id: portlist
      label: Common ports
  lang: en
entries:
  - name: nslookup
    cat: dns
    syn: nslookup [-type=<type>] <name> [server]
    desc: Queries a DNS server (Windows and Linux).
    ex:
      - nslookup -type=MX contoso.com 1.1.1.1
      - nslookup -type=TXT _dmarc.contoso.com
      - nslookup 8.8.8.8
    equiv: dig, Resolve-DnsName
    pitfall: nslookup uses the machine's DNS search list; end the name with a dot to avoid appended suffixes.
    url: https://learn.microsoft.com/windows-server/administration/windows-commands/nslookup
  - name: dig
    cat: dns
    syn: dig [@server] <name> [type] [+short] [+trace]
    desc: Detailed DNS query (Linux, macOS, Windows via BIND).
    ex:
      - dig contoso.com MX +short
      - dig @1.1.1.1 contoso.com TXT
      - dig +trace contoso.com
      - dig -x 8.8.8.8 +short
    equiv: nslookup, Resolve-DnsName
    pitfall: '+trace starts from the root servers and ignores your cache: useful for spotting a wrong delegation.'
    url: https://linux.die.net/man/1/dig
  - name: Resolve-DnsName
    cat: dns
    syn: Resolve-DnsName <name> [-Type <type>] [-Server <ip>] [-DnsOnly]
    desc: DNS resolution in PowerShell, output as objects.
    ex:
      - Resolve-DnsName contoso.com -Type MX
      - Resolve-DnsName contoso.com -Server 8.8.8.8 -DnsOnly
    equiv: nslookup, dig
    pitfall: Without -DnsOnly, resolution also goes through the local cache, LLMNR and NetBIOS.
    url: https://learn.microsoft.com/powershell/module/dnsclient/resolve-dnsname
  - name: ipconfig /flushdns · resolvectl flush-caches
    cat: dns
    syn: ipconfig /flushdns | resolvectl flush-caches
    desc: Clears the local DNS cache after a record change.
    ex:
      - ipconfig /flushdns
      - ipconfig /displaydns
      - sudo resolvectl flush-caches
      - sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder
    alias:
      - Clear-DnsClientCache
    equiv: Windows, Linux (systemd-resolved), macOS
    pitfall: The browser cache and the router's or ISP's resolver cache are not cleared by this command.
    url: https://learn.microsoft.com/windows-server/administration/windows-commands/ipconfig
  - name: ping
    cat: connectivity
    syn: ping [-n|-c <count>] <host>
    desc: Tests whether a host is reachable over ICMP.
    ex:
      - 'ping -n 4 8.8.8.8      # Windows'
      - 'ping -c 4 8.8.8.8      # Linux'
      - 'ping -t 192.168.1.1    # Windows : continu, Ctrl+C pour arrêter'
      - 'ping -f -l 1472 8.8.8.8  # Windows : test de MTU (sans fragmentation)'
    equiv: Test-NetConnection
    pitfall: 'Many firewalls block ICMP: a ping with no reply does not prove the host is down.'
    url: https://learn.microsoft.com/windows-server/administration/windows-commands/ping
  - name: tracert · traceroute · mtr
    cat: connectivity
    syn: tracert <host> | traceroute <host> | mtr <host>
    desc: Shows the routers crossed on the way to a destination.
    ex:
      - tracert -d contoso.com
      - traceroute -n contoso.com
      - mtr -rwc 50 contoso.com
      - pathping contoso.com
    equiv: Test-NetConnection -TraceRoute
    pitfall: 'Stars (* * *) do not always mean an outage: some routers do not answer probes.'
    url: https://learn.microsoft.com/windows-server/administration/windows-commands/tracert
  - name: ip a · ip r · ip link
    cat: connectivity
    syn: ip addr | ip route | ip link
    desc: Addresses, routes and interfaces on Linux (replaces ifconfig and route).
    ex:
      - ip -br a
      - ip route
      - ip route get 8.8.8.8
      - sudo ip link set eth0 up
    alias:
      - ifconfig
      - route
      - netstat
    equiv: ipconfig /all, route print, Get-NetIPConfiguration
    pitfall: ifconfig and netstat are obsolete and often missing on recent distributions.
    url: https://man7.org/linux/man-pages/man8/ip.8.html
  - name: route print · Get-NetRoute
    cat: connectivity
    syn: route print | Get-NetRoute
    desc: Windows routing table.
    ex:
      - route print -4
      - Get-NetRoute -AddressFamily IPv4 | Sort RouteMetric | Select DestinationPrefix,NextHop,InterfaceAlias,RouteMetric
    equiv: ip route
    pitfall: route add without -p disappears at reboot.
    url: https://learn.microsoft.com/windows-server/administration/windows-commands/route_ws2008
  - name: arp
    cat: connectivity
    syn: arp -a
    desc: IP address to MAC address mapping table of the local segment.
    ex:
      - arp -a
      - ip neigh
    equiv: ip neigh, Get-NetNeighbor
    pitfall: A duplicate or changing entry for the same IP signals an address conflict.
    url: https://learn.microsoft.com/windows-server/administration/windows-commands/arp
  - name: ss
    cat: ports
    syn: ss -tulpn
    desc: Listening sockets and connections (replaces netstat on Linux).
    ex:
      - sudo ss -tulpn
      - ss -tn state established
      - ss -tn dst :443
    alias:
      - netstat
    equiv: netstat -ano, Get-NetTCPConnection
    pitfall: Without sudo, the owning process name is not shown.
    url: https://man7.org/linux/man-pages/man8/ss.8.html
  - name: netstat -ano
    cat: ports
    syn: netstat -ano | findstr :<port>
    desc: Windows TCP/UDP connections with the process ID (PID).
    ex:
      - netstat -ano | findstr LISTENING
      - netstat -ano | findstr :443
      - tasklist /fi "pid eq 1234"
    equiv: ss -tulpn, Get-NetTCPConnection
    pitfall: A port in TIME_WAIT is normal after a closed connection; it goes away on its own.
    url: https://learn.microsoft.com/windows-server/administration/windows-commands/netstat
  - name: Test-NetConnection · nc
    cat: ports
    syn: Test-NetConnection <host> -Port <port> | nc -zv <host> <port>
    desc: Checks that a TCP port is reachable.
    ex:
      - Test-NetConnection smtp.office365.com -Port 587
      - nc -zv smtp.office365.com 587
      - nc -zvu 10.0.0.5 514
    equiv: telnet, nmap -p
    pitfall: A 'filtered' answer or a timeout often points to a firewall, not a stopped service.
    url: https://learn.microsoft.com/powershell/module/nettcpip/test-netconnection
  - name: nmap
    cat: ports
    syn: nmap [-sS|-sT|-sU] [-p <ports>] [-sV] <target>
    desc: Scans a network for hosts and open ports.
    ex:
      - nmap -sn 192.168.1.0/24
      - nmap -p 22,80,443 -sV 192.168.1.10
      - nmap -sU -p 53,123,161 192.168.1.1
    pitfall: Only scan with authorization. -sS needs administrator rights.
    url: https://nmap.org/book/man.html
  - name: tcpdump
    cat: capture
    syn: tcpdump -i <interface> [filter] [-w file.pcap]
    desc: Captures traffic on the command line.
    ex:
      - sudo tcpdump -i eth0 -nn host 10.0.0.5 and port 443
      - sudo tcpdump -i any -nn udp port 53 -c 50
      - sudo tcpdump -i eth0 -w capture.pcap
    equiv: Wireshark, pktmon
    pitfall: Use -nn to skip name and port resolution (faster, more readable); capturing requires root.
    url: https://www.tcpdump.org/manpages/tcpdump.1.html
  - name: pktmon
    cat: capture
    syn: pktmon start --capture ; pktmon stop ; pktmon etl2pcap
    desc: Network capture built into Windows 10/11, no third-party software.
    ex:
      - pktmon filter add -p 443
      - pktmon start --capture --comp nics
      - pktmon stop
      - pktmon etl2pcap PktMon.etl --out capture.pcapng
    equiv: tcpdump, Wireshark
    pitfall: Elevated prompt required; convert the result to pcapng to open it in Wireshark.
    url: https://learn.microsoft.com/windows-server/networking/technologies/pktmon/pktmon
  - name: curl
    cat: http
    syn: curl [-I] [-v] [-L] [--resolve h:p:ip] <url>
    desc: 'Tests a URL: headers, redirects, response time, certificate.'
    ex:
      - curl -I https://contoso.com
      - curl -vL https://contoso.com -o /dev/null
      - curl --resolve contoso.com:443:203.0.113.10 https://contoso.com -I
      - curl -w '%{http_code} %{time_total}s\n' -o /dev/null -s https://contoso.com
    alias:
      - Invoke-WebRequest
      - iwr
    equiv: Invoke-WebRequest
    pitfall: 'In PowerShell 5.1, curl is an alias for Invoke-WebRequest: call curl.exe.'
    url: https://curl.se/docs/manpage.html
  - name: openssl s_client
    cat: http
    syn: openssl s_client -connect <host>:<port> -servername <name>
    desc: Shows a server's certificate and TLS chain.
    ex:
      - openssl s_client -connect contoso.com:443 -servername contoso.com </dev/null | openssl x509 -noout -dates -subject -issuer
      - openssl s_client -starttls smtp -connect smtp.contoso.com:587
    pitfall: Forget -servername and you get the server's default certificate, not the one for the requested site.
    url: https://docs.openssl.org/master/man1/openssl-s_client/
  - name: Ports 20/21 · 22 · 23 · 25 (FTP, SSH, Telnet, SMTP)
    cat: portlist
    syn: FTP 21 (data 20) · SSH/SFTP 22 · Telnet 23 · SMTP 25
    desc: SFTP uses port 22 (SSH); FTPS and FTP are separate protocols. Port 25 is used for relaying between mail servers and is often blocked by ISPs.
    tags:
      - tcp
      - ftp
      - ssh
      - sftp
      - telnet
      - smtp
    equiv: Test-NetConnection <hôte> -Port 22
    pitfall: 'Telnet and FTP send in clear text: prefer SSH/SFTP.'
    url: https://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xhtml
  - name: Ports 53 · 67/68 · 123 (DNS, DHCP, NTP)
    cat: portlist
    syn: DNS 53 TCP/UDP · DHCP 67 (server) / 68 (client) UDP · NTP 123 UDP
    desc: DNS switches to TCP for large responses and zone transfers. DHCP and NTP use UDP.
    tags:
      - udp
      - dns
      - dhcp
      - ntp
    pitfall: Blocking DNS over TCP causes sporadic failures on large responses (DNSSEC, long TXT records).
    url: https://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xhtml
  - name: Ports 80 · 443 · 8080 · 8443 (HTTP, HTTPS)
    cat: portlist
    syn: 'HTTP 80 · HTTPS 443 (HTTP/3: UDP 443) · alternates 8080, 8443'
    desc: 'HTTP/3 (QUIC) uses UDP 443: a firewall that does not allow it forces a fallback to HTTPS/TCP.'
    tags:
      - web
      - tcp
      - udp
    pitfall: Ports 8080 and 8443 are conventional, not standardized.
    url: https://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xhtml
  - name: Ports 110 · 143 · 465 · 587 · 993 · 995 (email)
    cat: portlist
    syn: POP3 110/995 · IMAP 143/993 · SMTPS 465 · SMTP submission 587 (STARTTLS)
    desc: Ports 995, 993 and 465 use implicit TLS; 587 starts in clear text, then upgrades with STARTTLS.
    tags:
      - mail
      - pop3
      - imap
      - smtp
      - tls
    pitfall: Microsoft 365 accepts authenticated sending on 587 with STARTTLS (smtp.office365.com).
    url: https://learn.microsoft.com/exchange/mail-flow-best-practices/how-to-set-up-a-multifunction-device-or-application-to-send-email-using-microsoft-365-or-office-365
  - name: Ports 88 · 135 · 389 · 445 · 636 · 3268 (Active Directory)
    cat: portlist
    syn: Kerberos 88 · RPC 135 · LDAP 389 · SMB 445 · LDAPS 636 · global catalog 3268/3269
    desc: Main ports between workstations, servers and domain controllers; RPC also uses a dynamic range (49152-65535).
    tags:
      - ad
      - ldap
      - kerberos
      - smb
      - rpc
    pitfall: SMB 445 must never be exposed to the internet.
    url: https://learn.microsoft.com/troubleshoot/windows-server/networking/service-overview-and-network-port-requirements
  - name: Ports 3389 · 5985/5986 · 5900 (remote access)
    cat: portlist
    syn: RDP 3389 TCP/UDP · WinRM 5985 (HTTP) / 5986 (HTTPS) · VNC 5900
    desc: RDP and WinRM are frequent brute-force targets when exposed.
    tags:
      - rdp
      - winrm
      - vnc
      - tcp
    pitfall: Go through a VPN or a gateway (RD Gateway, Bastion) instead of opening 3389 to the internet.
    url: https://learn.microsoft.com/windows-server/remote/remote-desktop-services/clients/remote-desktop-allow-access
  - name: Ports 161/162 · 514 · 1812/1813 (monitoring)
    cat: portlist
    syn: SNMP 161 / traps 162 UDP · Syslog 514 UDP (6514 TLS) · RADIUS 1812/1813 UDP
    desc: Common ports for monitoring and network authentication.
    tags:
      - snmp
      - syslog
      - radius
      - udp
    pitfall: 'SNMP v1/v2c sends the community string in clear text: prefer SNMPv3.'
    url: https://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xhtml
  - name: Ports 1433 · 3306 · 5432 · 6379 (databases)
    cat: portlist
    syn: SQL Server 1433 · MySQL/MariaDB 3306 · PostgreSQL 5432 · Redis 6379
    desc: 'Common database ports: never expose them directly to the internet.'
    tags:
      - sql
      - mysql
      - postgresql
      - redis
      - tcp
    pitfall: Restrict access by firewall to the application servers only.
    url: https://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xhtml
