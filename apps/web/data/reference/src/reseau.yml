# Réseau et diagnostic : source éditable. Après modification : `pnpm --filter @grichard/web reference:build`.
meta:
  id: reseau
  order: 5
  title: 'Réseau : cheatsheet nslookup, dig, tcpdump | Guillaume Richard'
  h1: Réseau et diagnostic
  description: 'Cheatsheet réseau pour techniciens : nslookup, dig, ping, tracert, ss, tcpdump, curl, nmap et ports courants, sous Windows et Linux.'
  intro: 'Les commandes de diagnostic réseau (DNS, routage, ports, captures) sous Windows et Linux, plus les ports TCP/UDP les plus courants.'
  card: 'nslookup, dig, tracert, ss, tcpdump, curl, nmap et les ports TCP/UDP courants, côté Windows et Linux.'
  notice: "Ne scannez ou ne capturez que des réseaux dont vous avez l'autorisation. Une capture peut contenir des mots de passe et des données personnelles."
  docs:
    label: Documentation réseau (Microsoft Learn)
    url: https://learn.microsoft.com/windows-server/networking/technologies/
  fields:
    - { key: equiv, label: Équivalent }
    - { key: pitfall, label: Piège courant }
  cats:
    - { id: dns, label: DNS }
    - { id: connectivity, label: Connectivité et route }
    - { id: ports, label: Ports et sockets }
    - { id: capture, label: Capture et analyse }
    - { id: http, label: HTTP et TLS }
    - { id: portlist, label: Ports courants }
entries:
  - name: nslookup
    cat: dns
    syn: 'nslookup [-type=<type>] <nom> [serveur]'
    desc: 'Interroge un serveur DNS (Windows et Linux).'
    ex:
      - 'nslookup -type=MX contoso.com 1.1.1.1'
      - 'nslookup -type=TXT _dmarc.contoso.com'
      - 'nslookup 8.8.8.8'
    equiv: 'dig, Resolve-DnsName'
    pitfall: 'nslookup utilise la liste de recherche DNS de la machine ; terminez le nom par un point pour éviter les suffixes ajoutés.'
    url: https://learn.microsoft.com/windows-server/administration/windows-commands/nslookup
  - name: dig
    cat: dns
    syn: 'dig [@serveur] <nom> [type] [+short] [+trace]'
    desc: 'Requête DNS détaillée (Linux, macOS, Windows via BIND).'
    ex:
      - 'dig contoso.com MX +short'
      - 'dig @1.1.1.1 contoso.com TXT'
      - 'dig +trace contoso.com'
      - 'dig -x 8.8.8.8 +short'
    equiv: 'nslookup, Resolve-DnsName'
    pitfall: '+trace part des serveurs racine et ignore votre cache : utile pour détecter une délégation incorrecte.'
    url: https://linux.die.net/man/1/dig
  - name: Resolve-DnsName
    cat: dns
    syn: 'Resolve-DnsName <nom> [-Type <type>] [-Server <ip>] [-DnsOnly]'
    desc: "Résolution DNS en PowerShell, sortie sous forme d'objets."
    ex:
      - 'Resolve-DnsName contoso.com -Type MX'
      - 'Resolve-DnsName contoso.com -Server 8.8.8.8 -DnsOnly'
    equiv: 'nslookup, dig'
    pitfall: 'Sans -DnsOnly, la résolution passe aussi par le cache local, LLMNR et NetBIOS.'
    url: https://learn.microsoft.com/powershell/module/dnsclient/resolve-dnsname
  - name: ipconfig /flushdns · resolvectl flush-caches
    cat: dns
    syn: 'ipconfig /flushdns | resolvectl flush-caches'
    desc: "Vide le cache DNS local après un changement d'enregistrement."
    ex:
      - 'ipconfig /flushdns'
      - 'ipconfig /displaydns'
      - 'sudo resolvectl flush-caches'
      - 'sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder'
    alias: [Clear-DnsClientCache]
    equiv: 'Windows, Linux (systemd-resolved), macOS'
    pitfall: 'Le cache du navigateur et celui du résolveur du routeur ou du FAI ne sont pas vidés par cette commande.'
    url: https://learn.microsoft.com/windows-server/administration/windows-commands/ipconfig
  - name: ping
    cat: connectivity
    syn: 'ping [-n|-c <nombre>] <hôte>'
    desc: "Teste l'accessibilité d'un hôte par ICMP."
    ex:
      - 'ping -n 4 8.8.8.8      # Windows'
      - 'ping -c 4 8.8.8.8      # Linux'
      - 'ping -t 192.168.1.1    # Windows : continu, Ctrl+C pour arrêter'
      - 'ping -f -l 1472 8.8.8.8  # Windows : test de MTU (sans fragmentation)'
    equiv: 'Test-NetConnection'
    pitfall: "Beaucoup de pare-feu bloquent ICMP : un ping sans réponse ne prouve pas que l'hôte est hors service."
    url: https://learn.microsoft.com/windows-server/administration/windows-commands/ping
  - name: tracert · traceroute · mtr
    cat: connectivity
    syn: 'tracert <hôte> | traceroute <hôte> | mtr <hôte>'
    desc: 'Affiche les routeurs traversés vers une destination.'
    ex:
      - 'tracert -d contoso.com'
      - 'traceroute -n contoso.com'
      - 'mtr -rwc 50 contoso.com'
      - 'pathping contoso.com'
    equiv: 'Test-NetConnection -TraceRoute'
    pitfall: 'Les étoiles (* * *) ne signalent pas toujours une panne : certains routeurs ne répondent pas aux sondes.'
    url: https://learn.microsoft.com/windows-server/administration/windows-commands/tracert
  - name: ip a · ip r · ip link
    cat: connectivity
    syn: 'ip addr | ip route | ip link'
    desc: 'Adresses, routes et interfaces sous Linux (remplace ifconfig et route).'
    ex:
      - 'ip -br a'
      - 'ip route'
      - 'ip route get 8.8.8.8'
      - 'sudo ip link set eth0 up'
    alias: [ifconfig, route, netstat]
    equiv: 'ipconfig /all, route print, Get-NetIPConfiguration'
    pitfall: 'ifconfig et netstat sont obsolètes et souvent absents des distributions récentes.'
    url: https://man7.org/linux/man-pages/man8/ip.8.html
  - name: route print · Get-NetRoute
    cat: connectivity
    syn: 'route print | Get-NetRoute'
    desc: 'Table de routage Windows.'
    ex:
      - 'route print -4'
      - 'Get-NetRoute -AddressFamily IPv4 | Sort RouteMetric | Select DestinationPrefix,NextHop,InterfaceAlias,RouteMetric'
    equiv: 'ip route'
    pitfall: 'route add sans -p disparaît au redémarrage.'
    url: https://learn.microsoft.com/windows-server/administration/windows-commands/route_ws2008
  - name: arp
    cat: connectivity
    syn: 'arp -a'
    desc: 'Table de correspondance adresse IP / adresse MAC du segment local.'
    ex:
      - 'arp -a'
      - 'ip neigh'
    equiv: 'ip neigh, Get-NetNeighbor'
    pitfall: "Une entrée en double ou changeante pour une même IP signale un conflit d'adresse."
    url: https://learn.microsoft.com/windows-server/administration/windows-commands/arp
  - name: ss
    cat: ports
    syn: 'ss -tulpn'
    desc: 'Sockets en écoute et connexions (remplace netstat sous Linux).'
    ex:
      - 'sudo ss -tulpn'
      - 'ss -tn state established'
      - 'ss -tn dst :443'
    alias: [netstat]
    equiv: 'netstat -ano, Get-NetTCPConnection'
    pitfall: "Sans sudo, le nom du processus propriétaire n'est pas affiché."
    url: https://man7.org/linux/man-pages/man8/ss.8.html
  - name: netstat -ano
    cat: ports
    syn: 'netstat -ano | findstr :<port>'
    desc: "Connexions TCP/UDP Windows avec l'identifiant du processus (PID)."
    ex:
      - 'netstat -ano | findstr LISTENING'
      - 'netstat -ano | findstr :443'
      - 'tasklist /fi "pid eq 1234"'
    equiv: 'ss -tulpn, Get-NetTCPConnection'
    pitfall: 'Le port en TIME_WAIT est normal après une connexion fermée ; il disparaît seul.'
    url: https://learn.microsoft.com/windows-server/administration/windows-commands/netstat
  - name: Test-NetConnection · nc
    cat: ports
    syn: 'Test-NetConnection <hôte> -Port <port> | nc -zv <hôte> <port>'
    desc: "Vérifie qu'un port TCP est joignable."
    ex:
      - 'Test-NetConnection smtp.office365.com -Port 587'
      - 'nc -zv smtp.office365.com 587'
      - 'nc -zvu 10.0.0.5 514'
    equiv: 'telnet, nmap -p'
    pitfall: 'Une réponse « filtré » ou un délai dépassé indique souvent un pare-feu, pas un service arrêté.'
    url: https://learn.microsoft.com/powershell/module/nettcpip/test-netconnection
  - name: nmap
    cat: ports
    syn: 'nmap [-sS|-sT|-sU] [-p <ports>] [-sV] <cible>'
    desc: "Scanne les hôtes et ports ouverts d'un réseau."
    ex:
      - 'nmap -sn 192.168.1.0/24'
      - 'nmap -p 22,80,443 -sV 192.168.1.10'
      - 'nmap -sU -p 53,123,161 192.168.1.1'
    pitfall: 'Scannez uniquement avec autorisation. -sS demande les droits administrateur.'
    url: https://nmap.org/book/man.html
  - name: tcpdump
    cat: capture
    syn: 'tcpdump -i <interface> [filtre] [-w fichier.pcap]'
    desc: 'Capture le trafic en ligne de commande.'
    ex:
      - 'sudo tcpdump -i eth0 -nn host 10.0.0.5 and port 443'
      - 'sudo tcpdump -i any -nn udp port 53 -c 50'
      - 'sudo tcpdump -i eth0 -w capture.pcap'
    equiv: 'Wireshark, pktmon'
    pitfall: 'Utilisez -nn pour ne pas résoudre les noms et les ports (plus rapide, plus lisible) ; la capture exige root.'
    url: https://www.tcpdump.org/manpages/tcpdump.1.html
  - name: pktmon
    cat: capture
    syn: 'pktmon start --capture ; pktmon stop ; pktmon etl2pcap'
    desc: 'Capture réseau intégrée à Windows 10/11, sans logiciel tiers.'
    ex:
      - 'pktmon filter add -p 443'
      - 'pktmon start --capture --comp nics'
      - 'pktmon stop'
      - 'pktmon etl2pcap PktMon.etl --out capture.pcapng'
    equiv: 'tcpdump, Wireshark'
    pitfall: "Invite élevée requise ; convertissez le résultat en pcapng pour l'ouvrir dans Wireshark."
    url: https://learn.microsoft.com/windows-server/networking/technologies/pktmon/pktmon
  - name: curl
    cat: http
    syn: 'curl [-I] [-v] [-L] [--resolve h:p:ip] <url>'
    desc: 'Teste une URL : en-têtes, redirections, temps de réponse, certificat.'
    ex:
      - 'curl -I https://contoso.com'
      - 'curl -vL https://contoso.com -o /dev/null'
      - 'curl --resolve contoso.com:443:203.0.113.10 https://contoso.com -I'
      - "curl -w '%{http_code} %{time_total}s\\n' -o /dev/null -s https://contoso.com"
    alias: [Invoke-WebRequest, iwr]
    equiv: 'Invoke-WebRequest'
    pitfall: "Dans PowerShell 5.1, curl est un alias d'Invoke-WebRequest : appelez curl.exe."
    url: https://curl.se/docs/manpage.html
  - name: openssl s_client
    cat: http
    syn: 'openssl s_client -connect <hôte>:<port> -servername <nom>'
    desc: "Affiche le certificat et la chaîne TLS d'un serveur."
    ex:
      - 'openssl s_client -connect contoso.com:443 -servername contoso.com </dev/null | openssl x509 -noout -dates -subject -issuer'
      - 'openssl s_client -starttls smtp -connect smtp.contoso.com:587'
    pitfall: 'Oubliez -servername et vous obtenez le certificat par défaut du serveur, pas celui du site demandé.'
    url: https://docs.openssl.org/master/man1/openssl-s_client/
  - name: Ports 20/21 · 22 · 23 · 25 (FTP, SSH, Telnet, SMTP)
    cat: portlist
    syn: 'FTP 21 (données 20) · SSH/SFTP 22 · Telnet 23 · SMTP 25'
    desc: 'SFTP utilise le port 22 (SSH) ; FTPS et FTP sont des protocoles distincts. Le port 25 sert au relais entre serveurs de messagerie et est souvent bloqué par les FAI.'
    tags: [tcp, ftp, ssh, sftp, telnet, smtp]
    equiv: 'Test-NetConnection <hôte> -Port 22'
    pitfall: 'Telnet et FTP transmettent en clair : préférez SSH/SFTP.'
    url: https://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xhtml
  - name: Ports 53 · 67/68 · 123 (DNS, DHCP, NTP)
    cat: portlist
    syn: 'DNS 53 TCP/UDP · DHCP 67 (serveur) / 68 (client) UDP · NTP 123 UDP'
    desc: 'DNS passe en TCP pour les grosses réponses et les transferts de zone. DHCP et NTP sont en UDP.'
    tags: [udp, dns, dhcp, ntp]
    pitfall: 'Bloquer le DNS en TCP provoque des échecs sporadiques sur les grosses réponses (DNSSEC, TXT longs).'
    url: https://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xhtml
  - name: Ports 80 · 443 · 8080 · 8443 (HTTP, HTTPS)
    cat: portlist
    syn: 'HTTP 80 · HTTPS 443 (HTTP/3 : UDP 443) · alternatifs 8080, 8443'
    desc: "HTTP/3 (QUIC) utilise UDP 443 : un pare-feu qui ne l'autorise pas force le repli en HTTPS/TCP."
    tags: [web, tcp, udp]
    pitfall: 'Les ports 8080 et 8443 sont conventionnels, pas normalisés.'
    url: https://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xhtml
  - name: Ports 110 · 143 · 465 · 587 · 993 · 995 (messagerie)
    cat: portlist
    syn: 'POP3 110/995 · IMAP 143/993 · SMTPS 465 · soumission SMTP 587 (STARTTLS)'
    desc: 'Les ports 995, 993 et 465 sont en TLS implicite ; 587 démarre en clair puis passe en STARTTLS.'
    tags: [mail, pop3, imap, smtp, tls]
    pitfall: "Microsoft 365 accepte l'envoi authentifié sur 587 avec STARTTLS (smtp.office365.com)."
    url: https://learn.microsoft.com/exchange/mail-flow-best-practices/how-to-set-up-a-multifunction-device-or-application-to-send-email-using-microsoft-365-or-office-365
  - name: Ports 88 · 135 · 389 · 445 · 636 · 3268 (Active Directory)
    cat: portlist
    syn: 'Kerberos 88 · RPC 135 · LDAP 389 · SMB 445 · LDAPS 636 · catalogue global 3268/3269'
    desc: 'Ports principaux entre postes, serveurs et contrôleurs de domaine ; RPC utilise aussi une plage dynamique (49152-65535).'
    tags: [ad, ldap, kerberos, smb, rpc]
    pitfall: 'SMB 445 ne doit jamais être exposé sur Internet.'
    url: https://learn.microsoft.com/troubleshoot/windows-server/networking/service-overview-and-network-port-requirements
  - name: Ports 3389 · 5985/5986 · 5900 (accès distant)
    cat: portlist
    syn: 'RDP 3389 TCP/UDP · WinRM 5985 (HTTP) / 5986 (HTTPS) · VNC 5900'
    desc: "RDP et WinRM sont des cibles fréquentes d'attaques par force brute lorsqu'ils sont exposés."
    tags: [rdp, winrm, vnc, tcp]
    pitfall: "Passez par un VPN ou une passerelle (RD Gateway, Bastion) plutôt que d'ouvrir 3389 sur Internet."
    url: https://learn.microsoft.com/windows-server/remote/remote-desktop-services/clients/remote-desktop-allow-access
  - name: Ports 161/162 · 514 · 1812/1813 (supervision)
    cat: portlist
    syn: 'SNMP 161 / traps 162 UDP · Syslog 514 UDP (6514 TLS) · RADIUS 1812/1813 UDP'
    desc: "Ports courants de supervision et d'authentification réseau."
    tags: [snmp, syslog, radius, udp]
    pitfall: 'SNMP v1/v2c transmet la communauté en clair : préférez SNMPv3.'
    url: https://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xhtml
  - name: Ports 1433 · 3306 · 5432 · 6379 (bases de données)
    cat: portlist
    syn: 'SQL Server 1433 · MySQL/MariaDB 3306 · PostgreSQL 5432 · Redis 6379'
    desc: 'Ports de bases de données courantes : à ne jamais exposer directement sur Internet.'
    tags: [sql, mysql, postgresql, redis, tcp]
    pitfall: "Limitez l'accès par pare-feu aux seuls serveurs applicatifs."
    url: https://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xhtml
