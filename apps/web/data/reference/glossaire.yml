# Glossaire de recherche des cheatsheets françaises : ce que l'on tape en français -> les mots des commandes (souvent en anglais).
# Au build (`pnpm reference:build`), chaque entrée dont le nom, les alias, la syntaxe ou les tags contiennent un mot de `en`
# reçoit les mots de `fr` dans un champ de recherche invisible (`kw`). Exemple : « deleguer » trouve `gam … delegate to`.
# Les accents sont ignorés à la recherche ; un mot de `en` est cherché en début de mot (« forward » trouve « forwardingaddress »).
- fr: [déléguer, délégation, délégué, déléguée, accès boîte]
  en: [delegate, delegates, delegation, mailboxpermission, sendonbehalf]
- fr: [transfert, transférer, rediriger, redirection, renvoi]
  en: [forward, forwarding, forwardingaddress, forwardingsmtpaddress, redirect]
- fr: [mot de passe, mdp, réinitialiser]
  en: [password, passwords, changepassword]
- fr: [utilisateur, utilisateurs, compte, comptes, salarié]
  en: [user, users, aduser, mguser, mailbox]
- fr: [groupe, groupes, liste de diffusion]
