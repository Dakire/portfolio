security:
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
      # Argon2id, paramètres de l'OWASP (12 Mio, 3 itérations, 1 fil — PHP n'en utilise qu'un), adaptés à un hébergement mutualisé.
      algorithm: argon2id
      memory_cost: 12288
      time_cost: 3

  providers:
    app_user_provider:
      entity:
        class: Grichard\Portal\Entity\User
        property: email

  firewalls:
    main:
      lazy: true
      provider: app_user_provider
      # Connexion refusée tant que l'adresse e-mail n'est pas confirmée (vérifié après le mot de passe)
      user_checker: Grichard\Portal\Security\UserChecker
      form_login:
        login_path: app_login
        check_path: app_login
        enable_csrf: true
        default_target_path: app_home
      two_factor:
        auth_form_path: 2fa_login
        check_path: 2fa_login_check
        enable_csrf: true
        default_target_path: app_home
      logout:
        path: app_logout
        target: app_login
      # 5 essais par 15 minutes, par identifiant et par adresse IP
      login_throttling:
        max_attempts: 5
        interval: '15 minutes'

  access_control:
    - { path: ^/login$, roles: PUBLIC_ACCESS }
    - { path: ^/setup$, roles: PUBLIC_ACCESS }
    - {
        path: ^/(inscription|verifier|mot-de-passe-oublie|reinitialiser)(/|$),
        roles: PUBLIC_ACCESS,
      }
    - { path: ^/logout$, roles: PUBLIC_ACCESS }
    # Notifications Paddle (signées) et API des produits (jeton de licence signé) : sans session
    - { path: ^/(webhooks|api)/, roles: PUBLIC_ACCESS }
    # Code de double authentification : seulement entre le mot de passe et la fin de la connexion
    - { path: ^/2fa, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
    - { path: ^/admin, roles: ROLE_ADMIN }
    - { path: ^/, roles: ROLE_USER }

when@test:
  security:
    password_hashers:
      Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
        algorithm: bcrypt
        cost: 4
