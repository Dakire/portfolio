controllers:
  resource:
    path: ../src/Controller/
    namespace: Grichard\Portal\Controller
  type: attribute

# Double authentification (scheb/2fa) : formulaire du code, et chemin de vérification intercepté par le pare-feu
2fa_login:
  path: /2fa
  defaults:
    _controller: 'scheb_two_factor.form_controller::form'

2fa_login_check:
  path: /2fa_check
