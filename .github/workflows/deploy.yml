name: Déploiement

# Production : livrée AUTOMATIQUEMENT après chaque CI verte d'un push sur main (le commit exact testé par la CI).
# À la main (onglet Actions > Déploiement > Run workflow) : retour arrière vers un tag deploy-production-…, portail, simulation.
# Voir docs/deploiement.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Cible
        type: choice
        options: [production, portal]
        default: production
      ref:
        description: Branche, tag ou SHA à livrer (retour arrière = tag précédent)
        type: string
        default: main
      dry_run:
        description: Simulation (ne modifie pas le serveur)
        type: boolean
        default: true

permissions:
  contents: read

# Un seul déploiement à la fois, jamais interrompu en cours de route.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: Construction et contrôles
    # Automatique : seulement une CI réussie, lancée par un push sur main (jamais une PR ni une autre branche).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # lire le résultat de la CI du commit
    outputs:
      target: ${{ steps.params.outputs.target }}
      ref: ${{ steps.params.outputs.ref }}
      dry_run: ${{ steps.params.outputs.dry_run }}
    steps:
      - name: Contrôler les paramètres
        id: params
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          IN_TARGET: ${{ inputs.target }}
          IN_REF: ${{ inputs.ref }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT" = "workflow_run" ]; then
            TARGET=production; REF="$RUN_SHA"; DRY_RUN=false
          else
            TARGET="$IN_TARGET"; REF="$IN_REF"; DRY_RUN="$IN_DRY_RUN"
            [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::ref invalide"; exit 1; }
            if [ "$REF" != "main" ] && [[ ! "$REF" =~ ^(v[0-9]|deploy-) ]]; then
              echo "::error::à la main, on livre depuis main ou depuis un tag (v… ou deploy-…)"
              exit 1
            fi
          fi
          { echo "target=$TARGET"; echo "ref=$REF"; echo "dry_run=$DRY_RUN"; } >> "$GITHUB_OUTPUT"
          echo "Cible : $TARGET · ref : $REF · simulation : $DRY_RUN" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.params.outputs.ref }}
      - name: La CI de ce commit doit être verte
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          ok="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$sha" --status success --json databaseId --jq length)"
          [ "$ok" -ge 1 ] || { echo "::error::aucune CI verte pour $sha : la production ne se livre qu'un commit validé"; exit 1; }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @grichard/web exec playwright install --with-deps chromium # images de partage (OG)
      - name: Construire le site
        if: steps.params.outputs.target == 'production'
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
        run: pnpm --filter @grichard/web build
      - name: Contrat public (URL figées) sur le site construit
        if: steps.params.outputs.target == 'production'
        run: CONTRACT_DIST=apps/web/dist pnpm test:contract
      - name: API PHP sans dépendances de développement
        if: steps.params.outputs.target == 'production'
        working-directory: apps/api
        run: composer install --no-dev --classmap-authoritative --no-interaction --prefer-dist
      - name: Portail sans dépendances de développement
        if: steps.params.outputs.target == 'portal'
        working-directory: apps/portal
        run: composer install --no-dev --classmap-authoritative --no-interaction --prefer-dist
      - name: Assembler la livraison
        env:
          TARGET: ${{ steps.params.outputs.target }}
        run: |
          node --test "scripts/deploy/*.test.mjs"
          node scripts/deploy/assemble.mjs "$TARGET" --build-id "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.params.outputs.target }}
          path: release/
          include-hidden-files: true # .htaccess, .ovhconfig, .well-known
          retention-days: 3
          if-no-files-found: error

  deploy:
    name: Transfert FTP (${{ needs.build.outputs.target }}${{ needs.build.outputs.dry_run == 'true' && ', simulation' || '' }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Environnement GitHub « production » (secrets FTP). S'il exige une validation (Required reviewers), la livraison l'attend.
    environment: production
    permissions:
      contents: read
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftp' }}
      FTP_PORT: ${{ vars.FTP_PORT || '22' }}
      FTP_TLS: ${{ vars.FTP_TLS || 'true' }}
      FTP_VERIFY_CERT: ${{ vars.FTP_VERIFY_CERT || 'true' }}
      FTP_APP_PREFIX: ${{ vars.FTP_APP_PREFIX }}
      DRY_RUN: ${{ needs.build.outputs.dry_run }}
      TARGET: ${{ needs.build.outputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.target }}
          path: release/
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts # pour vitest (contrat) ; aucun script d'installation
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Clé de l'hôte SFTP
        if: env.FTP_PROTOCOL == 'sftp'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t ed25519,ecdsa,rsa -p "$FTP_PORT" "$FTP_HOST" > ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts || { echo "clé de l'hôte introuvable" >&2; exit 1; }
          ssh-keygen -lf ~/.ssh/known_hosts # empreinte à comparer à celle d'OVH si besoin
      - name: Sauvegarde du site en ligne
        if: env.TARGET == 'production' && env.DRY_RUN != 'true'
        run: scripts/deploy/backup.sh "backup-www-$(date -u +%Y%m%d-%H%M%S).tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.TARGET == 'production' && env.DRY_RUN != 'true'
        with:
          name: sauvegarde-avant-deploiement
          path: backup-www-*.tar.gz
          retention-days: 30
      - name: Transférer
        run: scripts/deploy/deploy.sh "$TARGET" release
      - name: Vérifier le site en ligne (contrat public)
        if: env.DRY_RUN != 'true'
        run: |
          if [ "$TARGET" = "portal" ]; then
            # le portail n'est pas dans le contrat public : la page de connexion doit répondre, et noindex
            curl -fsS -o /dev/null -D - https://grichard.eu/espace/login | grep -i "x-robots-tag: noindex"
            exit 0
          fi
          CONTRACT_BASE_URL=https://grichard.eu pnpm test:contract

  tag:
    name: Poser le tag de retour arrière
    needs: [build, deploy]
    if: needs.build.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.ref }}
      - name: Tag
        env:
          TARGET: ${{ needs.build.outputs.target }}
        run: |
          tag="deploy-$TARGET-$(date -u +%Y%m%d-%H%M%S)"
          git tag "$tag"
          git push origin "$tag"
          echo "Tag posé : $tag (retour arrière : relancer ce workflow avec ref = $tag précédent)" >> "$GITHUB_STEP_SUMMARY"
