name: Déploiement

# Déclenché UNIQUEMENT à la main (onglet Actions > Déploiement > Run workflow). Aucun déploiement automatique, jamais.
# Par défaut c'est une SIMULATION (dry_run) : le serveur n'est pas modifié. Voir docs/deploiement.md.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Cible
        type: choice
        options: [preprod, production]
        default: preprod
      ref:
        description: Branche, tag ou SHA à livrer (retour arrière = tag précédent)
        type: string
        default: main
      dry_run:
        description: Simulation (ne modifie pas le serveur)
        type: boolean
        default: true

permissions:
  contents: read

# Un seul déploiement à la fois, jamais interrompu en cours de route.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: Construction et contrôles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # lire le résultat de la CI du commit
    steps:
      - name: Contrôler les paramètres
        env:
          TARGET: ${{ inputs.target }}
          REF: ${{ inputs.ref }}
        run: |
          [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::ref invalide"; exit 1; }
          if [ "$TARGET" = "production" ] && [ "$REF" != "main" ] && [[ ! "$REF" =~ ^(v[0-9]|deploy-production-) ]]; then
            echo "::error::la production se livre depuis main ou depuis un tag (v… ou deploy-production-…)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: La CI de ce commit doit être verte (production)
        if: inputs.target == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          ok="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$sha" --status success --json databaseId --jq length)"
          [ "$ok" -ge 1 ] || { echo "::error::aucune CI verte pour $sha : la production ne se livre qu'un commit validé"; exit 1; }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @grichard/web exec playwright install --with-deps chromium # images de partage (OG)
      - name: Construire le site (production)
        if: inputs.target == 'production'
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
        run: pnpm --filter @grichard/web build
      - name: Construire le site (préproduction, sous /preprod/)
        if: inputs.target == 'preprod'
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          SITE_BASE: /preprod/
          PUBLIC_NOINDEX: '1'
          PREPROD_AUTH_FILE: ${{ vars.PREPROD_AUTH_FILE }}
        run: pnpm --filter @grichard/web build
      - name: Contrat public (70 URL) sur le site construit
        if: inputs.target == 'production'
        run: CONTRACT_DIST=apps/web/dist pnpm test:contract
      - name: API PHP sans dépendances de développement
        working-directory: apps/api
        run: composer install --no-dev --classmap-authoritative --no-interaction --prefer-dist
      - name: Assembler la livraison
        env:
          TARGET: ${{ inputs.target }}
        run: |
          node --test "scripts/deploy/*.test.mjs"
          node scripts/deploy/assemble.mjs "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ inputs.target }}
          path: release/
          include-hidden-files: true # .htaccess, .ovhconfig, .well-known
          retention-days: 3
          if-no-files-found: error

  deploy:
    name: Transfert FTP (${{ inputs.target }}${{ inputs.dry_run && ', simulation' || '' }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Environnement GitHub : la production y exige une validation manuelle (Settings > Environments).
    environment: ${{ inputs.target }}
    permissions:
      contents: read
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_TLS: ${{ vars.FTP_TLS || 'true' }}
      FTP_VERIFY_CERT: ${{ vars.FTP_VERIFY_CERT || 'true' }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ inputs.target }}
          path: release/
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts # pour vitest (contrat) ; aucun script d'installation
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Sauvegarde du site en ligne
        if: inputs.target == 'production' && !inputs.dry_run
        run: scripts/deploy/backup.sh "backup-www-$(date -u +%Y%m%d-%H%M%S).tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.target == 'production' && !inputs.dry_run
        with:
          name: sauvegarde-avant-deploiement
          path: backup-www-*.tar.gz
          retention-days: 30
      - name: Transférer
        env:
          TARGET: ${{ inputs.target }}
        run: scripts/deploy/deploy.sh "$TARGET" release
      - name: Vérifier le site en ligne (contrat public)
        if: ${{ !inputs.dry_run }}
        env:
          TARGET: ${{ inputs.target }}
          CONTRACT_BASIC_AUTH: ${{ secrets.PREPROD_BASIC_AUTH }}
        run: |
          if [ "$TARGET" = "production" ]; then url="https://grichard.eu"; else url="https://grichard.eu/preprod"; fi
          CONTRACT_BASE_URL="$url" pnpm test:contract

  tag:
    name: Poser le tag de retour arrière
    needs: deploy
    if: inputs.target == 'production' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Tag
        run: |
          tag="deploy-production-$(date -u +%Y%m%d-%H%M%S)"
          git tag "$tag"
          git push origin "$tag"
          echo "Tag posé : $tag (retour arrière : relancer ce workflow avec ref = $tag précédent)" >> "$GITHUB_STEP_SUMMARY"
