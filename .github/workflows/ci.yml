name: CI

on:
  push:
    branches: [main, 'refonte/**']
  pull_request:

# Permissions minimales : la CI ne fait que lire le dépôt.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  legacy:
    name: Site actuel (legacy) - lint, tests, e2e, contrat
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Clé de test Cloudflare (publique, passe toujours) : le build exige une clé de site Turnstile.
      VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # le pré-rendu lit l'historique Git pour les dates de dernière modification
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter legacy run lint
      - run: pnpm audit --prod --audit-level high
      - run: pnpm --filter legacy run test
      - run: pnpm --filter legacy exec playwright install --with-deps chromium
      - run: pnpm --filter legacy run test:e2e # construit legacy/dist puis lance Playwright + axe
      - name: Contrat public (70 URL) sur le build
        run: pnpm test:contract
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: legacy/playwright-report/
          retention-days: 7

  web:
    name: Site (Astro) - types, lint, design system, e2e + axe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @grichard/ui test
      - run: pnpm --filter @grichard/tools-core check
      - run: pnpm --filter @grichard/tools-core lint
      - run: pnpm --filter @grichard/tools-core test
      - run: pnpm --filter @grichard/web check
      - run: pnpm --filter @grichard/web lint
      - run: pnpm --filter @grichard/web exec playwright install --with-deps chromium
      - run: pnpm --filter @grichard/web test:e2e
      - run: pnpm --filter @grichard/web test # intégrité de dist/ (liens, hreflang, balisage), construit par l'étape précédente
      - name: Scripts de déploiement (assemblage de la livraison)
        run: |
          node --test "scripts/deploy/*.test.mjs"
          bash -n scripts/deploy/deploy.sh scripts/deploy/backup.sh
      - name: Contrat public (70 URL) sur le nouveau site
        run: CONTRACT_DIST=apps/web/dist pnpm test:contract
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: web-playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  api:
    name: API PHP 8.5 - style, analyse statique, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer audit
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - run: vendor/bin/phpstan analyse --no-progress
      - run: vendor/bin/phpunit

  secrets:
    name: Recherche de secrets (historique complet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
